feature: home-page
source: doc/features/home-page/design.md
version: "1.0-current"

modules:
  - name: phone
    layer: 01-Product
    format: HAP
    change_type: migrate_and_modify
    package_path: "phone"

module_dependencies:
  phone: []

data_models: []

interfaces: []

components:
  - name: Index
    module: phone
    file: "phone/src/main/ets/pages/Index.ets"
    kind: page
    decorator: "@Entry @Component"

files:
  - phone/src/main/ets/pages/Index.ets
  - phone/src/main/ets/phoneability/PhoneAbility.ets
  - phone/src/main/ets/phonebackupability/PhoneBackupAbility.ets
  - phone/src/main/module.json5
  - phone/oh-package.json5
  - phone/build-profile.json5
  - phone/hvigorfile.ts
  - phone/src/main/resources/base/element/string.json
  - phone/src/main/resources/base/element/float.json
  - phone/src/main/resources/base/element/color.json
  - phone/src/main/resources/base/profile/main_pages.json
  - AppScope/app.json5
  - build-profile.json5
  - oh-package.json5

resource_keys:
  phone:
    float:
      - { key: "page_text_font_size", value: "50fp", description: "首页示例文字字号" }

prd_to_code_traceability:
  - { prd_id: "F1", priority: "P0", key_files: ["phone/src/main/ets/pages/Index.ets"] }
