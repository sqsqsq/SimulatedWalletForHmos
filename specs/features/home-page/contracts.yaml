# ============================================================================
# 功能级规约 — 接口契约 (Contracts)
# ============================================================================
# 模块: home-page (钱包首页模块)
# 来源: doc/features/home-page/design.md v1.0
# 用途: 定义该功能模块的接口签名、数据模型、文件清单和组件契约。
#       Harness 读取本文件做接口一致性验证。
#
# 消费者:
#   - harness/scripts/check-coding.ts   (脚本验签名/文件存在性)
#   - harness/prompts/verify-coding.md  (AI 验语义一致性)
#   - skills/3-coding/SKILL.md           (编码时参照)
# ============================================================================

feature: home-page
source: doc/features/home-page/design.md
version: "1.0"

# --------------------------------------------------------------------------
# 模块清单 — 本功能涉及的所有模块及变更类型
# --------------------------------------------------------------------------
modules:
  - name: Phone
    layer: 01-Product
    format: HAP
    change_type: migrate_and_modify
    package_path: "01-Product/Phone"

  - name: WalletMain
    layer: 02-Feature
    format: HAR
    change_type: new
    package_path: "02-Feature/WalletMain"

  - name: AccountManager
    layer: 04-BusinessBase
    format: HAR
    change_type: new
    package_path: "04-BusinessBase/AccountManager"

  - name: CommUI
    layer: 05-SystemBase
    format: HAR
    change_type: new
    package_path: "05-SystemBase/CommUI"

  - name: CommFunc
    layer: 05-SystemBase
    format: HAR
    change_type: new
    package_path: "05-SystemBase/CommFunc"

# --------------------------------------------------------------------------
# 模块间依赖 — 五层架构依赖矩阵
# --------------------------------------------------------------------------
module_dependencies:
  Phone:
    - WalletMain
    - AccountManager
    - CommUI
    - CommFunc
  WalletMain:
    - AccountManager
    - CommUI
    - CommFunc
  AccountManager:
    - CommFunc
  CommUI:
    - CommFunc
  CommFunc: []

# --------------------------------------------------------------------------
# 数据模型定义
# --------------------------------------------------------------------------
data_models:

  - name: UserProfile
    module: AccountManager
    file: "04-BusinessBase/AccountManager/src/main/ets/data/model/UserProfile.ets"
    kind: class
    fields:
      - { name: "isLoggedIn",      type: "boolean",         required: true,  default: "false" }
      - { name: "displayAccount",  type: "string",          required: true,  default: "''" }
      - { name: "avatar",          type: "Resource | null",  required: false, default: "null" }
    computed_properties:
      - { name: "accountText", type: "string", description: "未登录时返回'未登录'，已登录时返回 displayAccount" }

  - name: LoginState
    module: AccountManager
    file: "04-BusinessBase/AccountManager/src/main/ets/data/model/LoginState.ets"
    kind: enum
    values:
      - { name: "NOT_LOGGED_IN", value: "not_logged_in" }
      - { name: "LOGGING_IN",   value: "logging_in" }
      - { name: "LOGGED_IN",    value: "logged_in" }
      - { name: "LOGIN_FAILED", value: "login_failed" }

  - name: ServiceEntry
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/data/model/ServiceEntry.ets"
    kind: interface
    fields:
      - { name: "id",   type: "string",   required: true }
      - { name: "name", type: "string",   required: true }
      - { name: "icon", type: "Resource",  required: true }

  - name: PromoInfo
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/data/model/PromoInfo.ets"
    kind: interface
    fields:
      - { name: "id",          type: "string",   required: true }
      - { name: "title",       type: "string",   required: true }
      - { name: "description", type: "string",   required: true }
      - { name: "image",       type: "Resource",  required: true }

  - name: FinanceEntry
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/data/model/FinanceEntry.ets"
    kind: interface
    fields:
      - { name: "id",   type: "string",   required: true }
      - { name: "name", type: "string",   required: true }
      - { name: "icon", type: "Resource",  required: true }

  - name: SettingEntry
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/data/model/SettingEntry.ets"
    kind: interface
    fields:
      - { name: "id",   type: "string",   required: true }
      - { name: "name", type: "string",   required: true }
      - { name: "icon", type: "Resource",  required: true }

  - name: CardCategory
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/data/model/CardCategory.ets"
    kind: interface
    fields:
      - { name: "id",          type: "string",   required: true }
      - { name: "name",        type: "string",   required: true }
      - { name: "description", type: "string",   required: true }
      - { name: "icon",        type: "Resource",  required: true }

# --------------------------------------------------------------------------
# 服务层接口定义
# --------------------------------------------------------------------------
interfaces:

  # --- AccountManager ---
  - module: AccountManager
    layer: domain/service
    file: "04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets"
    class: AccountService
    methods:
      - name: getUserProfile
        params: []
        return: "Promise<UserProfile>"
        async: true
        description: "获取当前用户信息"

      - name: login
        params: []
        return: "Promise<UserProfile>"
        async: true
        description: "拉起华为账号登录 UI（模拟阶段返回写死数据）"

      - name: logout
        params: []
        return: "Promise<void>"
        async: true
        description: "登出清理"

      - name: onLoginStateChanged
        params:
          - { name: "callback", type: "(state: LoginState) => void" }
        return: "void"
        async: false
        description: "订阅登录状态变更"

      - name: offLoginStateChanged
        params:
          - { name: "callback", type: "(state: LoginState) => void" }
        return: "void"
        async: false
        description: "取消订阅登录状态变更"

  # --- WalletMain / HomeRepository ---
  - module: WalletMain
    layer: data/repository
    file: "02-Feature/WalletMain/src/main/ets/data/repository/HomeRepository.ets"
    class: HomeRepository
    methods:
      - name: getServiceEntries
        params: []
        return: "Promise<Array<ServiceEntry>>"
        async: true
        description: "获取元服务入口列表（模拟数据，至少 3 项）"

      - name: getPromoList
        params: []
        return: "Promise<Array<PromoInfo>>"
        async: true
        description: "获取运营轮播列表（模拟数据，至少 2 项）"

  # --- WalletMain / MineRepository ---
  - module: WalletMain
    layer: data/repository
    file: "02-Feature/WalletMain/src/main/ets/data/repository/MineRepository.ets"
    class: MineRepository
    methods:
      - name: getFinanceEntries
        params: []
        return: "Promise<Array<FinanceEntry>>"
        async: true
        description: "获取金融信息入口列表"

      - name: getSettingEntries
        params: []
        return: "Promise<Array<SettingEntry>>"
        async: true
        description: "获取设置项列表"

  # --- WalletMain / CardRepository ---
  - module: WalletMain
    layer: data/repository
    file: "02-Feature/WalletMain/src/main/ets/data/repository/CardRepository.ets"
    class: CardRepository
    methods:
      - name: getCardCategories
        params: []
        return: "Promise<Array<CardCategory>>"
        async: true
        description: "获取卡种添卡入口列表（5 类）"

      - name: getNonLocalCardCount
        params: []
        return: "Promise<number>"
        async: true
        description: "获取非本机卡片数量（模拟写死）"

# --------------------------------------------------------------------------
# 组件契约 — 页面与子组件的 Props / 事件回调
# --------------------------------------------------------------------------
components:

  # --- Phone 主入口 ---
  - name: Index
    module: Phone
    file: "01-Product/Phone/src/main/ets/pages/Index.ets"
    kind: page
    decorator: "@Entry @Component"
    state:
      - { name: "navPathStack",    decorator: "@Provide('navPathStack')", type: "NavPathStack" }
      - { name: "currentTabIndex", decorator: "@State",                   type: "number" }
    children:
      - HomeTabPage
      - MineTabPage
    nav_destinations:
      - CardPackPage
      - AddCardEntryPage

  # --- 首页 Tab ---
  - name: HomeTabPage
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/presentation/pages/HomeTabPage.ets"
    kind: page
    linked_functions: [F2, F3, F4, F5, F6, F18]
    children:
      - CardGuideSection
      - ServiceGridSwiper
      - PromoSwiper

  - name: CardGuideSection
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/CardGuideSection.ets"
    kind: component
    linked_functions: [F3, F4]
    props: []
    events:
      - { name: "onGoCardPack", description: "点击引导图片或添加管理卡片按钮时触发" }
      - { name: "onGoAddCard",  description: "点击顶部+按钮时触发" }
    children:
      - CardImageBanner

  - name: CardImageBanner
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/shared/components/CardImageBanner.ets"
    kind: component
    linked_functions: [F3]
    props: []
    events:
      - { name: "onTap", description: "点击引导图片时触发" }

  - name: ServiceGridSwiper
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/ServiceGridSwiper.ets"
    kind: component
    linked_functions: [F5]
    props:
      - { name: "services", decorator: "@Prop", type: "ServiceEntry[]" }
    events: []

  - name: PromoSwiper
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/PromoSwiper.ets"
    kind: component
    linked_functions: [F6]
    props:
      - { name: "promos", decorator: "@Prop", type: "PromoInfo[]" }
    events: []

  # --- 我的 Tab ---
  - name: MineTabPage
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/presentation/pages/MineTabPage.ets"
    kind: page
    linked_functions: [F7, F8, F9]
    children:
      - AccountCard
      - "SectionCard (CommUI)"
      - "ActionListItem (CommUI)"

  - name: AccountCard
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/AccountCard.ets"
    kind: component
    linked_functions: [F7]
    props:
      - { name: "user", decorator: "@Prop", type: "UserProfile" }
    events:
      - { name: "onLoginTap", description: "未登录状态点击账号区域时触发" }

  # --- 卡包页 ---
  - name: CardPackPage
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/presentation/pages/CardPackPage.ets"
    kind: page
    nav_destination: "CardPackPage"
    linked_functions: [F10, F11, F12, F13]
    children:
      - "ActionListItem (CommUI)"

  # --- 添卡入口页 ---
  - name: AddCardEntryPage
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/presentation/pages/AddCardEntryPage.ets"
    kind: page
    nav_destination: "AddCardEntryPage"
    linked_functions: [F14, F15, F16]
    children:
      - CardCategoryList

  - name: CardCategoryList
    module: WalletMain
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/CardCategoryList.ets"
    kind: component
    linked_functions: [F16]
    props: []
    events: []
    children:
      - "ActionListItem (CommUI)"

  # --- CommUI 公共组件 ---
  - name: ToastUtil
    module: CommUI
    file: "05-SystemBase/CommUI/src/main/ets/presentation/components/ToastUtil.ets"
    kind: utility
    description: "Toast 弹窗工具"

  - name: ActionListItem
    module: CommUI
    file: "05-SystemBase/CommUI/src/main/ets/presentation/components/ActionListItem.ets"
    kind: component
    props:
      - { name: "icon",  decorator: "@Prop", type: "Resource" }
      - { name: "title", decorator: "@Prop", type: "string" }
    events:
      - { name: "onTap", description: "列表项点击时触发" }

  - name: SectionCard
    module: CommUI
    file: "05-SystemBase/CommUI/src/main/ets/presentation/components/SectionCard.ets"
    kind: component
    description: "通用圆角白底卡片容器"

  # --- CommFunc 工具 ---
  - name: Logger
    module: CommFunc
    file: "05-SystemBase/CommFunc/src/main/ets/shared/log/Logger.ets"
    kind: utility
    description: "日志工具封装"

  - name: FormatUtil
    module: CommFunc
    file: "05-SystemBase/CommFunc/src/main/ets/shared/utils/FormatUtil.ets"
    kind: utility
    description: "格式化工具（账号脱敏等）"

# --------------------------------------------------------------------------
# 状态管理契约
# --------------------------------------------------------------------------
state_management:
  - data: "当前 Tab 索引"
    scope: "Phone 主页面"
    decorator: "@State"
    holder: "Index.ets"
    module: Phone

  - data: "元服务列表"
    scope: "首页 Tab"
    decorator: "@State"
    holder: "HomeTabPage"
    module: WalletMain

  - data: "运营轮播列表"
    scope: "首页 Tab"
    decorator: "@State"
    holder: "HomeTabPage"
    module: WalletMain

  - data: "金融信息列表"
    scope: "我的 Tab"
    decorator: "@State"
    holder: "MineTabPage"
    module: WalletMain

  - data: "设置项列表"
    scope: "我的 Tab"
    decorator: "@State"
    holder: "MineTabPage"
    module: WalletMain

  - data: "用户登录状态"
    scope: "全应用"
    decorator: "AppStorage + 事件订阅"
    holder: "AccountService"
    module: AccountManager

  - data: "卡种列表"
    scope: "添卡入口页"
    decorator: "@State"
    holder: "AddCardEntryPage"
    module: WalletMain

  - data: "NavPathStack"
    scope: "跨页面"
    decorator: "@Provide/@Consume"
    holder: "Index.ets"
    module: Phone

# --------------------------------------------------------------------------
# 路由契约
# --------------------------------------------------------------------------
navigation:
  framework: "Tabs + Navigation"
  nav_stack_provider: "Phone/Index.ets (@Provide)"

  tabs:
    - { index: 0, label: "首页", page: "HomeTabPage" }
    - { index: 1, label: "我的", page: "MineTabPage" }

  destinations:
    - name: "CardPackPage"
      module: WalletMain
      entry_points:
        - "首页引导图片点击"
        - "首页添加管理卡片按钮"
      back_target: "首页 Tab"

    - name: "AddCardEntryPage"
      module: WalletMain
      entry_points:
        - "首页右上角+按钮"
        - "卡包页右上角+按钮"
        - "卡包页添加卡片栏目"
      back_target: "CardPackPage"

  config_files:
    - "02-Feature/WalletMain/src/main/resources/base/profile/main_pages.json"
    - "02-Feature/WalletMain/src/main/resources/base/profile/route_map.json"

