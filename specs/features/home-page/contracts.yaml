# --------------------------------------------------------------------------
# PRD 功能 → 代码文件追溯映射
# --------------------------------------------------------------------------
prd_to_code_traceability:
  - { prd_id: "F1",  priority: "P0", key_files: ["01-Product/Phone/src/main/ets/pages/Index.ets"] }
