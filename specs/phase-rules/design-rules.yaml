# ============================================================================
# Design 阶段规约 (Phase Rules)
# ============================================================================
# 定义技术设计文档（Skill 2 产出）必须满足的通用规则。
# 适用于所有功能模块的 doc/features/{module}/design.md。
#
# 消费者:
#   - harness/scripts/check-design.ts  (脚本 Harness, 确定性检查)
#   - harness/prompts/verify-design.md (AI Harness, 语义级检查)
# ============================================================================

phase: design
version: "1.0"
applies_to: "doc/features/{module}/design.md"

# --------------------------------------------------------------------------
# 结构约束 — 脚本 Harness 可自动检测
# --------------------------------------------------------------------------
structure_checks:

  required_chapters:
    description: >
      设计文档必须包含以下 9 个章节：
      Scope 声明与继承、模块架构图、目录/文件结构规划、数据模型定义、页面组件树、
      状态管理方案、服务层接口定义、路由/导航设计、PRD 功能映射表
    severity: BLOCKER
    rule:
      expected_headings:
        - "Scope 声明"
        - "模块架构图"
        - "目录/文件结构规划"
        - "数据模型定义"
        - "页面组件树"
        - "状态管理方案"
        - "服务层接口定义"
        - "路由/导航设计"
        - "PRD 功能映射表"
      match: "heading_text_contains"

  scope_declaration:
    description: >
      「Scope 声明与继承」章节必须包含 yaml 代码块，
      定义 inherited_from_prd / in_scope_modules / out_of_scope_modules /
      rationale / expansions_with_user_approval 字段；
      in_scope_modules 至少 1 项。
    severity: BLOCKER
    rule:
      section: "Scope 声明"
      expect: "yaml_code_block"
      required_keys:
        - "in_scope_modules"
        - "out_of_scope_modules"
        - "rationale"
      min_items:
        in_scope_modules: 1

  scope_consistency_with_prd:
    description: >
      design.in_scope_modules 必须是 prd.in_scope_modules ∪
      expansions_with_user_approval.modules 的子集；
      design 不得在未经用户批准的情况下声明 PRD.out_of_scope_modules 中的模块。
      这是阻止 AI 自行扩大需求范围的核心 Scope 守门规则。
    severity: BLOCKER
    rule:
      source: "doc/features/{module}/PRD.md > Scope 声明 > yaml"
      target: "doc/features/{module}/design.md > Scope 声明与继承 > yaml"
      assertions:
        - "design.in_scope_modules ⊆ (prd.in_scope_modules ∪ design.expansions_with_user_approval.modules)"
        - "design.in_scope_modules ∩ prd.out_of_scope_modules ⊆ design.expansions_with_user_approval.modules"

  architecture_diagram:
    description: >
      「模块架构图」章节必须包含至少一个 Mermaid 代码块，
      展示模块间依赖关系
    severity: BLOCKER
    rule:
      section: "模块架构图"
      expect: "mermaid_block"

  module_change_table:
    description: >
      必须包含模块变更摘要表，列明每个涉及模块的所属层、物理路径、
      格式（HAP/HAR）、变更类型（新增/修改/迁移）
    severity: BLOCKER
    rule:
      expect: "markdown_table"
      required_columns:
        - '"模块" or "Module"'
        - "所属层"
        - "格式"
        - "变更类型"

  file_structure_per_module:
    description: >
      每个涉及的模块必须有目录/文件结构规划，精确到 .ets 文件路径，
      使用代码块展示树形结构
    severity: BLOCKER
    rule:
      section: "目录/文件结构规划"
      per_module:
        expect: "code_block_with_tree"

  data_model_typed:
    description: >
      数据模型定义必须使用 TypeScript/ArkTS 代码块，
      包含字段名、类型、说明；不允许使用 any 类型
    severity: BLOCKER
    rule:
      section: "数据模型定义"
      expect: "typescript_code_block"
      forbidden_types: ["any"]

  interface_signatures_complete:
    description: >
      服务层接口定义中，所有方法必须包含完整的方法签名：
      方法名、入参（名+类型）、返回类型、是否异步
    severity: BLOCKER
    rule:
      section: "服务层接口定义"
      per_method:
        required_fields:
          - "method_name"
          - "parameters_with_types"
          - "return_type"

  component_tree_per_page:
    description: >
      每个页面必须有对应的组件树，使用树形文本图展示层级关系
    severity: MAJOR
    rule:
      section: "页面组件树"
      per_page:
        expect: "tree_diagram"

  prd_mapping_table:
    description: >
      「PRD 功能映射表」必须是 Markdown 表格，至少包含
      PRD 编号、功能名称、优先级、实现模块、关键文件 五列
    severity: BLOCKER
    rule:
      section: "PRD 功能映射表"
      expect: "markdown_table"
      required_columns:
        - '"PRD 编号" or "PRD 功能编号"'
        - "功能名称"
        - "优先级"
        - "实现模块"
        - "关键文件"

  state_management_table:
    description: >
      「状态管理方案」章节必须包含状态分类表，列明数据、作用域、
      使用的装饰器/机制、持有者
    severity: MAJOR
    rule:
      section: "状态管理方案"
      expect: "markdown_table"
      required_columns:
        - "数据"
        - '"装饰器" or "机制"'

  route_design_table:
    description: >
      「路由/导航设计」章节必须包含页面跳转关系表或 Mermaid 图，
      明确每个 NavDestination 页面的名称和所属模块
    severity: MAJOR
    rule:
      section: "路由/导航设计"
      expect_any_of: ["markdown_table", "mermaid_block"]

  metadata_header:
    description: >
      设计文档顶部必须包含模块标识、对应 PRD 路径、版本、状态等元数据
    severity: MINOR
    rule:
      expect: "blockquote_metadata"
      required_fields:
        - "模块标识"
        - "对应 PRD"
        - "版本"
        - "状态"

# --------------------------------------------------------------------------
# 语义约束 — AI Harness 做语义级检查
# --------------------------------------------------------------------------
semantic_checks:

  five_layer_compliance:
    description: >
      所有模块必须放在正确的五层架构中：
      01-Product / 02-Feature / 03-CommonBusiness / 04-BusinessBase / 05-SystemBase。
      依赖方向只能自上而下，不允许逆向依赖
    severity: BLOCKER
    ai_prompt_hint: >
      审查模块架构图和依赖关系：(1) 每个模块是否在正确的层；
      (2) 依赖箭头是否全部自上而下；(3) Feature 子层级规则是否满足

  module_internal_layer_compliance:
    description: >
      每个模块的文件路径必须符合 shared/data/domain/presentation 四层规则，
      文件应位于正确的内部层级
    severity: BLOCKER
    ai_prompt_hint: >
      逐个文件检查路径是否符合四层规则：
      常量→shared，模型→data/model，仓库→data/repository，
      服务→domain/service，页面→presentation/pages，组件→presentation/components

  module_minimality:
    description: >
      仅创建 PRD 功能实际需要的模块，不允许预创建无明确需求的模块
    severity: MAJOR
    ai_prompt_hint: >
      检查每个新增模块是否有 PRD 中的功能点直接驱动，
      没有被 PRD 功能引用的模块应被质疑

  feature_split_accuracy:
    description: >
      功能拆分到模块的决策是否合理：
      账号相关 → AccountManager，通用 UI → CommUI，
      工具能力 → CommFunc，页面 UI → Feature 层对应模块
    severity: MAJOR
    ai_prompt_hint: >
      逐条审查功能拆分表，判断每个功能点是否分配到了职责最匹配的模块

  data_type_legality:
    description: >
      数据模型字段类型必须是 ArkTS 合法类型
      （string、number、boolean、Resource、Array、枚举等），
      不允许使用 any 或未定义的自造类型
    severity: BLOCKER
    ai_prompt_hint: >
      审查所有数据模型定义中的字段类型，确认都是 ArkTS 合法类型

  no_tbd_in_p0_p1:
    description: >
      P0/P1 范围内不允许存在"待定"、"TBD"、"TODO"等未决标记
    severity: BLOCKER
    ai_prompt_hint: >
      搜索文档中所有 P0/P1 相关内容，检查是否存在 TBD/待定/TODO 标记

  architecture_doc_consistency:
    description: >
      设计文档中的模块清单、依赖关系必须与 doc/architecture.md 一致；
      若不一致，必须说明差异原因
    severity: MAJOR
    ai_prompt_hint: >
      对比 design.md 和 architecture.md 的模块清单和依赖关系，
      标出不一致之处

  navigation_flow_consistency:
    description: >
      路由/导航设计中的页面跳转关系必须与 PRD 中的业务流程图一致
    severity: MAJOR
    ai_prompt_hint: >
      对比 design.md 的路由设计和 PRD 的业务流程图，
      每条跳转路径是否都有对应

# --------------------------------------------------------------------------
# 追溯约束 — 脚本 + AI 联合检查
# --------------------------------------------------------------------------
traceability_checks:

  prd_p0_coverage:
    description: >
      PRD 中每个 P0 功能点必须在「PRD 功能映射表」中有至少一行映射
    severity: BLOCKER
    rule:
      source: "PRD.md > 功能清单"
      filter: 'priority == "P0"'
      target: "design.md > PRD 功能映射表"
      link_field: "PRD 编号"
      coverage: "100%"

  prd_p1_coverage:
    description: >
      PRD 中每个 P1 功能点必须在映射表中有至少一行映射
    severity: BLOCKER
    rule:
      source: "PRD.md > 功能清单"
      filter: 'priority == "P1"'
      target: "design.md > PRD 功能映射表"
      link_field: "PRD 编号"
      coverage: "100%"

  mapping_to_file:
    description: >
      映射表中每行的「关键文件」必须能在「目录/文件结构规划」中找到
    severity: BLOCKER
    rule:
      source: "PRD 功能映射表.关键文件"
      target: "目录/文件结构规划"
      match: "file_path_exists"

  acceptance_to_interface:
    description: >
      PRD 的验收标准中涉及数据展示/操作的 AC 项，
      应能在设计文档的数据模型或接口定义中找到支撑
    severity: MAJOR
    ai_prompt_hint: >
      对每条 PRD 验收标准，判断 design.md 中是否有对应的数据模型、
      接口方法或组件来支撑该验收标准的实现

  design_to_architecture:
    description: >
      设计文档中新增/修改的模块信息必须反映到 doc/architecture.md
      的模块清单和变更记录中（Skill 2 的 Step 11 要求）
    severity: MAJOR
    rule:
      source: "design.md > 模块变更摘要"
      target: "doc/architecture.md > 模块清单"
      expect: "all_modules_registered"
