# 实例扩展 spec 阶段规则 overlay（知识判断在验收里的承接）
# 经 manifest provides.phase_rules_overlays.spec 注册；semantic_checks 由 AI verifier 消费（零脚本改动）。
#
# spec 是施工单位的需求规格：知识的判断在已准入的设计里（CU 的蓝图知识应用决定，非 CU 维护 Feature 契约里的
# knowledge_applications），本阶段核的是验收有没有承接这些判断要求的行为与验证责任。
phase: spec
version: "2.0"
semantic_checks:
  knowledge_acceptance_bridge:
    description: >
      spec 要能交给 plan 去设计：先沿本施工单位的业务流程走一遍（实际会发生的正常、异常与未执行路径各到哪、结果由谁得到），
      再对着审查任务里并列的知识原文与设计判断看验收。本施工单位承接的每条适用判断，验收里有条目写出它要求的
      可观察行为与验证责任（条件、结果、谁来验），带 knowledge_rule 与 knowledge_decision_id 只是桥，编号出现不等于承接；
      只把规约换句话说一遍、条件与结果说不清、验证责任与知识声明的执行体对不上的，FAIL。
      关键结论有源材料、已准入设计或已定决定支持；项目知识里的参考例子只示范方法，不以例子的名称、数值或行数当答案。
      判断本身站不住（不适用的依据回查不到事实、豁免缺理由或补偿）时，点名交设计负责方修订，不在 spec 里改判。
      机械层已经核过桥接编号与决定在不在；验收不可判定、让下游必须重新决定的，按阻断判。
    severity: BLOCKER
    ai_prompt_hint: >
      先按业务流程读 spec 与验收，记下走不通的地方；再逐条看审查任务里本施工单位承接的适用判断：对着规约原文，
      承接它的验收条目写的行为与验证责任是不是这条规约在本需求上要求的那件事。
      **不要逐条对账、不要出裁决表、不要为每条结论找一段够长的引文**——那样抄的量随条数涨，判断不增加。
      details 写判出问题的那几条：哪一条判断、问题是什么、依据是产物或材料里的什么事实；判不出问题就写清看了哪几条。

# 作者起手内容的读没读过：唯一的机械留痕。
# 本阶段的作者要求由作者动笔前自己取（入口见 story-knowledge Skill），取到之后没有任何东西能证明它被读了——
# 除非作者把来源坐标写进 framework `context-exploration` 的 `key_inputs_read`。
# 这里把那条路径声明为本阶段的必需片段，既有门禁 `context_exploration_inputs_coverage`
# 就会在没写时 FAIL。**不新增门禁、状态或字段**，只是给既有门禁多一个必需项。
# 字符串就是那份原则页的仓内相对路径，逐字一致。
exploration_thresholds:
  phase_input_snippets_extra:
    - doc/extensions/hooks/spec/author.md
