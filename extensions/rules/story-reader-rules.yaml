# Story 的独立人读审查判据 —— 唯一位置。
# 读者审查的任务由 hooks/shared/reader-review-task.mjs 生成（story-build review --action prepare），
# 把这里的判据与本需求这一次的输入一起交给独立审查者；Spec 阶段不再承担 Story 的判据。
version: "2.0"
semantic_checks:
  story_reader_review:
    description: >
      归档叙事件的独立审查：读者拿这一份能不能读懂这个需求。审查对象是最终的
      `doc/features/{module}/AR/story.md`，与它一起交付的 Review、设计附件，输入是它据以成文的东西——材料清单
      `AR/story-src/materials.json` 指向的每一份材料、交给设计的冻结输入（`AR/story-src/inputs/<版本>/`）、
      `AR/story-src/story-flow.json` 里已确认的本 AR 范围、`AR/story-src/decisions.json` 里已登记的判断、
      已准入蓝图与它的原生评审投影（设计事实的权威）、激活知识原文，
      以及作者的写作设计 `AR/story-src/story-template.md`（待核的作者判断，不是标准）。
      按**读者会问什么**审查：每章要回答的读者问题与章级质量维度（含图与文的配合）写在
      `doc/extensions/skills/story/contracts/story-chapters.json`（`chapters[].questions`
      与 `verdicts.chapter_dimensions`），按那份合同审，不另立标准；另核图种合不合读者要判断的那件事、判断与事实是否分开。
      **一致性分两层核**：① 原始决定（材料原文、会议原话、人的裁决、评审回稿）与蓝图的设计是否一致；
      ② 蓝图的设计与人读件（Story 正文、附录、Review、设计附件）是否一致。两层各自成立才算一致：
      人读件忠实复述了一份与原始决定相反的蓝图主张，仍是阻断发现，修正责任写回蓝图负责方。
      **不做逐条对账、不出裁决表**：把材料一条条比回 story、给每条打一个勾，
      抄的量随材料条数涨，读者得到的判断却不增加；例外是任务书里仍开着的选择与会议话题，按那几节的要求逐条给结论。
      你要判的是机器判不了的那一类：这件事讲了没有、讲清没有、是不是编的。
      结论只有两类，见 ai_prompt_hint。`AR/story.md` 不存在时照实写读不到，不凭空作答。
    severity: BLOCKER
    ai_prompt_hint: >
      **先独立想清楚，再看作者怎么安排**：先按原材料、已确认范围、已准入蓝图与已登记的判断，
      想清楚这个需求要让读者读懂哪些事实、关系与决定；再读写作设计，用它定位作者打算在哪讲、
      为什么这样组织——设计漏掉的不因此算不在范围，写了理由不等于理由成立；
      任务书列了写作设计的调整记录时，核那几处改动之后原来要解释的关系还在不在。
      写作设计选了形式要讲清的关系（条件、分支、往返、状态、责任），成稿里读者能不能真正理解；没兑现又没在调整记录里说明的算问题，
      有更好的组织并写明理由的不算——判的是关系讲没讲清，不是图或表在不在、数量够不够。
      骨架把答案复述成设计、或正文因为骨架没列就漏掉了有效关系，都算问题；写作设计多长、待核几条，都不是合格条件。
      最后读 story，按章过合同里的读者问题与维度——**附录（含脚本投影的几节）与设计附件也是读者看到的内容**，
      附录里接口、数据与规约的业务摘要与设计附件说的是同一件事，改变决定或验收的精确约束没有丢。
      任务书按数据分节给了会议逐话题、仍开着的选择、登记成已定的条目、来源图与采用它的图、回看清单、材料里的图：
      每一节怎么核写在那一节开头，结论按下面两类记。**会议不因为更新就压过文档**：没有人的裁决而改了已定口径的，算问题，
      去向是摆给人裁决（要重拍范围的 reopen）。
      **这几类事实按具体语义核**，名称或字段齐全不算讲清：结果未知（超时、回调未到、查询失败）的情形写成了未知、
      待确认还是被当成确定的成功或失败；业务请求要用的对方身份与只供展示的脱敏值是否分开、一路传得到；
      本地缓存或暂存的有无是否被拿来推断云侧的业务状态；新增的页面、入口与路由有没有实际接入者、用户走得到；
      统计指标的分子、分母、时间范围与来源是否与材料一致，自设的观察项是否另起名字、写明谁认；
      同一个数值约束在正文、附录、Review 与施工文档里是否同值同义——换算要对得回原值与单位，比例换了分母不算一致，
      不同适用条件下的不同值不算冲突；来源要回到实际文件的段落或条目核语义，回查不到的泛称不算来源；
      引用块里放的是有出处的业务原话，还是该删的模板残文。
      报告里只写两类发现：
      **阻断发现** —— 严重性按读者要完成的判断定，不按章数、图数、参与方个数：
      关键业务事实缺失或把已确认的事实写反、核心章只剩空泛短句、材料与已登记判断都不支持的
      确定结论（编造，含没有依据的确定数值承诺）、数值换算错误或漂移改变了验收、还开着的决定被写成已定的方案、登记成 `settled` 的条目指不出人的表态（伪定案）、
      材料之间的冲突由作者自行选定一边而改变了明确的验收或范围口径（术语确认不等于批准业务改动）、
      核心动作缺少必要的契约或数据又没写明限制、前后矛盾、超出或漏掉已确认范围、验收条件无法判定、
      上面两层一致性的任一层不成立（在交付前就阻断，不留给后续阶段）、
      图前声称覆盖的关键关系在图里缺去向而正文也没让整个过程真正成立（「正文提到过」不算闭合）、
      上游的图被合并或改画后丢了原图讲的调用方、被调方、返回结果或失败后的责任与状态、
      实现选型（存储介质、内部结构这类换个实现方案结论就变、又不改对外承诺的事）出现在待确认区，
      或蓝图里还没形成施工值的实现项没写明由哪个阶段定，
      以及规约或知识判定的依据只回显条目名称、复述规约原文、说不出它落在本需求的哪个具体事实上。
      逐项先写清：在哪一章哪一句、缺的或错的是什么、对读者的影响是什么、最早出错的责任位置；引用材料或 story 时抄原文定位，不要复述。
      再按上面的类别定严重程度：BLOCKER（事实缺失或写反、编造、替人定了开着的决定）或 MAJOR（其余阻碍读者完成判断的）；
      验收里没有对应编号、错误源自上游，都不降低严重程度。
      **建议** —— 不影响正确、完整与可执行的表达建议（标题、措辞偏好、一段是不是讲了几件独立的事；正文里指着文档说话的句子——本章 / 本节 / 这张图 / 下表 / 如下——与章开场白，是读者要跳过的一段），
      严重程度 MINOR 或 INFO，不阻止通过。
      判据是**内容**不是形态：同一件事写成表还是写成段、标题怎么起、几个小节，都不构成 finding；
      图文配合与长段落的意见要指出具体理解障碍——读者在哪一处、因为缺了什么读不懂；字数、段数、图数或某种句式本身不是理由；
      十章齐全、字数不少而某一章只有空泛短句，是阻断发现。
      真实待决写清了边界、相关行为没被说成已实现，可以交人审；把端侧不存在的服务器侧动作说成本特性行为要指出。
      原件或看图能力缺席使某项判断做不了时，写明未验证与影响，不要写成已读、已验。
      **跨章对着读这几问**（同一个条件在流程里说一套、在验收里说另一套时，两章各自都说得通，只有对着读才看得出来）：
      ① 决定用户能否继续的关键条件，在流程、功能说明、异常与恢复、验收四处说的是不是同一件事；
      ② 图里每条路径要么走到终态、要么接回某个节点；
      ③ 附录那些非实体落点写的是实际影响对象，「页面」「资源」这种泛称等于没写落点；
      ④ 上游画出来的每条路径 story 讲到了、讲在合适的章——主路径之外的那几条最容易整条没人讲；
      ⑤ 业务流程章的端到端过程与分支去向按流程章的读者问题判，**判的是总览与局部加起来**：
      一条分支去向在总览与局部两处都没有，才是 finding；全部节点挤进一张图、总览少画一条在局部完整展开的分支、
      与上游那张长得一样，本身都不是问题；只复制上游契约图而不回答这些事是 finding。
      **协作次序按实际关系判，不按参与方个数**：存在「谁先调谁、结果回到谁」的往返或先后依赖，图就要讲清它——
      两方之间也可能有复杂往返，多方单向直通反而不需要；只画了「有哪些方」的图答不了次序与回程；
      ⑥ 回看清单逐条核去向；
      ⑦ 每条议题的「依据」指得出撞点——story 哪一章或蓝图哪个设计对象的哪个主张，与哪份材料的
      哪一节、哪条工程事实或规约相撞；只有「根据材料」一类没有指向的话，算没写依据。
      **材料里的图逐张三问**：story 用了没有；用了的，这张图属不属于本需求——不属于本需求的图进了正文是 finding；
      没用的，它给的理由成不成立——没有理由又没在 story 里露面的图是缺口。
      **结果按任务书「报告怎么写」的 Story 报告写，本项不设例外**：「判据核对」表后的审查方法写你逐章过了什么——**不许空**，
      空证据与没审同形；有会议材料时要能看出每个话题的去向，写法不限，话题有漏或去向说不出来与没审同形。
      阻断发现与建议逐条进「发现」；没有发现时「发现」只留表头。
