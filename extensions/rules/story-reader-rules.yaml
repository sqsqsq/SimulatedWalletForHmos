# Story 的独立人读审查判据 —— 唯一位置。
# 读者审查的任务由 hooks/shared/reader-review-task.mjs 生成（story-build review --action prepare），
# 把这里的判据与本需求这一次的输入一起交给独立审查者；Spec 阶段不再承担 Story 的判据。
version: "2.0"
semantic_checks:
  story_reader_review:
    description: >
      归档叙事件的独立审查：读者拿这一份能不能读懂这个需求。审查对象是最终的
      `doc/features/{module}/AR/story.md`，与它一起交付的 Review、设计附件，输入是它据以成文的东西——材料清单
      `AR/story-src/materials.json` 指向的每一份材料、交给设计的冻结输入（`AR/story-src/inputs/<版本>/`）、
      `AR/story-src/story-flow.json` 里已确认的本 AR 范围与关卡人签、`AR/story-src/decisions.json` 里已登记的判断、
      蓝图与它的原生评审投影（设计事实的权威）、激活知识原文，
      以及作者的写作设计 `AR/story-src/story-template.md`（待核的作者判断，不是标准），update 开着时还有这一轮的 before。
      **从原件反查成果**，不只在作者登记过的集合里找错，按 ai_prompt_hint「核的先后」：先判来源效力，再判关系成立、
      表达承接，最后才是跨件一致与表达。作者的决定登记与写作设计同属待审对象，不是依据。
      按**读者会问什么**审查：每章要回答的读者问题与章级质量维度（含图与文的配合）写在
      `doc/extensions/skills/story/contracts/story-chapters.json`（`chapters[].questions`
      与 `verdicts.chapter_dimensions`），按那份合同审，不另立标准。
      图与文的配合每张图问三件：图前是不是说清了读者看这张图要看出什么；图后是不是用列表补上了图里没表达的条件、
      责任与结果，图已讲清的没有复述也没有凑话；图种合不合读者要判断的那件事。再看呈现：读者追这张图的主线、分支或回退、
      角色或时间对应有明显困难而没做同图增强算遗漏，已做的增强 SVG 反而更难读也算问题；原图已清楚的不做是对的，
      没有新业务信息不是不做的理由，不按图数或复杂度要求每张都做——已有增强资产及状态见任务书。另核判断与事实是否分开。
      **一致性分两层核**：① 原始决定（材料原文、会议原话、人的裁决、评审回稿）与蓝图的设计是否一致；
      ② 蓝图的设计与人读件（Story 正文、附录、Review、设计附件）是否一致。两层各自成立才算一致：
      人读件忠实复述了一份与原始决定相反的蓝图主张，仍是阻断发现，修正责任写回蓝图负责方。
      **不输出把材料逐条抄回的对账表**，但影响承诺的决定、完整关系与表达承接要有实际对照：结论指到本次依据与产物里的具体行为，
      「已标待定」「表已齐」「各章均有」不是结论；例外是任务书里仍开着的选择与会议话题，按那几节的要求逐条给结论。
      你要判的是机器判不了的那一类：这件事讲了没有、讲清没有、是不是编的。
      结论只有两类，见 ai_prompt_hint。`AR/story.md` 不存在时照实写读不到，不凭空作答。
    severity: BLOCKER
    ai_prompt_hint: >
      **先独立想清楚，再看作者怎么安排**：先按原材料、已确认范围、蓝图与已登记的判断，
      想清楚这个需求要让读者读懂哪些事实、关系与决定；再读写作设计，用它定位作者打算在哪讲、
      为什么这样组织——设计漏掉的不因此算不在范围，写了理由不等于理由成立；
      任务书列了写作设计的调整记录时，核那几处改动之后原来要解释的关系还在不在，没有这份文件不算缺件。
      写作设计选了形式要讲清的关系（条件、分支、往返、状态、责任），成稿里读者能不能真正理解；没兑现又没在调整记录里说明的算问题，
      有更好的组织并写明理由的不算——判的是关系讲没讲清，不是图或表在不在、数量够不够。
      骨架把答案复述成设计、或正文因为骨架没列就漏掉了有效关系，都算问题；写作设计多长、待核几条，都不是合格条件。
      **核的先后**：
      ① **来源效力**：先读任务书「关卡人签」与登记条目澄清正文里引用的问答原话（问题、选项与人的回答：对话里明确答过的同样有效，
      不因评审记录没勾、缺额外凭证而重问），再核「先核」一节的每条 open 与「登记成已定」的每条：原话允许什么，作者解释有没有增删含义。
      原始授权没有允许的行为，即使蓝图、Story 与验收完全一致也不成立；「保持待定」「定案前按此实施」「候选」不授权其中任何一个备选。
      每条 open 写一句结论：自己从正文、附录、Review 与蓝图找依赖它的动作、状态迁移与验收，不按作者声称已覆盖的位置缩小范围，
      只写了共同要求还是已替人选了一边——各选项（含保持待定）都会有的行为才是共同要求，只属于某一选项的做法或数值出现就是替人选边，
      判的是后果，不是有没有「待定」二字；这些结论写在「判据核对」表后的审查方法里，替人选边的同时在「发现」表记一条。
      作者说稍后问人、后文却把它当已定前提用的，算未完成。反过来，既定规范或知识已要求的工程义务、可替换的局部实现不需要人再选，
      被列成待人裁定的议题也写进结论。缺依据写影响与该谁定，不建议把未获准的行为补进别的文件。
      ② **关系成立**：沿原材料的每条主旅程核条件、角色交接、状态变化、结果未知与正常/失败去向。正文提到某个概念不等于这条关系成立；
      状态图的边要写状态改变的条件，只画用户点击不算。用户旅程是主体：人从哪里进入、看到哪个页面、怎样操作、得到什么反馈、
      完成或异常后去哪里，回界面原图、交互说明与已登记判断看；系统调用或业务状态图代替不了它，页面表不是硬要求，
      「提示可重试」这类空话不算去向；编了材料与判断都没有的页面、提示或跳转，同样记发现。没有页面的业务按参与方与数据生命周期核。
      上游图换成表或文字的，对着任务书并排的原图与承接小节核参与方、条件、请求与返回、结果、失败责任与后续状态连不连得起来：
      等效改表照常通过，只剩动作或术语才算丢了关系；表或正文能承接的不强制加图，重复的流程没有新关系价值的应收敛。
      ③ **表达承接**：先独立提出当前最容易混淆的关系（几个对象的状态不同步、跨方交接、共同条件与失败边界），再按 图＞表格＞列表＞章节＞文字
      判它落在的载体讲清没有：时序要看得到参与方、先后、调用与返回、等待与失败责任，状态要看得到触发条件与终态。
      只在几节文字里各提一句、要读者自己拼的，写出具体的阅读问题与它该由哪种载体讲清，不指定张数；图数、颜色、标题都不是依据，必要的重现不是重复。
      ④ 最后按任务书给的阅读段顺序逐段读盘上原文（每段从这个标题读到下一个标题之前），按章过合同里的读者问题与维度，
      并核跨件关系——**附录（含脚本投影的几节）与设计附件也是读者看到的内容**，与正文同样要核，不因为它由脚本生成就豁免；
      附录里接口、数据与规约的业务摘要与设计附件说的是同一件事，改变决定或验收的精确约束没有丢。
      读不到或读到的与摘要对不上，写明哪几段未审，材料变了重取当前请求，不把不同版本的局部判断拼在一起。
      **附录材料表按任务书「材料与来源」核，不信作者表自报完整**：机器只核了来源覆盖、重复与链接；
      每行的贡献是不是那几份原件真给的、采用的是不是当前版本、合成一稿的原件是否都在同一行、
      未采用的理由站不站得住，回原件与阅读稿看——错版、编造贡献、漏掉的业务内容都由你发现。
      **会议按「话题 → 原话 → 人选的那一项 → 最终结论」逐条核**：回 `raw.md` 与 `corrections.json` 自己看原文，不只看模型纠偏之后的样子——
      话题有没有漏、会议判断与当前结果有没有写出会上没说的、没收敛的有没有被替人定成结论、
      纠偏有没有改了意思、引用的行范围指的是不是那句话、当前结果里的结论与人真选的那一项是不是同一件事、
      仍未决的有没有传到产物里。**会议不因为更新就压过文档**：没有人的裁决而改了已定口径的，算问题，
      去向是摆给人裁决（要重拍范围的 reopen）。
      **这几类事实按具体语义核**，名称或字段齐全不算讲清：结果未知（超时、回调未到、查询失败）的情形写成了未知、
      待确认还是被当成确定的成功或失败；业务请求要用的对方身份与只供展示的脱敏值是否分开、一路传得到；
      本地缓存或暂存的有无是否被拿来推断云侧的业务状态；新增的页面、入口与路由有没有实际接入者、用户走得到；
      统计指标的分子、分母、时间范围与来源是否与材料一致，自设的观察项是否另起名字、写明谁认；
      同一个数值约束在正文、附录、Review 与施工文档里是否同值同义——换算要对得回原值与单位，比例换了分母不算一致，
      不同适用条件下的不同值不算冲突；来源要回到实际文件的段落或条目核语义，回查不到的泛称不算来源；
      引用块里放的是有出处的业务原话，还是该删的模板残文。
      报告里除 open 议题的逐条结论（写在审查方法里）之外，只写两类发现：
      **阻断发现** —— 严重性按读者要完成的判断定，不按章数、图数、参与方个数：
      关键业务事实缺失或把已确认的事实写反、核心章只剩空泛短句、材料与已登记判断都不支持的
      确定结论（编造，含没有依据的确定数值承诺）、数值换算错误或漂移改变了验收、还开着的决定被写成已定的方案、
      外部状态操作的结果未知被写成确定的成功或失败、新意见改掉仍有效的约束而没有有权人的裁定、
      原件里要人定的事没有登记、知识义务挂错了实体或行为、核心实现仍要业务裁决却写成已定、
      **登记成 `settled` 的条目拿不出人的表态**（按①回关卡人签、引用的问答原话、材料、会议原话与评审记录核：要人表态才成立的事——业务口径、
      对外承诺、处置标「（评审动作）」的规约条目——依据指不出那个人在哪说过就是伪定案，本该是 `open`；`decider` 有名字只说明该谁定，
      转述（只写「用户已同意」而不引问答）、计划与作者的推荐都不是表态；判的是来源不是形态，`settled + confirm` 是正常形态，人工区空着也不证明无人表态；
      材料原文只是依据的出处，不能顶替人的表态；材料直接给定、或由已定结论推出的事本就不用人签，登记成议题是多余的一条，按建议记）、
      材料之间的冲突由作者自行选定一边而改变了明确的验收或范围口径却拿不出人的裁决依据
      （术语确认不等于批准业务改动，能解释一种方案也不等于获得授权）、
      核心动作缺少必要的契约或数据又没写明限制、前后矛盾、超出或漏掉已确认范围、验收条件无法判定、
      上面两层一致性的任一层不成立（在交付前就阻断，不留给后续阶段）、
      图前声称覆盖的关键关系在图里缺去向而正文也没让整个过程真正成立（「正文提到过」不算闭合）、
      上游的图换载体后丢了②里的关系（节点同名、登记了承接位置不等于关系还在；断链、只留正常分支、表里把条件写错都算）、
      关键的时序、状态或交接关系只散在文字里而读者拼不出（按③：参与方、先后、条件或终态丢了）、
      实现选型（存储介质、内部结构这类换个实现方案结论就变、又不改对外承诺的事）出现在待确认区，
      或蓝图里还没形成施工值的实现项没写明由哪个阶段定，
      以及规约或知识判定的依据只回显条目名称、复述规约原文、说不出它落在本需求的哪个具体事实上。
      逐项先写清：在哪一章哪一句、缺的或错的是什么、对读者的影响是什么、最早出错的责任位置；引用材料或 story 时抄原文定位，不要复述。
      再按上面的类别定严重程度：BLOCKER（事实缺失或写反、编造、替人定了开着的决定）或 MAJOR（其余阻碍读者完成判断的）；
      验收里没有对应编号、错误源自上游，都不降低严重程度。
      **建议** —— 不影响正确、完整与可执行的表达建议（标题、措辞偏好、一段是不是讲了几件独立的事；正文里指着文档说话的句子——本章 / 本节 / 这张图 / 下表 / 如下——与章开场白，是读者要跳过的一段），
      严重程度 MINOR 或 INFO，不阻止通过；保持正确性的表达改善才是建议，不把会让读者得出错误结论的问题降成建议。
      判据是**内容**不是形态：同一件事写成表还是写成段、标题怎么起、几个小节，都不构成 finding；
      图文配合与长段落的意见要指出具体理解障碍——读者在哪一处、因为缺了什么读不懂；字数、段数、图数或某种句式本身不是理由；
      十章齐全、字数不少而某一章只有空泛短句，是阻断发现。
      真实待决写清了边界、相关行为没被说成已实现，可以交人审；把端侧不存在的服务器侧动作说成本特性行为要指出。
      原件或看图能力缺席使某项判断做不了时，写明未验证与影响，不要写成已读、已验。
      **任务书写明图面核对可以按能力缺口延期**时，登记的图按能力缺口处理：写明哪几张图的图面未核、原因是那条能力事实；
      图的说明、登记、取舍与正文照常对着文字材料核。图面以外没有阻断发现时结论写 warn，不写 pass；
      某个业务事实只在图里、文字材料确定不了时，把缺的事实记成阻断发现。任务书没写可以延期时，看不了图就是没读完，按「报告怎么写」第 5 条记。
      **跨章对着读这几问**（同一个条件在流程里说一套、在验收里说另一套时，两章各自都说得通，只有对着读才看得出来）：
      ① 决定用户能否继续的关键条件，在流程、功能说明、异常与恢复、验收四处说的是不是同一件事；
      ② 图里每条路径要么走到终态、要么接回某个节点；
      ③ 附录那些非实体落点写的是实际影响对象，「页面」「资源」这种泛称等于没写落点；
      ④ 上游画出来的每条路径 story 讲到了、讲在合适的章——主路径之外的那几条最容易整条没人讲；
      ⑤ 业务流程章的端到端过程与分支去向按流程章的读者问题判，**判的是总览与局部加起来**：
      一条分支去向在总览与局部两处都没有，才是 finding；全部节点挤进一张图、总览少画一条在局部完整展开的分支、
      与上游那张长得一样，本身都不是问题；只复制上游契约图而不回答这些事是 finding。
      **协作次序按实际关系判，不按参与方个数**：存在「谁先调谁、结果回到谁」的往返或先后依赖，图就要讲清它——
      两方之间也可能有复杂往返，多方单向直通反而不需要；只画了「有哪些方」的图答不了次序与回程；
      ⑥ 回看清单逐条核去向；
      ⑦ 每条议题的「依据」指得出撞点——story 哪一章或蓝图哪个设计对象的哪个主张，与哪份材料的
      哪一节、哪条工程事实或规约相撞；只有「根据材料」一类没有指向的话，算没写依据。
      **材料里的图逐张三问**：story 用了没有；用了的，这张图属不属于本需求——不属于本需求的图进了正文是 finding；
      没用的，它给的理由成不成立——没有理由又没在 story 里露面的图是缺口。
      **结果按任务书「报告怎么写」的 Story 报告写，本项不设例外**：「判据核对」表后的审查方法写你逐章过了什么——**不许空**，
      空证据与没审同形；有会议材料时要能看出每个话题的去向，写法不限，话题有漏或去向说不出来与没审同形。
      阻断发现与建议逐条进「发现」；没有发现时「发现」只留表头。
