# Story 的独立人读审查判据 —— 唯一位置。
# 读者审查的任务由 hooks/shared/reader-review-task.mjs 生成（story-build review --action prepare），
# 把这里的判据与本需求这一次的输入一起交给独立审查者；Spec 阶段不再承担 Story 的判据。
version: "2.0"
semantic_checks:
  story_reader_review:
    description: |
      归档叙事件的独立审查：待审对象是最终 `doc/features/{module}/AR/story.md`，
      聚焦写作逻辑、业务可读性与对已定事实、有效授权和设计目标的忠实度。
      **分工与阅读边界**：原始材料到蓝图的全面核源、接口转写与知识落点归蓝图独立质询，固定章名和最终编号由成文工具核；
      本层不例行重开已审设计取舍，也不要求逐份证明未采用库存为何不用。
      **阅读质量读法**：先看目录，定位当前业务条件或责任；沿主载体读出发生了什么、何时失败、怎样恢复。指出哪段图前已讲完流程、哪条图后说明只复述箭头，或哪一个图外例外被删掉会让人选错。给出具体位置、读者受到的影响及负责修改的位置。
      必读输入：`AR/story-src/materials.json` 指向的采用版本、`AR/story-src/answers/` 导出的材料确认与设计问答原话、
      本轮评审输入原件与动手前现场（本次审查的材料里列出的这一轮固定件，在 `updates/<轮>/before/` 下；
      当前 `inbox/review/` 里的新版不属于本轮依据，轮次开着或已收口都一样）、会议原件与写作设计 `AR/story-src/story-template.md`。
      未采用库存阅读稿、蓝图与评审投影、接口转写及激活知识在固定对象中保留字节绑定，按具体疑点或实质冲突回查固定版本。
      偶遇设计自身与有效事实/授权的明确实质冲突时，回查固定版本并指出具体错句、出处、影响与设计负责方。
      每章读者问题与章级维度见 `doc/extensions/skills/story/contracts/story-chapters.json`
      （`chapters[].questions` 与 `verdicts.chapter_dimensions`）。
      图与文的配合每张图问三件：图前是不是说清了读者看这张图要看出什么；
      图后是不是用列表补上了图里没表达的条件、责任与结果，图已讲清的没有复述也没有凑话；
      图种合不合读者要判断的那件事。再看呈现：读者追主线、分支或角色对应有明显困难而没做同图增强算遗漏，
      已做增强 SVG 更难读也算问题；原图已清楚的不做即合理。
      不输出把材料逐条抄回的对账表，结论指具体行为与原文定位（待定蓝图 gap 与会议话题逐条给结论）；
      `AR/story.md` 不存在时照实写读不到。
    severity: BLOCKER
    ai_prompt_hint: |
      **先独立想清楚，再看作者怎么安排**：先独立读成稿并说明单凭稿件能读懂的行为，
      再对照必读依据、蓝图与已登记的判断核它与有效事实、授权和目标的一致性；
      写作设计用来定位作者安排，设计漏掉的不因此算不在范围，写了理由不等于理由成立，有调整记录时核原关系是否仍在。
      **核的先后**：
      ① **来源效力与授权**：核「人的原话原件」与本轮评审输入原件（对话明确答过的同样有效）；
      有权限定仅在说定范围内生效，未获授权的行为即使蓝图与 Story 一致也不成立。
      「保持待定」「候选」不授权任何备选，但有权原话给出对象、期限与范围的临时授权按该范围承认——
      「最终规则待定，本轮仅允许人工受理」支持本轮的人工受理，期限、对象或题材一变就不能沿用。
      蓝图仍开着的 gap 与未收敛会议话题逐条核 Story 是否误写成已定方案（共同要求照写，单选项做法/数值即替人选边）；
      作者说稍后问却当已定用的算未完成；既定规范或工程义务不重问人。
      ② **关系成立与用户旅程**：沿主旅程核条件、角色交接、状态变化、写操作中间态、结果未知与正常/失败去向。
      正文提到过不等于关系成立；状态边写触发条件而非仅画点击；用户旅程须讲清入口、页面、操作、反馈与去向
      （「提示可重试」不算去向，编造页面/跳转记发现；无页面按参与方与数据生命周期核）。
      上游图换表或文字时对照并排原图核参与方、条件、请求与返回、失败责任与后续状态是否连贯。
      ③ **表达承接**：按 图＞表格＞列表＞章节＞文字 判最易混淆的关系（跨方时序、状态迁移、共同条件与失败边界）
      是否落到恰当载体，避免散落多节让读者自拼；必要的重现不是重复。
      ④ **逐段核读与附录**：按任务书阅读段读盘上原文与合同读者问题，附录（含脚本投影区）同样核验，
      确保接口、数据、配置、事件与规约摘要与设计参考一致且读者仅凭 Story 可查关键约束。
      附录材料表按「材料与来源」核贡献是否属实、采用版本是否准确、未采用理由是否成立。
      **会议逐话题核**：回 `raw.md` 与 `corrections.json` 核原话、行号、纠偏是否改义、未收敛项是否保持待定；
      无有权依据不得用会议覆盖仍有效文档。
      **关键语义核验**（名称齐全不算讲清）：结果未知（超时、回调未到、查询失败）是否保留未知/合同恢复而非判死；
      过期状态是否被当当前状态；重试是否带原请求身份并明示后端幂等责任；脱敏值与真实身份是否混用；
      云侧的业务状态是否被误写成端侧直接执行；上线前后与实际接入者是否与依据一致。
      **数值与来源核验**：数值带单位与条件，换算要对得回原值与单位，比例换了分母不算一致，
      不同适用条件下的不同值不算冲突；来源指回具体文档与节，回查不到的泛称不算来源；
      引用块只放有出处的原话，不留模板残文。
      **跨章对着读这几问**：
      ① 关键条件在流程、功能、异常与恢复、验收四处是否同一结论；
      ② 图里每条路径要么到终态、要么接回节点；
      ③ 附录落点为具体对象而非泛称；
      ④ 上游分支（尤其非主路径）是否讲全；
      ⑤ 业务流程章的端到端过程与分支去向**判的是总览与局部加起来**，
      **协作次序按实际关系判，不按参与方个数**；
      ⑥ 回看清单逐条核去向；
      ⑦ 关键取舍指出具体撞点与出处，只有泛称算没写依据；
      ⑧ 材料里的图逐张核采用归属与不用理由成不成立。
      **发现分级**（按对读者的实际影响区分一般偏好、明显冗余、实质阅读障碍与业务错误；阻断发现与建议各写一次，没有发现时写明没有发现）：
      - **阻断发现**（BLOCKER / MAJOR，业务错误或实质阅读障碍）：事实缺失或写反、编造（含无依据数值或承诺）、数值换算错误或漂移改变了验收、
      仍开着的决定被写成已定的方案、外部写操作结果未知被写成确定的成功或失败、无权改掉仍有效约束、
      未决边界缺席、核心契约/数据缺失又未明限制、前后矛盾或跨章冲突、超出/漏掉已确认范围、验收无法判定、
      设计自身与有效事实/授权的明确实质冲突、图前声称或上游图换载体后丢了关键关系、关键时序/状态只散在文字拼不出、
      删掉图外例外致读者选错、实现选型误入待确认区，或知识判定仅回显名称说不出本需求具体落点。
      逐项写清具体错句与位置、影响及最早修正责任（作者或设计负责方），不因验收无编号或与蓝图一致降低严重度。
      - **建议**（MINOR / INFO，不阻断通过）：一般表达偏好（标题、措辞、一段是不是讲了几件独立的事），
      以及不影响正确、完整与可执行的明显冗余（图前已讲完流程、图后只复述箭头、
      正文里指着文档说话的句子——本章 / 本节 / 这张图 / 下表 / 如下——与章开场白）；判内容不判形态与字数。真实待决写清了边界、相关行为没被说成已实现，可以交人审。
      **缺失与看图能力**：必读原件或看图能力缺席时写明未验证与影响。
      任务书写明图面核对可以按能力缺口延期时，列出未核图面与原因，其余无阻断发现判 warn（仅图独有关键事实缺失仍判阻断）；
      不可延期而看不了图则写明未核、判 fail。
      **结果按任务书「报告怎么写」写**：说明本次实际读取范围与对本稿的影响、待定与会议话题去向，空着与没审同形。
