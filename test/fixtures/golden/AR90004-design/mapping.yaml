story_details:
  - id: detail-loss-recovery-context
    kind: data_policy
    title: 挂失恢复上下文
    evidence_refs: [view:runtime/node:recovery-context]
    body: |
      | 键名/表名 | 介质 | 值结构 | 有效期 | 用途 |
      |---|---|---|---|---|
      | `loss_report_recovery_context` | relationalStore | `maskedCardId, accountScopeHash, checkpoint, idempotencyKey, applicationIdDigest, updatedAt` | 最终成功、明确失败、账号变化或超过有效期时清理；补卡协作期按上游共享约定保留 | 页面返回、身份恢复和重试查询时恢复同一流程；按账号隔离且不随备份恢复 |
  - id: detail-emergency-loss-switch
    kind: configuration
    title: 紧急挂失入口开关
    evidence_refs: [view:development/node:wallet-main-module]
    body: |
      | 配置项 | 默认值 | 行为 |
      |---|---|---|
      | `traffic_card_emergency_loss_enabled` | `false`（关闭） | 关闭或读取失败时隐藏紧急挂失入口；旧版本读取不到该项时按关闭处理。 |
  - id: detail-loss-tracking
    kind: event
    title: 紧急挂失埋点
    evidence_refs: [view:logical/node:emergency-loss]
    body: |
      运维统计紧急挂失的冻结结果与中断恢复，用来定位用户卡在哪一段（AC-8 要求关键路径可观察）；上报只带匿名入口、阶段与结果分类，上报失败不改变挂失结果。

      挂失冻结成功率：衡量提交挂失申请后云侧确认冻结的比例：分子是冻结结果为已冻结的次数，分母是提交挂失申请的次数；处理中与失败是未冻结的两种去向，分别计数供定位。

      | 统计点 | 业务动作 | 实际适用结果 | 本端获知时机 | 已有覆盖或新增 |
      |---|---|---|---|---|
      | 提交挂失 | 用户确认后提交或复用挂失申请 | 已受理 / 失败 | 创建或复用申请返回时 | 新增 |
      | 冻结结果 | 查询云侧冻结结果 | 已冻结 / 处理中 / 失败 | 冻结结果查询返回时 | 新增 |

      中断恢复成功率：衡量挂失流程中断后回到原检查点的比例：分子是恢复后回到用户离开时那一步的次数，分母是发生恢复的次数。

      | 统计点 | 业务动作 | 实际适用结果 | 本端获知时机 | 已有覆盖或新增 |
      |---|---|---|---|---|
      | 流程恢复 | 身份回跳、冲突恢复或重新进入后恢复流程 | 回到原检查点 / 从资格查询重来 | 恢复上下文读取完成时 | 新增 |

#: 不进 2.0 蓝图的 1.x 元数据，各写原因
not_carried:
  - what: 1.x spec 9.3 的两个模式候选（decision-tree、page-interaction）
    why: 1.x 里只是候选、选型留给 plan；2.0 的选型是设计决定，迁移不替设计新增决定。模式判断不是必填，金样正文也没有呈现它们。
  - what: 1.x knowledge-use 的事实使用登记（component-profile、engineering-capabilities、event-tracking）
    why: 金样正文没有呈现事实使用登记；2.0 的事实承接在设计讨论里，不进 Story 附录。
