    viewpoint_contract: app-runtime@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [development]
    purpose: 页面状态与恢复上下文的运行路径。
    current_state: 无挂失页面与恢复上下文。
    target_state: 页面对外状态为资格加载、等待风险确认、等待身份、状态冲突、提交中、结果确认中、已冻结、处理中、失败；每条失败只有一个收敛位置。
    delta: 新增挂失页面状态推进与恢复上下文的保存、校验和清理。
    decisions_and_gaps: [decision:emergency-loss-scope]
    verification_refs: [verify:runtime]
    nodes:
