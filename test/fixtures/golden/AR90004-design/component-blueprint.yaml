app_lens:
  runtime_flow_trigger_assessment:
    # 六项触发条件按 SR 原文逐条裁决；成立的几项要求运行视图给出 runtime_data_flow
    persistent_or_remote_ui:
      applies: true
      evidence_refs: [doc/features/AR90004/SR/design.md#2-责任矩阵]
      note: 交通卡云适配层是资格和冻结结果的唯一事实源，页面状态由云侧结果决定。
    multiple_consumers:
      applies: true
      evidence_refs: [doc/features/AR90004/SR/design.md#5-数据状态与恢复]
      note: 冻结凭证与最终冻结状态交给 AR90005，共享挂失上下文保留到补卡完成或取消。
    background_system_external_scheduled_write:
      applies: false
      evidence_refs: [doc/features/AR90004/SR/design.md#6-配置质量与安全]
      note: 只由打开、身份回跳、用户重试和重新进入触发；页面停留期间无轮询和后台任务。
    cold_start_resume_mount_account_switch:
      applies: true
      evidence_refs: [doc/features/AR90004/SR/design.md#7-异常与交付协同]
      note: 页面销毁或重新进入时校验账号、上下文版本和有效期后恢复到安全检查点；账号变化时清理恢复上下文。
    user_mutation_refreshes_other_consumers:
      applies: false
      evidence_refs: [doc/features/AR90004/SR/design.md#3-端到端时序]
      note: 用户确认后的提交只推进本页面的状态；补卡在冻结确认后经交接读取结果，不由提交动作推送刷新。
    cache_sync_freshness_consistency_process_recreation:
      applies: true
      evidence_refs: [doc/features/AR90004/SR/design.md#6-配置质量与安全]
      note: 读到旧版或损坏上下文时清理并从资格查询开始，不根据旧缓存展示成功；状态冲突时不用本地缓存覆盖云侧。
