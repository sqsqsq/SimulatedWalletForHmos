    purpose: 交通卡紧急挂失的业务路径与结果交接。
    current_state: 钱包没有交通卡紧急挂失。
    target_state: 钱包端以云侧资格和申请状态为事实源，把一次挂失处理分成加载资格、等待风险确认、身份恢复、冲突恢复、创建或复用申请、确认冻结结果几个业务阶段。
    delta: 新增交通卡紧急挂失业务路径；冻结成功后向补卡单交出冻结凭证与最终冻结状态。
    decisions_and_gaps: [decision:emergency-loss-scope]
    verification_refs: [verify:logical]
    nodes:
      - node_id: emergency-loss
        owner: wallet-team
        current_state: 无交通卡紧急挂失。
        target_state: 页面根据每一步的业务结果决定下一项操作；需要用户阅读、确认或完成身份时停止自动推进，由新的用户动作继续。
        provenance: *sr
        verification_refs: [verify:emergency-loss]
      - node_id: freeze-handoff
        owner: wallet-team
        current_state: 无冻结结果交接。
        target_state: 云侧确认冻结后，AR90004 将 freezeTicketId 和最终冻结状态交给 AR90005。
        provenance: *sr
        verification_refs: [verify:freeze-handoff]
