# story 技能观测测试配置
#
target:
  # 被测模型的工作目录 = 本仓库根。相对路径一律相对仓库根解析。
  # 与 walletkit 不同：这里**没有独立 demo 仓**，被测模型直接在本仓工作区产出
  # doc/features/<AR>/ 下的文档。因此新链历史迁移只限该 feature 目录，绝不碰源码。
  path: .
  # 被测产物根。新 Story 链只迁移当前 case 对应的 feature；其它 feature 与续跑输入不动。
  features_dir: doc/features

feature_history:
  # 新 suite 起跑前，把主工程 doc/features 全部归档到 Story-Features-<时间戳>；不恢复。
  archive_root: 'E:\Project\bak'
  action_on_new_chain: move
  timestamp_format: '%Y%m%d-%H%M%S'

cli:
  # CLI runtime 随本仓交付于 tools/cli，runner 不拼 provider 参数。
  #
  # 宿主变更史（**换宿主等于换被测对象**：跨宿主的效率数字不能直接比，
  # 引用更早几轮的次数与时长前须先说清中间换过谁，G3 计数必须带口径）：
  #   2026-08-29 凭据被服务端拒（401）→ 换 codex / gpt-5.6-luna。
  #              批次 4 首跑（check 23 次、失败序列 35→11→9→1→6→18、
  #              成文链 24 分、全轮 ≥89 分未闭环）就是在这个宿主上测的；
  #   2026-08-30 凭据一度恢复 → 换回 opencode / deepseek 跑了 F 修复两轮。
  #              两轮都没跑完：A 轮模型输出崩坏（同一字符重复数千次）、
  #              B 轮跑到 coding 之后凭据**再次**被拒（同一个 401）。
  #              那两轮因此没有有效的效率读数；
  #   2026-08-30 换回 codex / gpt-5.6-luna，F4 六提交的在线收口测于它；
  #   2026-08-31 F5 轮按用户要求换回 opencode / deepseek。**与 F4 那轮跨宿主**：
  #              F5 报告里的效率数字要与 F 修复两轮比（同宿主），与 F4 首跑/收口
  #              那组比时必须写明中间换过 codex。
  configurations:
    # 首位临时置为 GLM5.3-Flash：上一轮那两份成品就是它跑的。
    # 本轮要比的是**机制变化**，模型必须与上一轮相同，否则两个变量纠缠着，
    # 图片 3→0 / 流程图 6→1 这类差异归不到因上。比完可以换回去。
    - id: volcengine-glm-flash
      name: opencode
      model: volcengine/GLM5.3-Flash
      profile: build
    - id: bailian-deepseek
      name: opencode
      model: bailian/deepseek-v4-flash-0731
      profile: build
    - id: codex-luna
      name: codex
      model: gpt-5.6-luna
      profile: full_access
  retry_policy:
    # 内容审查 400 只在当前配置上干净重跑一次；再次命中即结束该 Case。
    content_rejection_retries_per_config: 1
    # 401 表示该凭据在本 suite 不可用，后续 attempt 跳过该配置。
    auth_failure_scope: suite
    # 被测 CLI 有多久没吐字就报一声。**只报警不重启**——停滞是不确定态
    # （可能还在想），自动重启会把正在进行的工作丢掉，所以处置由人授权
    # （`retry <case>`）。它与已裁掉的运行时限不是一回事：时限从开跑算、拦的是
    # 「跑得久」；这个从**最后一次产出**算、拦的是「不再产出」——正常推进时
    # 每几秒就有事件，差三个数量级，永远碰不到。
    stall_alert_sec: 900
  # **不设运行时限、不设续话轮次上限**（用户裁定 2026-08-31）。
  # 时限与轮次上限保护的是「进程失控」，而这里的观测者逐轮驱动、随时可以 stop——
  # 一个跑得久的阶段不是失控，是它本来就长。两次实测都是限制先到：
  # 一次把正在推进的会话从中间切断（1h54m 硬超时，plan 刚开始），
  # 一次轮次预算 6 轮被 story 流程的关卡用光（模型刚在 spec 抛出术语映射表等确认）。
  # 两次留下的都是半成品产物，观测到的既不是能力也不是缺陷。
  # 终点由 case.yaml 的 end_phase 判定；空转由观测者看着 stop。
  # `soft_timeout` / `hard_timeout` / `phase_hard_timeout` / `max_turns` 已停用，
  # 写在这里会被 run_case.py 直接拒绝——防的是「以为还在生效」。

observation:
  # Story 与前置交互阶段需要及时驱动；进入 spec 后转为 Goal/heartbeat 的两分钟观测。
  interaction_interval_sec: 15
  automation_interval_sec: 120
  # worker 自己每 10 秒续租；控制端只在 PID 已不存在且租约超过 3 分钟时判 worker_lost。
  # lease 大于正式观测间隔，避免一次正常的 120 秒静默被误判为失联。
  heartbeat_sec: 10
  lease_sec: 180

startup:
  # 首次启动严格串行；每个 Case 获得有效 run-id/worker 状态后才启动下一个。
  max_attempts: 3

gates:
  # 被测流程实际执行的项目原生门禁；协调器只记录运行结果和诊断。
  post_check: doc/extensions/hooks/spec/post_check.mjs
  # story.md 的九项判据：章节合同、来源单元三态守恒、裁决与判定表核实、术语守恒、四红线。
  story_build: doc/extensions/skills/story/scripts/story-build.mjs

output:
  # 相对仓库根解析，与运行时 cwd 无关。
  dir: output/story
