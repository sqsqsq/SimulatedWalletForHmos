  pattern: "similarity|paraphrase|levenshtein|jaccard|min_quote_chars|回声"
  scope: [scripts_mjs, scripts_py, hooks_mjs]
  ceiling: 0
  # 不分进行中/完成：这些词在可执行代码里出现，就是又在用字符串近似语义，任何时候都不合入。
  target: 0
  approved_by: WYK
  reason: "相似度、复述、引文长度核实三条路径已全部退场，现值 0；任何新增当场红"
