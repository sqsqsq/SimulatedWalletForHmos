# 语义代理标识：脚本里出现这些词，说明有人又在用字符串近似「讲清没讲清」。
# 现值是待退场的旧判据；退场后必须为 0，任何新增当场红。
semantic_proxy:
  pattern: "similarity|paraphrase|levenshtein|jaccard|min_quote_chars|回声"
  scope: [scripts_mjs, scripts_py, hooks_mjs]
  ceiling: 0
  # 不分进行中/完成：这些词在可执行代码里出现，就是又在用字符串近似语义，任何时候都不合入。
  #
  # **只数可执行的那部分**（判据实现见 test_mechanism_budget）：注释里交代
  # 「这条路径为什么退场」正是该写的话；把退场理由一起数进来，下一轮就只能靠删注释过关，
  # 那时代码里没有这些词，而知道它们为什么不该回来的那段文字也没了。
  target: 0
  approved_by: WYK
  reason: "步骤 10 收口归零：paraphrase.mjs 与 verdict-set.mjs 整份删除，pre_verifier 的相似度排序、verifier-report 的引文核实与 min_quote_chars、两处 post_check 的复制检查全部退场"
