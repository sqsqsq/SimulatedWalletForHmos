# 项目预算用途：防实现走偏、补丁叠加、旧机制残留及其功能干扰，不限制正向能力。
# 方案制定、实现与reviewer均按test/story/AGENTS.md §5处理；不靠删功能或只抬数字换绿。
# 下列字段仍是现有峰值/总量检查的配置，新100%/125%/150%新增预算分级尚未接线。
# 本次规约同步不修改任何在途额度；不要把历史仓库总量当作新增预算分母。
#
# 机制层预算 —— 一次**完整需求**（一个批次）对 doc/extensions 非知识层规模的承诺。
#
# 三个角色各做一件事：
#   · 维护设计者定方案时**同时给出预算**：本需求进行中的峰值（interim_ceiling）与完成后的上限（target），
#     每个数字具名 + reason（新增脚本行归 D2 §4 哪一类确定性失败、退掉什么）；
#   · 维护实施者改完后**自检**：超出峰值是否合理（方案估错就回方案改预算并写原因，不是砍方案）；
#     远低于预期是否有遗漏（该建的没建、该退的没退）；
#   · 评审在测试后**发现差异并申请特别审视**：对照本文件 diff 与方案的预算，超与不足都要给理由。
#
# 它不按步骤拦中间态：需求进行中允许先加后删，只要不超过方案自己声明的峰值；需求完成
# （status: closed）时必须回到 target 以内，这是完成条件的一部分。语义代理标识（semantic_proxy）
# 不分进行中与完成——它不是规模，是方向：脚本里再出现相似度、复述、最短引文这类词，就是又在用
# 字符串近似「讲清没讲清」，任何时候都不合入。
#
# 判据由 test/story/tests/test_mechanism_budget.py 机械执行，进全量离线回归；红了先读报错里
# 指的 AGENTS 条款。改本文件任何数字都要具名 + reason，和 drift_allowlist、retired 形态同一套纪律。
#
# ## 计数口径：**代码行，不含注释与空行**
#
# 配额限的是机制的规模，不是文字的长短。把注释算进配额，省下来的只会是解释——
# 而解释正是下一个维护者判断「这条判据还该不该在」的依据。
#
# 范围：doc/extensions 下，去掉三类——knowledge/（内容归目标工程）、依赖目录，以及
# **安装期工具**（`skills/story-adaptation/**`）：
# 那是把这套机制装到别的工程去的东西，装完不参与任何一次需求。把它算进配额，
# 等于让「更好装」和「机制更小」互相挤占（用户 2026-09-05 裁定）。
# 类别按路径与后缀。逐类剥注释：
#   · .mjs  —— `//` 行与 `/* */` 块
#   · .py   —— `#` 行与 docstring
#   · .yaml —— `#` 行
#   · .json —— 说明键（键名以 `_` 开头或以 note 结尾）
#   · .md   —— 提示词正文本身是内容，只去空行
#
# 数字只是围栏，不表达质量；表达质量的判据在 AGENTS §3.1「模型与脚本按能力分工」与 D2 §4。
#
# ## 「target = 当时的现值」不是惯例
#
# 批次 5 收口时按现值重定了 target，那是一次具名裁定，不是定 target 的方法。理由只在那一次成立：
# 换成只数代码行之后，剩下的都是在用的判据实现，再压就是删判据，而那一步明令不改行为。
# **批次 5 本身不压缩规模；压缩另开需求**，起点见 TEST.md §8 第 7 项记的长期方向。
# 后面的批次仍按老规矩来：维护者定方案时给出这一轮要收敛到哪，而不是回填改完之后的数。
