# 失效形态台账（G1 · 永久留档）
# =============================================================================
# 每个已实测的失效形态一条。**每批全量回归**，不只验本批新增（坑 #3）。
#
# 字段：
#   id                形态标识，全局唯一，不复用
#   dimension         knowledge | dedup | readability | infra
#   found_round       首次实测到该形态的轮次（日期）
#   form              形态一句话描述（"错的长什么样"）
#   clause            被违反的需求条款（01-全批次需求记录.md 的 G/B 编号）或坑册编号
#   checker           check_failure_modes.py 内的 checker 函数名
#   target            mechanism（检查 doc/extensions 机制文件）| product（检查 feature 产物）
#   bad_fixture       反夹具目录：checker 必须判 FAIL
#   good_fixture      正夹具目录：checker 必须判 PASS
#   applicable_when   对真实目标运行的前提
#   severity          BLOCKER | WARN
#   status            fixed（永久回归） | pending_capability（目标能力未建，只做夹具自检）
#                     | retired（须 reason + approved_by）
#   variant_of        若为既有形态的新变体，指向原形态 id（旧检查保留，另增新检查）
#
# 回归语义（check_failure_modes.py）：
#   1) 夹具自检 —— 所有 status != retired 的条目都跑：bad 必 FAIL、good 必 PASS。
#      自检不过 = checker 本身失效（比漏检更危险），整体判 FAIL。
#   2) 真实目标 —— 仅 status == fixed 的条目跑；pending_capability 报 SKIP 并计数。
#      能力交付后把 status 改 fixed，真实目标回归自动生效。
# =============================================================================

