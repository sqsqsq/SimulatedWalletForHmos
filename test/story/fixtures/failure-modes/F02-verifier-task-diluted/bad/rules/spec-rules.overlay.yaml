phase: spec
version: "1.1"
semantic_checks:
  story_reader_review:
    description: >
      归档叙事件的独立审查：按读者会问什么审背景、范围、方案、流程、功能、异常、验收、
      交付、图与文的配合、判断与事实是否分开。
    severity: MAJOR
    ai_prompt_hint: >
      结论只写两类：blocking_findings 与 advisories。
      另外通读全文做一次**独立可读**自检：读完能不能说出要做什么、为什么这么做。
      再逐行确认**有取舍**：每一行设计选择都写清了否掉什么。
