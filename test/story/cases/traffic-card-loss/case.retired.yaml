# 组合 Case：需求系统上的一张开发单，从取材一路走到评审。
#
# 覆盖：从需求系统按单号拉取（含「查无此单」这条判据首次可达）、系统只给 md 而
# 界面材料要另外要、docx 转正文并抽图、图片一路到归档件且链接可解析、
# 上游已拆两张单时的人话拍板与兄弟交接、知识链传到 coding、真实改码、
# 归档到系统、评审回稿拉回来逐条处置。
id: traffic-card-loss
ar: AR90004
# 需求系统上有这张单：`system/` 是它的快照，起跑时复制进本 Case 自己的 workspace。
system: true
interactive: true
start_phase: story
# 走到哪个阶段**由驱动器控制**：它在每个阶段边界按 `end_phase` 算出下一个未闭环阶段，
# 指名下发推进指令（run_case.py 的 continuation_reply）。所以改终点只改这一行，
# prompt 里不写阶段链——写了就是和驱动器双写，还把「模型会不会自己乱跑」混进观测。
end_phase: review

# 人手上备着、但没提前放进需求目录的材料。等它开口要才投——
# 提前铺好，「它会不会发现材料不够」就永远测不到。
supplements:
  - file: 紧急挂失界面原型说明.docx
    deliver: on_request

# prompt 是**需求方说的话**：只给单号、材料在哪、做到哪一步。
# 不点命令、脚本、文件名、关卡名，也不写处置法——那些正是要观测的东西。
prompt: |
  AR90004 是交通卡紧急挂失的开发需求，上游的产品需求和系统设计都在需求系统里，
  从这张单开始做，一直做到评审；评审意见我来回。

  过程中需要我表态的地方停下来问我，别替我拿主意。有些材料还在我手上，你要的时候跟我说。

  另外：doc/extensions/、test/story/ 和 framework/ 这轮不要动，它们不归这个需求管；
  产品源码按方案该改就改。结束时说一下过程中遇到的问题。
