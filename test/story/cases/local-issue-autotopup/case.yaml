# 组合 Case：一张本地问题单，从人手上的半份材料起手，做到评审。
#
# 覆盖：没有需求系统单据时的本地起手（不要 token、不碰系统）、占位件识别与
# **按需补料**、docx 转正文并抽图、同轮材料冲突登记与人工定源、
# 材料写明尚未决定的问题保持 open、知识链传到 coding、真实改码、评审意见回流修订规格。
id: local-issue-autotopup
ar: ISSUE-206
# 需求系统上没有这张单：不带 system/ 快照，`story.js` 那条路走不通也不该走。
system: false
interactive: true
start_phase: story
# 走到哪个阶段由驱动器控制（见 traffic-card-loss 同位注释）。改终点只改这一行。
end_phase: review

# 产品那边的文档还在人手上。等它说缺产品正文，再随那句回话一起放进需求目录。
supplements:
  - file: 交通卡自动充值.docx
    deliver: on_request

# prompt 是**需求方说的话**：只给单据性质、材料在哪、做到哪一步。
# 不点命令、脚本、文件名、关卡名，也不写处置法——冲突怎么办、未决项怎么办都不提。
prompt: |
  这是我们自己记的一个问题单，编号 ISSUE-206，交通卡自动充值这块的端侧能力。
  它没有需求系统的单号，也不用去那边查。

  我手上有系统设计同事发我的一份说明，已经放进需求目录了；产品那边的文档还在我这儿，
  你要的时候跟我说。请从这些材料开始做，做到评审为止。

  需要我表态的地方停下来问我，别替我拿主意。doc/extensions/、test/story/ 和 framework/
  这轮不要动；产品源码按方案该改就改。结束时说一下过程中遇到的问题。
