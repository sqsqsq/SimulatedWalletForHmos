# 组合 Case：一张本地问题单，从人手上的半份材料起手，做到 plan。
#
# 覆盖：没有需求系统单据时的本地起手（不碰系统）、按需补料（产品稿与接受侧说明
# 各一次）、docx 转正文并抽图、材料冲突登记为议题（撤销宽限窗产品稿 24h 与系统设计 48h）、
# 材料明写「还没定」的事项保持开放、多方协作与多步分支流程、spec 交付门选进入 plan；
# 第二段：评审人在评审记录的议题人工区表态，update 承接评审回流并定源。
id: car-key-sharing
ar: ISSUE-206
# 需求系统上没有这张单：不带 system/ 快照，系统那条路走不通也不该走。
system: false
interactive: true
start_phase: story
# 走到哪个阶段由驱动器控制（见 auto-topup 同位注释）。改终点只改这一行。
end_phase: plan

# 人手上备着、但没提前放进需求目录的材料。等它开口要才投。
supplements:
  - file: 数字车钥匙分享.docx
    deliver: on_request
  - file: 车钥匙接受侧界面说明.docx
    deliver: on_request

# 到目标之后还做第二段（说明见 auto-topup 同位注释）。
after_initial: update

# 第二段的输入：评审人在评审记录里对各议题的表态（三态 + 修改意见）。
# 按标题里的词找到议题，只写它的人工区，不动机器区——那是脚本的地盘。
update_inputs:
  - file: car-review-feedback.yaml
    kind: review_human_zone
    note: 撤销宽限定为 36 小时并用「正在收回」提示；转分享与强制下线仍暂缓
    # 有意保留的冲突探针：评审人写「撤销后 36 小时内对方仍可开门」，与系统设计和产品稿
    # 「撤销起车辆侧即拒绝」冲突。预期：update 把这条冲突登记为待确认议题并停下问人，
    # 不按时间最新覆盖安全口径。
    expected: 冲突登记为议题并停下问人

# 第二段的业务请求：resume-update 的 --text 原样用这一句，按 planned 记账（TEST §5.9）。
update_request: 评审人在评审记录里表了态，按评审意见把 ISSUE-206 更新一下。

# prompt 是**需求方说的话**：只给单据性质、材料在哪、做到哪一步。
# 不点命令、脚本、文件名、关卡名，也不写处置法。
prompt: |
  这是我们自己记的一个问题单，编号 ISSUE-206，数字车钥匙分享这块的端侧能力。
  它没有需求系统的单号，也不用去那边查。

  车云那边同事发我的系统设计说明，已经放进需求目录了；产品的需求稿和接受侧的
  界面说明都还在我这儿，你要的时候跟我说。请从这些材料开始做，规格定了之后接着做方案。

  需要我表态的地方停下来问我，别替我拿主意。doc/extensions/、test/story/ 和 framework/
  这轮不要动；产品源码按方案该改就改。结束时说一下过程中遇到的问题。
