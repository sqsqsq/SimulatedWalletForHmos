# 组合 Case：一张本地问题单，从人手上的半份材料起手，做到评审。
#
# 覆盖：没有需求系统单据时的本地起手（不碰系统）、按需补料（产品稿与接受侧说明
# 各一次）、docx 转正文并抽图、同轮材料冲突登记与人工定源（撤销宽限窗 24h vs 48h）、
# 材料明写「还没定」的事项保持开放、多方协作与多步分支流程、知识链传到 coding、
# 真实改码、评审意见回流修订规格。
id: car-key-sharing
ar: ISSUE-206
# 需求系统上没有这张单：不带 system/ 快照，系统那条路走不通也不该走。
system: false
interactive: true
start_phase: story
# 走到哪个阶段由驱动器控制（见 auto-topup 同位注释）。改终点只改这一行。
end_phase: plan

# 人手上备着、但没提前放进需求目录的材料。等它开口要才投。
supplements:
  - file: 数字车钥匙分享.docx
    deliver: on_request
  - file: 车钥匙接受侧界面说明.docx
    deliver: on_request

# 到目标之后还做第二段（说明见 auto-topup 同位注释）。
# 1.9.5 S4 只跑第一段（用户 2026-09-21 定：不开 update 第二段）；要跑双检查点时恢复下一行。
# after_initial: update

# 第二段的输入：评审人在评审记录的人工意见区里留下的决定。
# 插入只用明确的自由意见边界，不去动机器区——那是脚本的地盘，宿主改它等于替产物做决定。
update_inputs:
  - file: car-review-feedback.md
    kind: review_human_zone
    note: 撤销宽限改 36 小时（替代此前的 24 小时口径），提示语用「正在收回」；
      转分享与强制下线保持未决

# prompt 是**需求方说的话**：只给单据性质、材料在哪、做到哪一步。
# 不点命令、脚本、文件名、关卡名，也不写处置法。
prompt: |
  这是我们自己记的一个问题单，编号 ISSUE-206，数字车钥匙分享这块的端侧能力。
  它没有需求系统的单号，也不用去那边查。

  车云那边同事发我的系统设计说明，已经放进需求目录了；产品的需求稿和接受侧的
  界面说明都还在我这儿，你要的时候跟我说。请从这些材料开始做，做到评审为止。

  需要我表态的地方停下来问我，别替我拿主意。doc/extensions/、test/story/ 和 framework/
  这轮不要动；产品源码按方案该改就改。结束时说一下过程中遇到的问题。
