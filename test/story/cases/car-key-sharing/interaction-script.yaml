# 需求方按实际停等顺序说的话；不注入初始 prompt。
# 说人话：不点命令、不点文件名、不说该怎么处置——那些是要观测的东西。
# 只回选项或一句短语：这里记的是立场，不是台词（TEST.md §3.0）。
# expected_turn 按预估顺序编号；实跑发现顺序漂移时按 adaptive 事件校准这里，不改话术。
replies:
  - id: hand-over-the-product-doc
    expected_turn: 1
    expected_kind: story_gate
    expected_phase: story
    # 说「放进去了」的同时文件就得在那儿，所以这一条带着补料一起送。
    deliver:
      - 数字车钥匙分享.docx
    text: 补充材料，产品需求稿已放入需求目录，按它来。

  - id: product-doc-wins-on-grace-window
    expected_turn: 2
    expected_kind: story_gate
    expected_phase: story
    text: 撤销时限按产品稿 24 小时；未定的两件保持未定。

  - id: init-wrap-up
    expected_turn: 3
    expected_kind: story_gate
    expected_phase: story
    text: 材料就这些，不拆单，往下走。

  - id: hand-over-the-accept-doc
    expected_turn: 4
    expected_kind: story_gate
    expected_phase: story
    deliver:
      - 车钥匙接受侧界面说明.docx
    text: 补充材料，接受侧界面说明已放入需求目录。

  - id: terms-confirmed
    expected_turn: 5
    expected_kind: story_gate
    expected_phase: spec
    text: 术语确认，按你列的定。

  - id: review-comments
    expected_turn: 6
    expected_kind: story_gate
    expected_phase: spec
    text: 通过。撤销中的用户文案改为「正在收回」；未定两件保持未定。
