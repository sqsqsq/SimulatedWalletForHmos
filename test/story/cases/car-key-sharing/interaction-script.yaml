# 需求方按实际停等顺序说的话；不注入初始 prompt。
# 说人话：不点命令、不点文件名、不说该怎么处置——那些是要观测的东西。
# expected_turn 按预估顺序编号；实跑发现顺序漂移时按 adaptive 事件校准这里，不改话术。
replies:
  - id: hand-over-the-product-doc
    expected_turn: 1
    expected_kind: story_gate
    expected_phase: story
    # 说「放进去了」的同时文件就得在那儿，所以这一条带着补料一起送。
    deliver:
      - 数字车钥匙分享.docx
    text: 产品的需求稿在我这儿，刚放进需求目录了，你按它来。界面图也都在里面。

  - id: product-doc-wins-on-grace-window
    expected_turn: 2
    expected_kind: story_gate
    expected_phase: story
    text: 撤销那个时限按产品稿的 24 小时来，车云那份写 48 是早先的数，他们还没改过来。另外产品稿里写明还没定的那两件，这轮就保持没定，别写成结论。

  - id: init-wrap-up
    expected_turn: 3
    expected_kind: story_gate
    expected_phase: story
    text: 材料就这些了，一次做完不拆单，按这些定稿往下走吧。

  - id: hand-over-the-accept-doc
    expected_turn: 4
    expected_kind: story_gate
    expected_phase: story
    deliver:
      - 车钥匙接受侧界面说明.docx
    text: 接受那一侧的界面说明也给你，放进需求目录了——对方看到什么、怎么添加进钱包都在这份里。

  - id: terms-confirmed
    expected_turn: 5
    expected_kind: story_gate
    expected_phase: spec
    text: 术语我看过了，口径没有歧义，就按你列的这些定。

  - id: review-comments
    expected_turn: 6
    expected_kind: story_gate
    expected_phase: spec
    text: 我看过了，大方向没问题。有一条要改：撤销中那个状态，用户那边看到的说法要写成「正在收回」，别用「撤销中」这种单据腔——对方是家人，措辞别吓人。改完按你写的走；没拍板的那两件仍然保持不定。
