# 组合 Case：需求系统上的一张开发单，从取材做到规格定稿送审。
#
# 覆盖：从需求系统按单号拉取、系统只给 md 而界面材料要另外要、docx 转正文并抽图、
# 会议记录的读取与话题裁决、SR 提出可拆两份时的人话拍板（全量承载形态）、
# 图片一路到归档件且链接可解析、交付门选归档送审；
# 第二段：同一轮 update 同时承接改版产品稿与需求系统上的评审回稿（先取上游）。
#
# 材料关系：产品原稿 v0.4 是含图的草稿，业务口径以需求系统里归档的 RR90006 为准；
# 原稿只补 RR 里没有的界面图。
id: auto-topup
ar: AR90006
# 需求系统上有这张单：`system/` 是它的快照，起跑时复制到 suite 树之外的独立位置。
system: true
interactive: true
start_phase: story
# 走到哪个阶段**由驱动器控制**：它在每个阶段边界按 `end_phase` 算出下一个未闭环阶段，
# 指名下发推进指令。改终点只改这一行，prompt 里不写阶段链。
end_phase: spec

# 人手上备着、但没提前放进需求目录的材料。等它开口要才投——
# 提前铺好，「它会不会发现材料不够」就永远测不到。
supplements:
  - file: 交通卡自动充值.docx
    deliver: on_request
  # 归档之后开的一次澄清会的语音转写：需求变化只留在这场会里，文档没刷新。
  # `kind: meeting` 只给测试域用（没有内嵌图），被测侧看到的就是一份 docx。
  - file: 交通卡澄清会记录-0903.docx
    deliver: on_request
    kind: meeting

# 到目标之后还做第二段：固定快照、初评、回流，再在**同一次对话**里触发一次产物更新。
# 不配这一行就是普通单终点，行为与以前逐字节一致。
after_initial: update

# 第二段的输入：宿主在第一段评完之后投进去的东西。它们是**正常的业务材料**，
# 不是测试控制语句——被测模型看到的必须与真实使用时一模一样。
# 初始那一轮绝不能看见它们：提前铺好，「它会不会认出变化」就永远测不到。
update_inputs:
  - file: 交通卡自动充值-v2.docx
    kind: local_material
    note: 产品稿 v0.5：吸收澄清会结论，单日上限 200 → 300，协议文案同步
  # 评审人在需求系统上的批注回稿：送审之后才有，update 取上游时取回。
  - file: review-feedback.md
    kind: system
    destination: review-feedback.md
    note: 两条同意、一条要改（停用后给出重新签约的去处）、一条暂缓

# 第二段的业务请求：resume-update 的 --text 原样用这一句，按 planned 记账（TEST §5.9）。
update_request: 产品稿出了新版，已放进需求目录；评审人的意见也回到系统上了。按这些把 AR90006 更新一下。

# prompt 是**需求方说的话**：只给单号、材料在哪、做到哪一步。
# 不点命令、脚本、文件名、关卡名，也不写处置法——那些正是要观测的东西。
prompt: |
  AR90006 是交通卡自动充值的开发需求，产品需求和系统设计都在需求系统里，
  从这张单开始做，做到规格定稿送审。

  界面的图产品当时没归档进系统，原稿在我手上，你要的时候跟我说。
  九月初产品和开发开过一次澄清会，会议记录也在我手上。
  过程中需要我表态的地方停下来问我，别替我拿主意。
