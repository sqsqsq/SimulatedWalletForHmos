# 组合 Case：复杂跨部件业务、视觉材料、完整内容类别和下游消费在同一条链上出现。
id: pattern-image-review
ar: AR90004
start_phase: story
# 走到哪个阶段**由驱动器控制**：它在每个阶段边界按 `end_phase` 算出下一个未闭环阶段，
# 指名下发推进指令（run_case.py 的 continuation_reply）。所以改终点只改这一行，
# prompt 里不写阶段链——写了就是和驱动器双写，还把「模型会不会自己乱跑」混进观测。
end_phase: review
prompt: |
  执行 /story init AR90004，按 story 技能规则完整阅读当前需求目录中实际存在的全部同轮材料，
  生成并收口 AR/design.md。

  执行要求：
  - Story 同时保留当前挂失特性与兄弟补卡特性的责任、交接、支付中断和通知失败影响，不复制兄弟实现；
  - Story 保留需求材料中的界面参考图，并保证归档后的图片链接可直接打开；
  - 编码阶段按 Plan 修改本工程源码并完成项目要求的编译、lint 与门禁；
  - Review 审查本轮同一份真实变更；
  - 不修改 doc/extensions/、test/story/ 或 framework/，它们是本轮被测对象；
  - 结束时总结各阶段实际遇到的规则、脚本或上下文问题。
