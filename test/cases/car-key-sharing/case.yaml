# 组合 Case：一张本地问题单，从人手上的半份材料起手，需求说明定稿后继续做到可交开发的实现方案（plan）为止。
#
# 覆盖：没有需求系统单据时的本地起手（不碰系统）、材料关卡一次交齐补料（产品稿与接受侧说明
# 同时交）、docx 转正文并抽图、材料冲突登记为议题（撤销宽限窗产品稿 24h 与系统设计 48h）、
# 材料明写「还没定」的事项保持开放、多方协作与多步分支流程、交付门选实现方案；
# 施工单位由实际设计决定，每个都要在 plan 上限内取得有效契约、知识义务与证据；
# 第二段：评审人在评审记录的议题人工区表态，update 承接评审回流并定源。
id: car-key-sharing
ar: ISSUE-206
# 需求系统上没有这张单：不带 system/ 快照，系统那条路走不通也不该走。
system: false
interactive: true
start_phase: story
# 终点由驱动器判定（见 auto-topup 同位注释）：交付关卡选「实现方案」后，每个活动施工单位 spec、plan
# 都闭环（或原生判定合法复用），止于 Plan。
end_at: {kind: phase, phase: plan}

# 人手上备着、但没提前放进需求目录的材料。模型第一次停在材料关卡时全部一次交出。
supplements:
  - file: 数字车钥匙分享.docx
    deliver: on_request
  - file: 车钥匙接受侧界面说明.docx
    deliver: on_request

# 到目标之后还做第二段（说明见 auto-topup 同位注释）。
after_initial: update

# 第二段的输入：评审人在评审记录里对各议题的表态（三态 + 修改意见）。
# 按标题里的词找到议题，只写它的人工区，不动机器区——那是脚本的地盘。
update_inputs:
  - file: car-review-feedback.yaml
    kind: review_human_zone
    note: 撤销宽限定为 36 小时并用「正在收回」提示；转分享与强制下线仍暂缓
    # 有意保留的冲突探针：评审人写「撤销后 36 小时内对方仍可开门」，与系统设计和产品稿
    # 「撤销起车辆侧即拒绝」冲突。预期：update 把这条冲突登记为待确认议题并停下问人，
    # 不按时间最新覆盖安全口径。
    expected: 冲突登记为议题并停下问人

# 第二段的请求：resume-update 的 --text 原样用这一句（TEST §4.4）。评审表态由模型自己读评审记录取得。
update_request: /story update ISSUE-206

# 只用命令起手（test/cases/README.md）：材料与终点都由模型在流程里问，宿主在关卡上答。
prompt: /story init ISSUE-206
