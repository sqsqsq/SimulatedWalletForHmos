# 组合 Case：需求系统上的一张开发单，从取材做到需求说明定稿送审，不开展施工。
#
# 覆盖：从需求系统按单号拉取、系统只给 md 而界面材料要另外要、docx 转正文并抽图、
# 会议记录的读取与话题裁决、SR 提出可拆两份时的人话拍板（全量承载形态）、
# 图片一路到归档件且链接可解析、蓝图准入后成文与独立审查、交付门选归档送审；在零施工单位下完成交付；
# 第二段：同一轮 update 同时承接改版的产品需求（归档 RR 的下一版）与需求系统上的评审回稿（先取上游）。
#
# 材料关系：产品原稿 v0.4 是含图的草稿，业务口径以需求系统里归档的 RR90006 为准；
# 原稿只补 RR 里没有的界面图。第二段的改版稿是 RR90006 的 v1.1：保留全部 AC-R，只改答案卷列出的三处。
id: auto-topup
ar: AR90006
# 需求系统上有这张单：`system/` 是它的快照，起跑时复制到 suite 树之外的独立位置。
system: true
interactive: true
start_phase: story
# 终点**由驱动器判定**（test/scripts/end_target.py）：story + submitted = 当前成文已登记、交付资格成立，
# 且当前版本已真实归档到需求系统。不要求 Spec/Plan 或施工单位。改终点只改这一行。
end_at: {kind: story, delivery: submitted}

# 人手上备着、但没提前放进需求目录的材料。模型第一次停在材料关卡时全部一次交出——
# 提前铺好，「它会不会发现材料不够」就永远测不到。
supplements:
  - file: 交通卡自动充值.docx
    deliver: on_request
  # 归档之后开的一次澄清会的语音转写：需求变化只留在这场会里，文档没刷新。
  # `kind: meeting` 只给测试域用（没有内嵌图），被测侧看到的就是一份 docx。
  - file: 交通卡澄清会记录-0903.docx
    deliver: on_request
    kind: meeting

# 到目标之后还做第二段：固定快照、初评、回流，再在**同一次对话**里触发一次产物更新。
# 不配这一行就是普通单终点，行为与以前逐字节一致。
after_initial: update

# 第二段的输入：宿主在第一段评完之后投进去的东西。它们是**正常的业务材料**，
# 不是测试控制语句——被测模型看到的必须与真实使用时一模一样。
# 初始那一轮绝不能看见它们：提前铺好，「它会不会认出变化」就永远测不到。
update_inputs:
  - file: 交通卡自动充值-v2.docx
    kind: local_material
    note: RR90006 的 v1.1：单日上限 200 → 300（与会议「200 不动」冲突，有意保留的探针）、协议文案写明上限、开关只管新签约、已签约用户入口不隐藏且直达管理页、未签约用户开关关闭时看不到入口（与会议一致）
  # 评审人在需求系统上的批注回稿：送审之后才有，update 取上游时取回。
  - file: review-feedback.md
    kind: system
    destination: review-feedback.md
    note: 两条同意、一条要改（停用后给出重新签约的去处）、一条暂缓

# 第二段的请求：resume-update 的 --text 原样用这一句（TEST §4.4）。新稿与回稿由模型自己取得。
update_request: /story update AR90006

# 只用命令起手（test/cases/README.md）：材料、会议、终点都由模型在流程里问，宿主在关卡上答。
prompt: /story init AR90006
