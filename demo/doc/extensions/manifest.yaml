schema_version: "1.1"
name: wallet-sdk-demo
version: "2.0.6"
description: 实例扩展包（story 需求流程 + 三类知识 + 生命周期钩子）
provides:
  skill_assets:
    component-design:
      knowledge: base/hooks/blueprint/author.md
  knowledge:
    - path: base/skills/story-knowledge/SKILL.md
      summary: 进入 Feature 阶段动笔前，先按 story-knowledge 取当前动作的知识任务（激活知识、已成立判断、义务与完成条件）
      audience: [spec, plan, coding, review, ut, testing]
    - knowledge/facts/component-profile.md
    - knowledge/facts/engineering-capabilities.md
    - knowledge/facts/event-tracking.md
    - knowledge/constraints/ux-consistency.md
    - knowledge/constraints/security-privacy.md
    - knowledge/constraints/dfx-baseline.md
    - knowledge/constraints/observability.md
    - knowledge/constraints/resource-usage.md
    - knowledge/constraints/compatibility-checklist.md
    - knowledge/constraints/env-exceptions.md
    - knowledge/constraints/deliverables.md
    - knowledge/design-patterns/decision-tree.md
    - knowledge/design-patterns/page-interaction.md
  hooks:
    docs:
      post_check:
        - base/skills/story-adaptation/scripts/entries.mjs
    spec:
      pre_phase:
        - base/hooks/shared/story-view.mjs
      post_check:
        - base/hooks/spec/post_check.mjs
      pre_verifier:
        - base/hooks/shared/pre_verifier.mjs
    plan:
      pre_phase:
        - base/hooks/shared/story-view.mjs
      post_check:
        - base/hooks/plan/post_check.mjs
      pre_verifier:
        - base/hooks/shared/pre_verifier.mjs
    coding:
      pre_phase:
        - base/hooks/shared/story-view.mjs
      post_check:
        - base/hooks/coding/post_check.mjs
      pre_verifier:
        - base/hooks/shared/pre_verifier.mjs
    review:
      pre_phase:
        - base/hooks/shared/story-view.mjs
      post_check:
        - base/hooks/review/post_check.mjs
      pre_verifier:
        - base/hooks/shared/pre_verifier.mjs
    ut:
      pre_phase:
        - base/hooks/shared/story-view.mjs
      post_check:
        - base/hooks/ut/post_check.mjs
      pre_verifier:
        - base/hooks/shared/pre_verifier.mjs
    testing:
      pre_phase:
        - base/hooks/shared/story-view.mjs
      post_check:
        - base/hooks/testing/post_check.mjs
      pre_verifier:
        - base/hooks/shared/pre_verifier.mjs
  phase_rules_overlays:
    spec: base/rules/spec-rules.overlay.yaml
    plan: base/rules/plan-rules.overlay.yaml
    coding: base/rules/coding-rules.overlay.yaml
    review: base/rules/review-rules.overlay.yaml
    ut: base/rules/ut-rules.overlay.yaml
    testing: base/rules/testing-rules.overlay.yaml
phase_bindings:
  spec:
    before_phase_work:
      - {kind: knowledge, ref: base/skills/story-knowledge/SKILL.md}
  plan:
    before_phase_work:
      - {kind: knowledge, ref: base/skills/story-knowledge/SKILL.md}
  coding:
    before_phase_work:
      - {kind: knowledge, ref: base/skills/story-knowledge/SKILL.md}
  review:
    before_phase_work:
      - {kind: knowledge, ref: base/skills/story-knowledge/SKILL.md}
  ut:
    before_phase_work:
      - {kind: knowledge, ref: base/skills/story-knowledge/SKILL.md}
  testing:
    before_phase_work:
      - {kind: knowledge, ref: base/skills/story-knowledge/SKILL.md}
