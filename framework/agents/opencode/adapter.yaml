adapter_name: opencode
description: |
  OpenCode CLI adapter——原生读 AGENTS.md + 自有 `.opencode/skill`（skill 自动注册为 slash 命令），
  headless = `opencode run`（stdin prompt，`--dangerously-skip-permissions`）。

agent_entry_file:
  template_path: templates/AGENTS.md.template
  target_path: AGENTS.md

# opencode 无 slash 路由文件（skill 自动注册为 /<name>），但**有原生子 agent 配置**：
# .opencode/agent/<name>.md。verifier 是协议级子 agent，只读约束写在它自己的
# frontmatter `permission:` 里（逐工具 deny），不靠调用时另加参数。
commands:
  subagents:
    target_dir: .opencode/agent
    template_dir: templates/agents
    update_policy: auto_overwrite               # verifier 等为协议级子 agent 配置

# opencode 的插件：`.opencode/plugin/*.js` 由宿主**自动发现**，不需要注册文件
# （与 claude 的 settings.json 注册相对）。落地方式同为「模板目录原样复制」。
# record-verifier-report.js 是 verifier 结论的发布器，见下方 verifier_capability。
hooks:
  target_dir: .opencode/plugin
  template_dir: templates/plugin
  update_policy: auto_overwrite                 # 与 harness 契约绑定

skill_bridge:
  target_dir: .opencode/skill
  template_dir: ../shared/agent-bundle/templates/skills-bridge

rules:
  target_dir: .opencode/rules
  template_dir: ../shared/agent-bundle/templates/rules

user_confirmation:
  structured_widget: unsupported
  portable_required: true
  interaction_renderer_rule: templates/rules/interaction-renderer.md

# opencode run stdin headless 无确认读图能力（按实测定档 none）
image_input: none

# 视觉委托（plan ab072691）：本 adapter 可作**只读视觉 provider**。
# 只读手段=结构化权限声明把 edit/bash 等非只读工具置 deny（配合全局 pure 档）；
# **绝不复用** goal headless 的 --dangerously-skip-permissions argv。
# 运行时 argv SSOT：harness/scripts/utils/visual-provider-invoke.ts。
# 入册凭据（plan ab072691 tasks 7.7，宿主 opencode 1.18.14 真实 invocation 实证）：
#   argv `run --pure -m <provider/model> --file <png> --format json`；
#   一次调用 4.8s outcome=success，16/16 断言全过；随机金丝雀四象限 4/4 + 随机 token 逐字命中；
#   invoke 前后 `git status --porcelain` 逐字节一致；usage 由既有 invokeAgentHeadless 回填
#   （capture=stdout_json confidence=proxy）。
#   `events_json` 终稿信封形状即由本轮真实样本钉死：NDJSON `{type,timestamp,sessionID,part}`，
#   正文取 `type==='text'` 行的 `part.text`、终止锚点 `type==='step_finish'`、见 `type==='error'`
#   即判无终稿（实测 401/403 两类 API 错误均在此被挡为 invalid，不会伪造正文）。
visual_provider:
  readonly_invoke: permission_deny_non_read
  image_transport: native_image_flag
  stdout_envelope: events_json
  model_replay: '-m'

goal_capability:
  mode: external_runner
  external_runner:
    # plan a8e5c3f9：headless 全权限契约——本 adapter 一直是唯一正确样板（恒 bypass），
    # 仅把 unattended 声明对齐 effective 值。
    headless_invoke: 'opencode run --dangerously-skip-permissions --dir {{PROJECT_ROOT}}'
    unattended:
      write_mode: full-access
      approval_mode: never

# verifier 能力声明（plan a9d4e7c2 的能力面，本 adapter 于批次 5 步骤 1 补齐）：
# transport=repo_file_request（与 claude-kernel 家族同一份 request 契约，runner 侧零改动）；
# publisher=task_tool_result——opencode 在 `task` 工具完成时触发插件钩子 tool.execute.after，
# 一次交出调用入参（= 那份 request JSON 原文）、子会话 id 与终稿信封，
# templates/plugin/record-verifier-report.js 据此做四方对账后发布
# verifier.report.<subject>.json。**不叫 subagent_stop**：本宿主没有那个事件，机制名要如实。
#
# 入册凭据（宿主 opencode 1.18.26 真实 invocation 实证，模型 bailian/deepseek-v4-flash-0731）：
#   一次 task 调用的 tool.execute.after 载荷同时给出
#   metadata.sessionId=ses_f9d802…（子会话）≠ metadata.parentSessionId=ses_f9d803…（主会话）、
#   args.prompt=投递的 request JSON 原文、args.subagent_type、
#   output.output=`<task id state><task_result>终稿</task_result></task>`。
#   只读手段 A/B 实证：子 agent frontmatter 写 permission 逐工具 deny 时，
#   工具面只剩 glob/grep/read/skill、零写类事件；去掉该声明的对照组立刻拿到 write 并调用它
#   （即：只读来自声明，不是模型自述）。`--auto` 只自动批准未被显式 deny 的权限。
#   **截断边界**：宿主对工具输出有 tool_output 上限（默认 2000 行 / 51200 字节），
#   超限**从头部保留**、全文另存 metadata.outputPath；终态块在终稿末尾，
#   发布器必须在 truncated 时改读 outputPath，否则会静默误判「无终态块」。
# modes 只登记实测过的：interactive 已验收；headless / goal 未验收，不得预填。
verifier_capability:
  transport: repo_file_request
  publisher: task_tool_result
  modes: ["interactive"]

post_install_hooks: []

notes: |
  - 独立 adapter；skill 跳板物化到 opencode **自有原生目录** `.opencode/skill/<id>/SKILL.md`
    （opencode 长期稳定的主 skill 目录、兼容公司当前版本及传统原生目录；不依赖较新的 `.agents`
    外部 skill 发现，亦不碰用户的 `.opencode/opencode.json` 模型/凭据配置）。与 cursor 的「自有目录」模式一致。
  - **opencode 自动加载的只有**：`AGENTS.md`（instructions，根目录，与 generic/chrys/cursor 共享）
    + `.opencode/{skill,skills}/**/SKILL.md`（skill，自动注册为 `/<name>` slash 命令）。
    无需写 `.opencode/commands/`（显式命令才需）。skill 目录各用各的
    （opencode=`.opencode/skill`，generic/chrys=`.agents/skills`），落不同目录、互不冲突。
  - **`.opencode/rules/*` 不被 opencode 自动加载**（opencode 无 `.opencode/rules` 发现逻辑；`*.mdc`
    是 Cursor 格式，对 opencode 惰性）——与 chrys 的 `.agents/rules` 同性质，是**「引用可达」**的被动文档
    （由 skill / AGENTS.md 内容按需引用），**不是** opencode 有效规则入口。**禁止**为承载规则而擅自
    创建/覆盖用户的 `.opencode/opencode.json`。
  - 模型/凭据由 opencode 自身 config/auth（`~/.config/opencode` 或项目 `.opencode/opencode.json`）提供。
  - 运行时 headless stdin 灌 prompt，以 agent-invoke.ts 硬化为准。
  - **迁移**：UPDATE 会新增 `.opencode/skill`/`.opencode/rules`；旧版若曾物化到 `.agents`，该目录**不会自动删除**
    （未同时使用 generic/chrys 时可人工清理，避免 opencode 跨目录扫到同名 skill 仅 logWarning 的噪声）。
  - 口径 SSOT：agents/adapter-schema.yaml（bridge-only）。
