schema_version: "1.0"
description: >
  Goal run manifest — consumed by harness/scripts/utils/goal-manifest.ts and goal-runner.ts.
  SSOT for unattended full-chain automation parameters.

fields:
  start_phase:
    type: string
    default: spec
    description: Inclusive start feature phase
  end_phase:
    type: string
    default: testing
    description: Inclusive end feature phase
  feature:
    type: string
    required: true
    description: Feature slug under doc/features/
  requirement:
    type: string
    description: User requirement text or path to requirement file
  user_deadline_at:
    type: string
    description: >
      Optional absolute UTC deadline explicitly supplied by the user. No default.
      Resume preserves this timestamp; legacy budget numbers do not imply a user deadline.
  requirement_source_files:
    type: array
    items: string
    description: >
      plan c4e8a1f7 T2：需求来源文件列表（项目根相对正斜杠；项目外 source 保留绝对
      路径）。可选字段——仅 fresh --requirement-file 解析写入；旧 manifest 无键不受影响
      （身份哈希条件包含，resume 不误判漂移）。参考图发现的锚点：项目内 source 各直接
      父目录一层做受支持图片扫描，与需求正文显式路径取并集。
  adapter:
    type: string
    description: >
      Effective agent adapter (运行身份). 权威 SSOT 为 framework.local.json agent_adapter；
      与之冲突的 --adapter 会被 goal-runner 阻断（除非 --override-adapter）。
  adapter_provenance:
    type: string
    enum: [user_explicit, entry_declared, local_config, registry, override]
    description: >
      运行身份来源（诚实化回溯）：local_config=取自 framework.local.json SSOT；
      override=经 --override-adapter 显式切换并回写 local；user_explicit/entry_declared/registry=
      首启无 local 时由解析阶梯（用户显式 / 跳板入口声明 / registry 交互）产出的 requested。旧 manifest 可缺省。
  allow_blind_visual:
    type: boolean
    enum: [true]
    deprecated: true
    description: >
      Deprecated legacy field. Readers tolerate historical true values, but runtime
      policy and manifest identity ignore it. New CLI/manifest writers never emit this field.
  chain_override:
    type: array
    items: string
    description: Optional ordered phase list overriding workflow auto_chain
  phase_chain:
    type: array
    items: string
    description: >
      Fresh birth 已解析完成并规范化的实际执行链。由 createGoalRun 单点写入并由
      run_created 同值绑定；modern resume/attach 只读该字段，不重新解析 workflow。
  minimum_assurance:
    type: object
    additionalProperties:
      type: string
      enum: [degraded, full]
    description: >
      Optional sparse phase-to-assurance floor. It only adds assess insufficient_assurance
      gaps and never waives quality-axis, closure, or release rules.
  dependency_policy:
    type: object
    properties:
      deferrable_blocking_classes:
        type: array
        default: [externalBlocked]
      deferrable_failure_kinds:
        type: array
        default: [device_blocked]
      propagate_to_downstream: { type: boolean, default: true }
  unattended:
    type: object
    required_for_runner: true
    properties:
      write_mode: { type: string, enum: [workspace-write, accept-edits, full-access] }
      approval_mode: { type: string, enum: [never, on-request, always] }
      allowed_tools: { type: array, items: string }
  run_id:
    type: string
    description: UUID or timestamp slug; auto-generated if omitted
  report_dir:
    type: string
    default: doc/features/<feature>/goal-runs/<run-id>
