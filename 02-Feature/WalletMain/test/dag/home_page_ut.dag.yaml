# 首页 home-page 业务 UT 追溯；自动化用例以 HomeRepository 可测部分为主，其余 AC/BD 在 DAG 中声明供 harness 覆盖统计，UI/真机在 Skill 6 补强。
flow_id: home_page_ut
flow_name: 首页数据加载与 PRD/AC 追溯
module: home-page
linked_acceptance:
  - AC-1
  - AC-2
  - AC-3
  - AC-4
  - AC-5
  - AC-6
  - AC-7
  - AC-8
  - AC-9
  - AC-10
  - AC-G1
  - AC-G2
linked_boundaries:
  - BD-1
  - BD-2
  - BD-3
entry_point:
  module: WalletMain
  file: 02-Feature/WalletMain/src/main/ets/data/repository/HomeRepository.ets
  function: getServiceEntries
nodes:
  - id: n1
    type: async_call
    description: 异步拉取服务宫格 Mock 数据
    source:
      file: 02-Feature/WalletMain/src/main/ets/data/repository/HomeRepository.ets
      function: getServiceEntries
    stub_strategy: use_real_HomeRepository
    spy_preset: default_entries
    next:
      - n2
  - id: n2
    type: async_call
    description: 异步拉取活动区 Mock 数据
    source:
      file: 02-Feature/WalletMain/src/main/ets/data/repository/HomeRepository.ets
      function: getPromoList
    stub_strategy: use_real_HomeRepository
    spy_preset: default_promos
    next:
      - n3
  - id: n3
    type: assertion
    description: 条数与 AC-2/acceptance 的 min 约束一致；其余 AC 在 linked_acceptance 中声明
    linked_acceptance:
      - AC-2
    assertions:
      - type: state_check
        target: HomeRepository.getServiceEntries.length
        expected: '>= 1'
    next: []
