# HomeLoadingUseCase 业务 DAG — 覆盖 five branches
# v2 强约束：顶层 branches 必须是 use-cases.yaml 中定义的 branch id 字符串数组
flow_id: home_loading
flow_name: 首页加载 UseCase 分支
module: home-page
version: "1.0"

use_case: HomeLoadingUseCase
branches:
  - happy_load
  - empty_services
  - empty_promos
  - all_empty
  - repo_failure

linked_acceptance: [AC-1, AC-2, AC-10]
linked_boundaries: [BD-1, BD-2]

entry_point:
  module: WalletMain
  file: 02-Feature/WalletMain/src/main/ets/domain/usecase/HomeLoadingUseCase.ets
  function: onAppear

nodes:
  - id: t1
    type: user_trigger
    description: UI 层 aboutToAppear 转发 useCase.onAppear()
    source:
      file: 02-Feature/WalletMain/src/main/ets/domain/usecase/HomeLoadingUseCase.ets
      function: onAppear
      class: HomeLoadingUseCase
    trigger:
      event: onAppear
    next: [s1]

  - id: s1
    type: state_transition
    description: state.phase → Loading
    transition:
      to_phase: Loading
    next: [p1]

  - id: p1
    type: port_call_local
    description: 调用 repo.getServiceEntries()
    source:
      file: 02-Feature/WalletMain/src/main/ets/data/port/HomeDataPort.ets
      function: getServiceEntries
      class: HomeDataPort
    stub_strategy: mock_response
    mock_data:
      success_nonempty: { description: 返回非空列表, value: "[{ id:'s1', ... }, { id:'s2', ... }]" }
      success_empty:    { description: 返回空列表,   value: "[]" }
      throw:            { description: 异常,        value: "throw new Error('network')" }
    next: [b1]

  - id: b1
    type: conditional_branch
    description: getServiceEntries 成功/失败分支
    condition: "getServiceEntries resolved"
    branches:
      true_branch: [p2]
      false_branch: [s_fail]

  - id: p2
    type: port_call_local
    description: 调用 repo.getPromoList()
    source:
      file: 02-Feature/WalletMain/src/main/ets/data/port/HomeDataPort.ets
      function: getPromoList
      class: HomeDataPort
    stub_strategy: mock_response
    mock_data:
      success_nonempty: { description: 返回非空列表, value: "[{ id:'p1', ... }]" }
      success_empty:    { description: 返回空列表,   value: "[]" }
    next: [b2]

  - id: b2
    type: conditional_branch
    description: 依据 services/promos 是否均空决定 Success 或 Empty
    condition: "services.length === 0 && promos.length === 0"
    branches:
      true_branch: [s_empty]
      false_branch: [s_success]

  - id: s_success
    type: state_transition
    description: state.phase → Success
    transition:
      to_phase: Success
    next: [a_success]

  - id: s_empty
    type: state_transition
    description: state.phase → Empty
    transition:
      to_phase: Empty
    next: [a_empty]

  - id: s_fail
    type: state_transition
    description: state.phase → Failed；errorCode=LOAD_ERR；services/promos 回退为空
    transition:
      to_phase: Failed
    next: [a_fail]

  - id: a_success
    type: assertion
    description: 服务与活动均有数据的成功断言（happy_load；empty_services / empty_promos 走同一 Success 子图但数据不同）
    linked_branch: happy_load
    linked_acceptance: [AC-1, AC-2]
    assertions:
      - { type: state_check, target: state.phase,           expected: "Success" }
      - { type: state_check, target: state.errorCode,       expected: "null" }
      - { type: data_check,  target: repo.callLog,          expected: "['getServiceEntries','getPromoList']" }

  - id: a_empty_services
    type: assertion
    description: 服务空、活动非空
    linked_branch: empty_services
    linked_acceptance: [BD-2]
    assertions:
      - { type: state_check, target: state.phase,           expected: "Success" }
      - { type: state_check, target: state.services.length, expected: "0" }
      - { type: state_check, target: state.promos.length,   expected: ">= 1" }

  - id: a_empty_promos
    type: assertion
    description: 活动空、服务非空
    linked_branch: empty_promos
    linked_acceptance: [BD-2]
    assertions:
      - { type: state_check, target: state.phase,           expected: "Success" }
      - { type: state_check, target: state.services.length, expected: ">= 1" }
      - { type: state_check, target: state.promos.length,   expected: "0" }

  - id: a_empty
    type: assertion
    description: 两侧都空
    linked_branch: all_empty
    linked_acceptance: [BD-2]
    assertions:
      - { type: state_check, target: state.phase,           expected: "Empty" }
      - { type: state_check, target: state.services.length, expected: "0" }
      - { type: state_check, target: state.promos.length,   expected: "0" }

  - id: a_fail
    type: assertion
    description: 端口异常分支
    linked_branch: repo_failure
    linked_acceptance: [AC-10]
    assertions:
      - { type: state_check, target: state.phase,           expected: "Failed" }
      - { type: state_check, target: state.errorCode,       expected: "'LOAD_ERR'" }
      - { type: state_check, target: state.services.length, expected: "0" }
