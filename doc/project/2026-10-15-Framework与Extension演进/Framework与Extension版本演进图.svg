<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1000" viewBox="0 176 1920 1000" role="img" aria-labelledby="title desc">
<title id="title">Framework 与 Story Extension 版本及能力演进</title>
<desc id="desc">两条产品线按基础流程、能力增强、在研深化和后续方向排列。Framework 已发布至3.0，Extension已发布至1.9.8；3.1与1.9.9、2.x仍在开发验证。阶段对齐不表示同期发布。</desc>
