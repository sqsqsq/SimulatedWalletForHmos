# 从 PRD.md 提取的验收与边界 — home-page（与 PRD v1.4 对齐）
# ut_layer / ut_focus / device_focus 用于 UT ↔ Device 分层分工：
#   unit   = UT 直接覆盖（驱动现有业务代码 + 自然边界打桩）
#   device = 纯 UI/机型/性能，Skill 6 真机覆盖
#   both   = UT 验证逻辑分支，真机验证 UI 副作用（须拆分 ut_focus + device_focus）
schema_version: "1.0"
feature: "home-page"

criteria:
  - id: "AC-1"
    prd_function: "F1"
    priority: "P0"
    description: "双 Tab 下切到首页，HomeTabPage 展示标题区与可滚动主区域，无未捕获崩溃"
    testable: true
    verification_steps:
      - "安装并冷启应用，切到底 Tab「首页」"
    expected_result: "页面可见主结构，无崩溃"
    ut_layer: "both"
    ut_focus: "HomeRepository.getServiceEntries / getPromoList 返回值不为 null 且数据模型字段齐全"
    device_focus: "切到首页 Tab 后无白屏、无崩溃；标题区可见（文案、加号、消息图标）；主区域可滚动"

  - id: "AC-2"
    prd_function: "F1"
    priority: "P0"
    description: "服务与活动数据加载后，宫格与活动区有可见条目"
    testable: true
    verification_steps:
      - "进入首页并等待数据出现"
    expected_result: "服务宫格与活动区至少各展示 1 条（与 HomeRepository Mock 一致）"
    data_constraints:
      min_service_items: 1
      min_promo_items: 1
    ut_layer: "unit"
    ut_focus: "HomeRepository.getServiceEntries().length ≥ 1 且 getPromoList().length ≥ 1"

  - id: "AC-3"
    prd_function: "F2"
    priority: "P0"
    description: "卡引导可点区可进入卡包"
    testable: true
    verification_steps:
      - "点击卡面/引导区"
    expected_result: "导航至 CardPackPage"
    ut_layer: "device"
    device_focus: "点击卡引导区后导航栈栈顶为 CardPackPage；转场动画自然无异常"

  - id: "AC-4"
    prd_function: "F2"
    priority: "P0"
    description: "「添加/管理卡」主按钮进入卡包（与当前实现一致）"
    testable: true
    verification_steps:
      - "点击主按钮"
    expected_result: "导航至 CardPackPage"
    ut_layer: "device"
    device_focus: "点击「添加/管理卡」主按钮，导航栈栈顶为 CardPackPage"

  - id: "AC-5"
    prd_function: "F3"
    priority: "P0"
    description: "加号进入添卡入口页"
    testable: true
    verification_steps:
      - "点击标题栏加号"
    expected_result: "导航至 AddCardEntryPage"
    ut_layer: "device"
    device_focus: "点击标题栏加号，导航栈栈顶为 AddCardEntryPage"

  - id: "AC-6"
    prd_function: "F3"
    priority: "P0"
    description: "消息入口有可观察反馈"
    testable: true
    verification_steps:
      - "点击消息图标"
    expected_result: "Toast 或等价反馈出现"
    ut_layer: "device"
    device_focus: "点击消息图标出现 Toast（文案匹配 msg_center_welcome）；持续时长 ≥ 1.5s"

  - id: "AC-7"
    prd_function: "F4"
    priority: "P1"
    description: "服务宫格 3 列展示"
    testable: true
    verification_steps:
      - "目视检查宫格列数"
    expected_result: "与 ServiceGridSwiper 3 列栅格一致"
    ut_layer: "device"
    device_focus: "宫格实际列数为 3；超过 3 项时能进入第二页/滑动"

  - id: "AC-8"
    prd_function: "F5"
    priority: "P1"
    description: "活动区含标题、轮播与指示器"
    testable: true
    verification_steps:
      - "进入首页，观察活动区"
    expected_result: "有标题、至少 1 张活动卡、有轮播指示/自动播行为与实现可对应"
    ut_layer: "device"
    device_focus: "活动区有标题；至少 1 张活动卡可见；存在轮播指示/自动播行为"

  - id: "AC-9"
    prd_function: "F5"
    priority: "P1"
    description: "活动卡点击有确定策略"
    testable: true
    verification_steps:
      - "点击活动卡"
    expected_result: "Toast 或占位，与产品/代码策略一致，不崩溃"
    ut_layer: "device"
    device_focus: "点击活动卡出现 Toast 或占位；不崩溃"

  - id: "AC-10"
    prd_function: "F6"
    priority: "P1"
    description: "无网不崩溃"
    testable: true
    verification_steps:
      - "飞行模式进首页"
    expected_result: "不白屏死锁，可有 Toast/空态"
    ut_layer: "device"
    device_focus: "飞行模式下切到首页不白屏；Toast 文案为 home_data_unavailable 对应字符串；页面能自然滚动"

  - id: "AC-G1"
    prd_function: "F1"
    priority: "P0"
    description: "首页布局与 ux-reference 基线图 ref_home_no_card（1.首页-无卡.jpg）一致：纵向区块顺序、标题栏结构完整、无叠盖与整块失效"
    testable: true
    verification_steps:
      - "在目标机型进入首页 Tab"
      - "并排对照 doc/features/home-page/ux-reference/1.首页-无卡.jpg 与 README 中 ref_home_no_card 说明"
      - "检查：① 卡引导→宫格→活动区顺序完整 ② 标题栏左文右侧图标可见且无与中叠盖 ③ 无主交互区被遮挡或整页断层不可滚动"
    expected_result: "三项均满足；与 README 首页职责语义冲突则 FAIL 并需更新 UX 或 PRD"
    ut_layer: "device"
    device_focus: "目标机型上页面布局无重叠、截断；与 ref_home_no_card 基线走查一致"

  - id: "AC-G2"
    prd_function: "F1"
    priority: "P0"
    description: "主操作 300ms 内反馈"
    testable: true
    verification_steps:
      - "连点可点击主操作"
    expected_result: "有视觉或导航反馈"
    ut_layer: "device"
    device_focus: "点击主按钮后 300ms 内出现视觉/导航反馈"

boundaries:
  - id: "BD-1"
    prd_exception: "E1"
    scenario: "network_offline"
    description: "无网络"
    handling: "缓存或空态、Toast 提示"
    expected_behavior: "不崩溃、可进入首页"
    ut_layer: "device"
    device_focus: "无网络下 Toast 出现且文案正确；刷新后网络恢复能重试加载"

  - id: "BD-2"
    prd_exception: "E2"
    scenario: "empty_data"
    description: "服务或活动空列表"
    handling: "隐藏区块或空态"
    expected_behavior: "不崩溃"
    ut_layer: "device"
    device_focus: "服务为空时宫格区域隐藏或显示空态；活动为空时活动区隐藏或显示空态；都为空时页面不崩溃仍可滚动"

  - id: "BD-3"
    prd_exception: "E3"
    scenario: "no_nav_stack"
    description: "无 navPathStack 上下文"
    handling: "不 push 或保护"
    expected_behavior: "不崩溃、可 Toast"
    ut_layer: "device"
    device_focus: "无导航栈时点击跳转按钮不崩溃，可出现 Toast 或静默"

performance:
  - id: "NFR-1"
    metric: "首屏可交互"
    threshold: "<= 2s"
  - id: "NFR-2"
    metric: "轮播区滑动体验"
    threshold: ">= 55 FPS 目标值（真机以实践为准）"

coverage_summary:
  p0_p1_functions: 6
  ac_linked: 12
