schema_version: "1.0"
feature: home-page
# UT 策略（mock-plan_traceability）：当前 UT 直接使用 HomeRepository 内置 Mock，返回数据与下方 presets 一致；
# 未使用 Spy 子类注入。DAG / spy_preset 保留为规约与 harness 追溯；若日后改为 Spy，请在 UT 中替换为 SpyHomeRepository 并删除本注记。
imports:
  - { symbol: ServiceEntry, from: "02-Feature/WalletMain/src/main/ets/data/model/ServiceEntry" }
  - { symbol: PromoInfo, from: "02-Feature/WalletMain/src/main/ets/data/model/PromoInfo" }
spies:
  - target_class: HomeRepository
    target_file: 02-Feature/WalletMain/src/main/ets/data/repository/HomeRepository.ets
    base_strategy: subclass
    spy_fields:
      - { name: callLog, type: "string[]", default: "[]" }
    methods:
      - name: getServiceEntries
        params: []
        return_type: { text: "Promise<ServiceEntry[]>" }
        presets:
          - id: default_entries
            returns:
              ts_expr: |
                [
                  { id: 's1', name: $r('app.string.home_mock_service_s1_name'), icon: $r('sys.symbol.creditcard') },
                  { id: 's2', name: $r('app.string.home_mock_service_s2_name'), icon: $r('sys.symbol.doc_plaintext') },
                  { id: 's3', name: $r('app.string.home_mock_service_s3_name'), icon: $r('sys.symbol.gift') },
                  { id: 's4', name: $r('app.string.home_mock_service_s4_name'), icon: $r('sys.symbol.square_grid_2x2') }
                ] as ServiceEntry[]
      - name: getPromoList
        params: []
        return_type: { text: "Promise<PromoInfo[]>" }
        presets:
          - id: default_promos
            returns:
              ts_expr: |
                [
                  {
                    id: 'p1',
                    title: $r('app.string.home_mock_promo_p1_title'),
                    description: $r('app.string.home_mock_promo_p1_desc'),
                    image: $r('sys.symbol.camera')
                  },
                  {
                    id: 'p2',
                    title: $r('app.string.home_mock_promo_p2_title'),
                    description: $r('app.string.home_mock_promo_p2_desc'),
                    image: $r('sys.symbol.lock')
                  }
                ] as PromoInfo[]
