# 从 design.md 抽取的功能级契约 — home-page（对齐 PRD v1.4 / design v1.3）
schema_version: "1.0"
feature: "home-page"

# 与 PRD Visual Handoff 对齐（脚本以 PRD 为准；此处与 PRD v1.4 / design v1.3 同形）
visual_handoff:
  inherited_from_prd: true
  ui_change: "new_or_changed"
  kind: "screenshot_pack"
  authoritative_refs:
    - id: "home_ux_readme_index"
      path: "doc/features/home-page/ux-reference/README.md"
    - id: "home_screenshot_archive"
      path: "doc/features/home-page/ux-reference"
    - id: "ref_home_no_card"
      path: "doc/features/home-page/ux-reference/1.首页-无卡.jpg"
    - id: "ref_mine_tab"
      path: "doc/features/home-page/ux-reference/2.我的.jpg"
    - id: "ref_card_pack_empty"
      path: "doc/features/home-page/ux-reference/3.卡包-无卡.jpg"
    - id: "ref_add_card_entry"
      path: "doc/features/home-page/ux-reference/4.添卡入口.jpg"
    - id: "ref_manage_non_local_cards"
      path: "doc/features/home-page/ux-reference/5.管理非本机卡片.jpg"

# 可测的视觉与布局约定（模拟工程允许与截图像素不完全一致）
visual_parity_contract:
  baseline: |
    区域划分与信息架构以 PRD §5、doc/features/home-page/ux-reference/（含 README 与各 jpg）为走查基线；旧路径 doc/原始需求/ 不作为真源。
    首页整块布局走查绑定 PRD AC-G1：对照 ux-reference/README 中 ref_home_no_card → 1.首页-无卡.jpg（纵向区块顺序、标题栏左右分区可达、无主交互叠盖）。
  acceptable_deviations:
    - 模拟数据、占位图、高清导出未入库
    - 服务/活动条数与截图不一致时以不崩溃与 AC 语义为准
  measurable:
    title_bar:
      string_key: "app.string.home_title"
      font_size_float_key: "app.float.home_title_size"
    service_grid:
      columns: 3
      rows_visible_per_page: 1
      prd_trace: "AC-7 / F4"
    promo_carousel:
      auto_play: true
      indicator_required: true
      min_cards: 1
      prd_trace: "AC-8 / F5"
    layout_walkthrough_ac_g1:
      ux_ref_id: "ref_home_no_card"
      screenshot_path: "doc/features/home-page/ux-reference/1.首页-无卡.jpg"
      prd_trace: "AC-G1"
      checks:
        - "纵向顺序：卡引导区 → 服务宫格 → 活动/更多服务区完整且无整块缺失"
        - "标题栏：左侧标题区与右侧消息/加号图标区可见，不与中部 Scroll 内容叠盖"
        - "主路径可滚动可达：不出现整块留白导致下方区块不可达或主按钮不可点"

modules:
  - name: "WalletMain"
    layer: "02-Feature"
    format: "HAR"
    change_type: "modify"
    package_path: "02-Feature/WalletMain"

module_dependencies:
  - from: "WalletMain"
    to: "CommUI"
    kind: "oh_package"
  - from: "WalletMain"
    to: "CommFunc"
    kind: "transitive_or_product"

data_models:
  - name: "ServiceEntry"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/data/model/ServiceEntry.ets"
    kind: "interface"
    fields:
      - name: "id"
        type: "string"
        required: true
      - name: "name"
        type: "Resource"
        required: true
      - name: "icon"
        type: "Resource"
        required: true
  - name: "PromoInfo"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/data/model/PromoInfo.ets"
    kind: "interface"
    fields:
      - name: "id"
        type: "string"
        required: true
      - name: "title"
        type: "Resource"
        required: true
      - name: "description"
        type: "Resource"
        required: true
      - name: "image"
        type: "Resource"
        required: true

interfaces:
  - module: "WalletMain"
    layer: "data/repository"
    file: "02-Feature/WalletMain/src/main/ets/data/repository/HomeRepository.ets"
    class: "HomeRepository"
    methods:
      - name: "getServiceEntries"
        params: []
        return: "Promise<ServiceEntry[]>"
        async: true
        description: "服务宫格数据源（当前为模拟）"
      - name: "getPromoList"
        params: []
        return: "Promise<PromoInfo[]>"
        async: true
        description: "活动轮播数据源（当前为模拟）"

components:
  - name: "HomeTabPage"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/presentation/pages/HomeTabPage.ets"
    kind: "page"
    state:
      - "services: ServiceEntry[]"
      - "promos: PromoInfo[]"
    props: []
    events: []
    children:
      - "CardGuideSection"
      - "ServiceGridSwiper"
      - "PromoSwiper"
  - name: "CardGuideSection"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/CardGuideSection.ets"
    kind: "component"
    state: []
    props: []
    events:
      - "onGoCardPack"
      - "onGoAddCard"
    children:
      - "CardImageBanner"
  - name: "ServiceGridSwiper"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/ServiceGridSwiper.ets"
    kind: "component"
    state: []
    props:
      - "services: ServiceEntry[]"
    events: []
    children: []
  - name: "PromoSwiper"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/PromoSwiper.ets"
    kind: "component"
    state: []
    props:
      - "promos: PromoInfo[]"
    events: []
    children: []

state_management:
  - data: "navPathStack"
    scope: "App root Navigation"
    mechanism: "@Provide / @Consume"
  - data: "services / promos"
    scope: "HomeTabPage"
    mechanism: "@State + HomeRepository"

navigation:
  routes:
    - name: "CardPackPage"
      module: "WalletMain"
      pushed_from: "HomeTabPage / CardGuideSection"
    - name: "AddCardEntryPage"
      module: "WalletMain"
      pushed_from: "HomeTabPage title bar"

