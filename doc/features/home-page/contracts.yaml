# 从 design.md 抽取的功能级契约 — home-page
schema_version: "1.0"
feature: "home-page"

modules:
  - name: "WalletMain"
    layer: "02-Feature"
    format: "HAR"
    change_type: "modify"
    package_path: "02-Feature/WalletMain"

module_dependencies:
  - from: "WalletMain"
    to: "CommUI"
    kind: "oh_package"
  - from: "WalletMain"
    to: "CommFunc"
    kind: "transitive_or_product"

data_models:
  - name: "ServiceEntry"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/data/model/ServiceEntry.ets"
    kind: "interface"
    fields:
      - name: "id"
        type: "string"
        required: true
      - name: "name"
        type: "Resource"
        required: true
      - name: "icon"
        type: "Resource"
        required: true
  - name: "PromoInfo"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/data/model/PromoInfo.ets"
    kind: "interface"
    fields:
      - name: "id"
        type: "string"
        required: true
      - name: "title"
        type: "Resource"
        required: true
      - name: "description"
        type: "Resource"
        required: true
      - name: "image"
        type: "Resource"
        required: true

interfaces:
  - module: "WalletMain"
    layer: "data/repository"
    file: "02-Feature/WalletMain/src/main/ets/data/repository/HomeRepository.ets"
    class: "HomeRepository"
    methods:
      - name: "getServiceEntries"
        params: []
        return: "Promise<ServiceEntry[]>"
        async: true
        description: "服务宫格数据源（当前为模拟）"
      - name: "getPromoList"
        params: []
        return: "Promise<PromoInfo[]>"
        async: true
        description: "活动轮播数据源（当前为模拟）"

components:
  - name: "HomeTabPage"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/presentation/pages/HomeTabPage.ets"
    kind: "page"
    state:
      - "services: ServiceEntry[]"
      - "promos: PromoInfo[]"
    props: []
    events: []
    children:
      - "CardGuideSection"
      - "ServiceGridSwiper"
      - "PromoSwiper"
  - name: "CardGuideSection"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/CardGuideSection.ets"
    kind: "component"
    state: []
    props: []
    events:
      - "onGoCardPack"
      - "onGoAddCard"
    children:
      - "CardImageBanner"
  - name: "ServiceGridSwiper"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/ServiceGridSwiper.ets"
    kind: "component"
    state: []
    props:
      - "services: ServiceEntry[]"
    events: []
    children: []
  - name: "PromoSwiper"
    module: "WalletMain"
    file: "02-Feature/WalletMain/src/main/ets/presentation/components/PromoSwiper.ets"
    kind: "component"
    state: []
    props:
      - "promos: PromoInfo[]"
    events: []
    children: []

state_management:
  - data: "navPathStack"
    scope: "App root Navigation"
    mechanism: "@Provide / @Consume"
  - data: "services / promos"
    scope: "HomeTabPage"
    mechanism: "@State + HomeRepository"

navigation:
  routes:
    - name: "CardPackPage"
      module: "WalletMain"
      pushed_from: "HomeTabPage / CardGuideSection"
    - name: "AddCardEntryPage"
      module: "WalletMain"
      pushed_from: "HomeTabPage title bar"

files:
  - "02-Feature/WalletMain/src/main/ets/Index.ets"
  - "02-Feature/WalletMain/src/main/ets/data/model/CardCategory.ets"
  - "02-Feature/WalletMain/src/main/ets/data/model/FinanceEntry.ets"
  - "02-Feature/WalletMain/src/main/ets/data/model/PromoInfo.ets"
  - "02-Feature/WalletMain/src/main/ets/data/model/ServiceEntry.ets"
  - "02-Feature/WalletMain/src/main/ets/data/model/SettingEntry.ets"
  - "02-Feature/WalletMain/src/main/ets/data/repository/CardRepository.ets"
  - "02-Feature/WalletMain/src/main/ets/data/repository/HomeRepository.ets"
  - "02-Feature/WalletMain/src/main/ets/data/repository/MineRepository.ets"
  - "02-Feature/WalletMain/src/main/ets/presentation/components/AccountCard.ets"
  - "02-Feature/WalletMain/src/main/ets/presentation/components/CardCategoryList.ets"
  - "02-Feature/WalletMain/src/main/ets/presentation/components/CardGuideSection.ets"
  - "02-Feature/WalletMain/src/main/ets/presentation/components/PromoSwiper.ets"
  - "02-Feature/WalletMain/src/main/ets/presentation/components/ServiceGridSwiper.ets"
  - "02-Feature/WalletMain/src/main/ets/presentation/pages/AddCardEntryPage.ets"
  - "02-Feature/WalletMain/src/main/ets/presentation/pages/CardPackPage.ets"
  - "02-Feature/WalletMain/src/main/ets/presentation/pages/HomeTabPage.ets"
  - "02-Feature/WalletMain/src/main/ets/presentation/pages/MineTabPage.ets"
  - "02-Feature/WalletMain/src/main/ets/shared/components/CardImageBanner.ets"
  - "02-Feature/WalletMain/src/main/ets/shared/constant/HomeConstants.ets"

prd_to_code_traceability:
  - prd_id: "F1"
    files:
      - "02-Feature/WalletMain/src/main/ets/presentation/pages/HomeTabPage.ets"
      - "02-Feature/WalletMain/src/main/ets/data/repository/HomeRepository.ets"
  - prd_id: "F2"
    files:
      - "02-Feature/WalletMain/src/main/ets/presentation/components/CardGuideSection.ets"
      - "02-Feature/WalletMain/src/main/ets/shared/components/CardImageBanner.ets"
  - prd_id: "F3"
    files:
      - "02-Feature/WalletMain/src/main/ets/presentation/pages/HomeTabPage.ets"
  - prd_id: "F4"
    files:
      - "02-Feature/WalletMain/src/main/ets/presentation/components/ServiceGridSwiper.ets"
  - prd_id: "F5"
    files:
      - "02-Feature/WalletMain/src/main/ets/presentation/components/PromoSwiper.ets"
  - prd_id: "F6"
    files:
      - "02-Feature/WalletMain/src/main/ets/presentation/pages/HomeTabPage.ets"
      - "02-Feature/WalletMain/src/main/ets/data/repository/HomeRepository.ets"
