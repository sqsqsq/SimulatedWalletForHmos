              description: "(F4): 原有 4 条分享，发第 5
                条时没得到回应而车云其实已建立：回来时配额显示已满，仍用同一幂等标识确认到这一条并清草稿，不出现第二条；若名额实际被另一次发起\
                占满，车云返回满额，按满额提示，并在原请求与幂等标识同时持久清理成功后开放编辑。"
              testable: true
              verification_status: not_run
            - id: AC-31
              description: "(F5, F6, F9):
                接受或撤销请求失败或没得到回应时，端侧不按旧状态下结论：重取状态后按车云状态显示，只有仍是待接受才可再点添加、仍是生效才可再撤\
                ；重取时当前账号下取不到这条，按已不可用移除，与查询失败（结果待确认）分开。"
              testable: true
              verification_status: not_run
            - id: AC-32
              description: "(F4): 发给对象 A 没得到回应后回到设置页：对象、权限、有效期按那次请求只读展示，点发出确认的是给 A
                的那一条；页面不能先改成对象 B 再借这个幂等标识发出，确认前也不显示「已分享给 B」。"
              testable: true
              verification_status: not_run
            - id: AC-33
              description: "(F4): 同一账号先在甲车设置页留下草稿，再从乙车进入：乙车设置页不回填甲车的草稿，回到甲车时草稿仍在。"
              testable: true
              verification_status: not_run
            - id: AC-34
              description: "(F4):
                分别在四个时点关掉应用后回来：保存选择后、写入原请求后发送前、发送后回包前、建立成功后清除草稿前。每一次都能确定要恢复的请求、\
                允许的操作和清除责任：保存选择后恢复选择；写入原请求之后、回包之前都用同一请求确认；建立之后只能确认同一请求或重试清理。"
              testable: true
              verification_status: not_run
            - id: AC-35
              description: "(F4):
                原请求写入失败时不发送；草稿读取失败或损坏时不当成没有草稿、不自动换标识重发；草稿超过存储上限时提示保存失败，不截断、不改存明\
                文。原请求已发出、回包未到时草稿损坏：先做创建恢复，不提供删除后重建；原请求稍后建成时管理列表只有这一条。"
              testable: true
              verification_status: not_run
            - id: AC-36
              description: "(F4): 同账号同车辆从两个入口同时发出，只形成一份原请求；同账号两辆车各自发出互不阻塞。"
              testable: true
              verification_status: not_run
            - id: AC-37
              description: "(F4, F8): 退出登录后旧账号请求的回调才到达，不写到新账号的页面，也不重建已清除的草稿；同一次请求的重复回调只结算一次。"
              testable: true
              verification_status: not_run
            - id: AC-38
              description: "(F3):
                取消选择联系人、联系人没有有效账号时不发权限查询；换对象后上一个对象的权限选择作废；权限选项为空或无法解释时提示重新获取。"
              testable: true
              verification_status: not_run
            - id: AC-39
              description: "(F6, F5): 在接受页停留超过待接受有效期（72
                小时，上游约束：产品需求）后再点添加、另一端已接受后再点添加、分享已到期后在旧管理页撤销：都按重新取得的状态显示已作废、已生效\
                或已到期，不因这次错误恢复成待接受或生效。接受已生效但回应丢失、车主随即撤销且对方离线：重取为撤销中，卡片保留到收回完成，不再\
                显示添加。"
              testable: true
              verification_status: not_run
            - id: AC-40
              description: "(F8): 冷启动时还没有登录不清除草稿；同一模拟账号登录后能恢复它的草稿，登录前不回填、不发送。"
              testable: true
              verification_status: not_run
            - id: AC-41
              description: "(F4, F8): 原创建已发出 → 草稿损坏 → 退出登录并清掉本地 → 同一账号再登录进这辆车的设置页：创建恢复返回
                pending 时不能新建、找回原请求后只确认那一条；返回 established 时显示原来那条分享及当前状态；返回
                clear 时允许新建，旧请求之后晚到也不出现第二条；查询失败时这辆车保持发起受限、管理页可看可重查。"
              testable: true
              verification_status: not_run
            - id: AC-42
              description: "(F4):
                创建恢复不影响已有能力：完整草稿仍用自己的幂等标识续办，不做创建恢复；取消或换对象照常作废旧档位；另一辆车、另一个账号各自独立\
                恢复，互不阻塞、互不串数据。"
              testable: true
              verification_status: not_run
            - id: AC-43
              description: "(F4): 这辆车本地从没有过草稿（首次使用），或上次成功发出后草稿已清，进设置页时先做创建恢复：clear
                才开放空表单；pending 只确认原请求；unknown 或查询失败时这辆车暂停新发起，管理页照常可看、可重查。"
              testable: true
              verification_status: not_run
            - id: AC-3
              description: "(F5): 分享发出后对方在期限内未接受即自动作废，作废条目在列表可见，可重新发起（承接：AC-K3）。"
              testable: true
              verification_status: not_run
            - id: AC-8
              description: "(F8): 全程页面与记录不出现对方完整账号或手机号，只显示昵称与打码账号（承接：AC-K8）。"
              testable: true
              verification_status: not_run
            - id: AC-22
              description: "(F1, F3): 新增页面与卡片的方向性参数用 start/end，从右到左语言下镜像正确（UX-01）。"
              testable: true
              verification_status: not_run
            - id: AC-23
              description: "(F8): 输出面打码、业务接口传可识别标识、草稿按 7.3 保护与清除（SEC-01）。"
              testable: true
              verification_status: not_run
            - id: AC-24
              description: "(F4, F5): 分享相关调用每次进页拉取一次，草稿只在选择完成、发出前与结束时读写，没有定时任务或后台轮询（DFX-01）。"
              testable: true
              verification_status: not_run
            - id: AC-25
              description: "(F4, F5, F6):
                创建、接受、撤销可定位到失败步骤；三个流程的事件结果完整、同次不重复、字段来源真实、编码无冲突；车型类别缺失按未知，失败说明是\
                映射后的安全说明，不含账号与车牌（OBS-02、OBS-03、OBS-05、OBS-06）。"
              testable: true
              verification_status: not_run
            - id: AC-26
              description: "(F3, F6):
                图标复用优先，新引入的写明依据；文案复用优先，新增的中英文齐备并进待翻译清单；新增字符串资源的条数与体积给出数值（RES-01\
                、RES-02、DLV-01、DFX-02）。"
              testable: true
              verification_status: not_run
            - id: AC-27
              description: "(F4): 六个车云接口按四问逐个给出兼容结论（COMPAT-01）。"
              testable: true
              verification_status: not_run
            - id: AC-28
              description: "(F4): 清除数据后先清遗留草稿再开放、不崩溃；重复触发发出不会创建第二条（ENV-01、ENV-02）。"
              testable: true
              verification_status: not_run
            - id: AC-G1
              description: "(F1, F6): 新页面与卡包车钥匙卡片在深色、大字下可读可点。"
              testable: true
              verification_status: not_run
            - id: AC-G2
              description: "(F2, F5): 网络异常时有明确错误提示，不白屏、不崩溃。"
              testable: true
              verification_status: not_run
            - id: AC-G3
              description: "(F5, F9): 断网进管理页或卡包给网络失败态，不展示陈旧列表。"
              testable: true
              verification_status: not_run
