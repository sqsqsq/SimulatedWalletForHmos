# 未物化候选；关联真实候选字节，不表示原生接受、闭环或测试通过。
schema_version: "1.0"
feature: wallet-key-sharing
modules:
  - name: WalletMain
    layer: 02-Feature
    format: har
    change_type: modify
    package_path: 02-Feature/WalletMain
  - name: Phone
    layer: 01-Product
    format: hap
    change_type: modify
    package_path: 01-Product/Phone
module_dependencies:
  WalletMain:
    - AccountManager
    - CommUI
    - CommFunc
  Phone:
    - WalletMain
data_models:
  - name: AccountSession
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/WalletIdentity.ets
    kind: interface
    fields:
      - name: accountKey
        type: string
        required: true
      - name: sessionId
        type: string
        required: true
  - name: ShareContact
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/WalletIdentity.ets
    kind: interface
    fields:
      - name: name
        type: string
        required: true
      - name: granteeId
        type: string
        required: false
  - name: OwnerCarKey
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/KeySharing.ets
    kind: interface
    fields:
      - name: vehicleId
        type: string
        required: true
      - name: modelName
        type: string
        required: true
      - name: modelCategory
        type: string
        required: false
  - name: ReceivedCarKey
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/KeySharing.ets
    kind: interface
    fields:
      - name: shareId
        type: string
        required: true
      - name: vehicleId
        type: string
        required: true
      - name: modelName
        type: string
        required: true
      - name: modelCategory
        type: string
        required: false
      - name: ownerNickname
        type: string
        required: true
      - name: permissionLevel
        type: string
        required: true
      - name: validUntil
        type: string
        required: true
      - name: status
        type: ShareState
        required: true
      - name: recallDeadline
        type: string
        required: false
  - name: GrantPermissionView
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/KeySharing.ets
    kind: interface
    fields:
      - name: granteeId
        type: string
        required: true
      - name: shareable
        type: boolean
        required: true
      - name: permissionLevels
        type: string[]
        required: true
      - name: reason
        type: string
        required: false
  - name: QuotaView
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/KeySharing.ets
    kind: interface
    fields:
      - name: canShare
        type: boolean
        required: true
      - name: remaining
        type: number
        required: true
      - name: reason
        type: string
        required: false
  - name: ShareItem
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/KeySharing.ets
    kind: interface
    fields:
      - name: shareId
        type: string
        required: true
      - name: status
        type: ShareState
        required: true
      - name: permissionLevel
        type: string
        required: true
      - name: validUntil
        type: string
        required: true
      - name: granteeMasked
        type: string
        required: true
  - name: ShareDraft
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/KeySharing.ets
    kind: interface
    fields:
      - name: accountKey
        type: string
        required: true
      - name: vehicleId
        type: string
        required: true
      - name: granteeId
        type: string
        required: true
      - name: granteeDisplay
        type: string
        required: true
      - name: permissionLevel
        type: string
        required: true
      - name: validUntil
        type: string
        required: true
      - name: request
        type: ShareCreateRequest
        required: false
      - name: idempotencyKey
        type: string
        required: false
  - name: DraftReadResult
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/KeySharing.ets
    kind: interface
    fields:
      - name: kind
        type: "'absent' | 'found' | 'unavailable' | 'corrupted'"
        required: true
      - name: draft
        type: ShareDraft
        required: false
      - name: reason
        type: string
        required: false
  - name: CreationRecovery
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/KeySharing.ets
    kind: interface
    fields:
      - name: kind
        type: "'pending' | 'established' | 'clear' | 'unknown'"
        required: true
      - name: request
        type: ShareCreateRequest
        required: false
      - name: idempotencyKey
        type: string
        required: false
      - name: shareId
        type: string
        required: false
      - name: status
        type: ShareState
        required: false
      - name: reason
        type: string
        required: false
  - name: ShareState
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/KeySharing.ets
    kind: enum
    fields:
      - name: value
        type: "'pending' | 'active' | 'voided' | 'expired' | 'revoking' | 'revoked'"
        required: true
  - name: ShareSetupActions
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/presentation/interaction/ShareSetupPageOperates.ets
    kind: enum
    fields: []
    pattern_roles:
      - pattern: page-interaction
        role: 动作枚举
        decision_id: pattern-page-interaction
  - name: ShareSetupContext
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/presentation/interaction/ShareSetupContext.ets
    kind: class
    fields:
      - name: session
        type: AccountSession
        required: true
      - name: vehicleId
        type: string
        required: true
      - name: draftReadResult
        type: DraftReadResult
        required: true
      - name: draft
        type: ShareDraft
        required: true
      - name: quota
        type: QuotaView
        required: true
      - name: permission
        type: GrantPermissionView
        required: true
      - name: operateSequence
        type: string[]
        required: true
    pattern_roles:
      - pattern: page-interaction
        role: 上下文
        decision_id: pattern-page-interaction
  - name: ShareCreateRequest
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/KeySharing.ets
    kind: interface
    fields:
      - name: vehicleId
        type: string
        required: true
      - name: granteeId
        type: string
        required: true
      - name: permissionLevel
        type: string
        required: true
      - name: validUntil
        type: string
        required: true
      - name: idempotencyKey
        type: string
        required: true
interfaces:
  - module: WalletMain
    layer: data
    file: 02-Feature/WalletMain/src/main/ets/data/source/SimulatedIdentitySource.ets
    class: SimulatedIdentitySource
    methods:
      - name: currentSession
        params: []
        return: AccountSession | undefined
        description: 未登录返回空；accountKey跨重开稳定，sessionId每次会话变化
        async: false
      - name: listContacts
        params: []
        return: 'Promise<ShareContact[] | { kind: "unavailable" }>'
        description: 模拟联系人，缺granteeId不能查权限
        async: true
      - name: onSessionChanged
        params:
          - "listener: (session: AccountSession | undefined) => void"
        return: void
        description: 通知登录、主动退出、换号
        async: false
  - module: WalletMain
    layer: data
    file: 02-Feature/WalletMain/src/main/ets/data/source/KeySharingSource.ets
    class: KeySharingSource
    methods:
      - name: listOwnerKeys
        params:
          - "session: AccountSession"
        return: Promise<OwnerCarKey[]>
        description: 新增模拟本人钥匙来源
        async: true
      - name: listReceivedKeys
        params:
          - "session: AccountSession"
        return: Promise<ReceivedCarKey[]>
        description: 新增模拟接收方查询，非真实六接口
        async: true
      - name: recoverCreation
        params:
          - "session: AccountSession"
          - "vehicleId: string"
        return: Promise<CreationRecovery>
        description: 模拟云恢复，真实六接口无此能力
        async: true
      - name: queryKeySharingQuota
        params:
          - "vehicleId: string"
        return: "Promise<QuotaView & { shares: { shareId: string; status: ShareState }[]
          }>"
        description: 六接口：配额
        async: true
        must:
          - rule: COMPAT-01
            decision_id: knowledge-COMPAT-01
            text: 六API只新增客户端调用，不删字段、不改类型；reason/graceHours可空；模拟补充能力非真实接口。
            verify: review
      - name: queryGranteePermission
        params:
          - "vehicleId: string"
          - "granteeId: string"
        return: Promise<GrantPermissionView>
        description: 六接口：原样权限选项
        async: true
        must:
          - rule: COMPAT-01
            decision_id: knowledge-COMPAT-01
            text: 六API只新增客户端调用，不删字段、不改类型；reason/graceHours可空；模拟补充能力非真实接口。
            verify: review
      - name: createKeySharing
        params:
          - "request: ShareCreateRequest"
        return: 'Promise<{ shareId: string; status: "pending" }>'
        description: 六接口：同幂等标识同分享；签发失败不留关系；失败抛带车云码的错误，通信异常不同类
        async: true
        must:
          - rule: COMPAT-01
            decision_id: knowledge-COMPAT-01
            text: 六API只新增客户端调用，不删字段、不改类型；reason/graceHours可空；模拟补充能力非真实接口。
            verify: review
      - name: acceptKeySharing
        params:
          - "shareId: string"
        return: 'Promise<{ credentialStatus: "issued" | "failed"; status: "active" |
          "pending" }>'
        description: 六接口：failed+pending保持待接受；其他异常重取
        async: true
        must:
          - rule: COMPAT-01
            decision_id: knowledge-COMPAT-01
            text: 六API只新增客户端调用，不删字段、不改类型；reason/graceHours可空；模拟补充能力非真实接口。
            verify: review
      - name: revokeKeySharing
        params:
          - "shareId: string"
        return: 'Promise<{ status: "revoked" | "revoking"; graceHours?: number }>'
        description: 六接口：车辆立即拒绝；卡片最长48h收回
        async: true
        must:
          - rule: COMPAT-01
            decision_id: knowledge-COMPAT-01
            text: 六API只新增客户端调用，不删字段、不改类型；reason/graceHours可空；模拟补充能力非真实接口。
            verify: review
      - name: queryKeySharingList
        params:
          - "vehicleId: string"
        return: Promise<ShareItem[]>
        description: 六接口：管理列表，来源granteeMasked
        async: true
        must:
          - rule: COMPAT-01
            decision_id: knowledge-COMPAT-01
            text: 六API只新增客户端调用，不删字段、不改类型；reason/graceHours可空；模拟补充能力非真实接口。
            verify: review
  - module: WalletMain
    layer: data
    file: 02-Feature/WalletMain/src/main/ets/data/source/SimulatedKeySharingSource.ets
    class: SimulatedKeySharingSource
    methods:
      - name: listOwnerKeys
        params:
          - "session: AccountSession"
        return: Promise<OwnerCarKey[]>
        description: 新增模拟本人钥匙来源
        async: true
      - name: listReceivedKeys
        params:
          - "session: AccountSession"
        return: Promise<ReceivedCarKey[]>
        description: 新增模拟接收方查询，非真实六接口
        async: true
      - name: recoverCreation
        params:
          - "session: AccountSession"
          - "vehicleId: string"
        return: Promise<CreationRecovery>
        description: 模拟云恢复，真实六接口无此能力
        async: true
      - name: queryKeySharingQuota
        params:
          - "vehicleId: string"
        return: "Promise<QuotaView & { shares: { shareId: string; status: ShareState }[]
          }>"
        description: 六接口：配额
        async: true
      - name: queryGranteePermission
        params:
          - "vehicleId: string"
          - "granteeId: string"
        return: Promise<GrantPermissionView>
        description: 六接口：原样权限选项
        async: true
      - name: createKeySharing
        params:
          - "request: ShareCreateRequest"
        return: 'Promise<{ shareId: string; status: "pending" }>'
        description: 六接口：同幂等标识同分享；签发失败不留关系；失败抛带车云码的错误，通信异常不同类
        async: true
      - name: acceptKeySharing
        params:
          - "shareId: string"
        return: 'Promise<{ credentialStatus: "issued" | "failed"; status: "active" |
          "pending" }>'
        description: 六接口：failed+pending保持待接受；其他异常重取
        async: true
      - name: revokeKeySharing
        params:
          - "shareId: string"
        return: 'Promise<{ status: "revoked" | "revoking"; graceHours?: number }>'
        description: 六接口：车辆立即拒绝；卡片最长48h收回
        async: true
      - name: queryKeySharingList
        params:
          - "vehicleId: string"
        return: Promise<ShareItem[]>
        description: 六接口：管理列表，来源granteeMasked
        async: true
  - module: WalletMain
    layer: data
    file: 02-Feature/WalletMain/src/main/ets/data/repository/CarKeyRepository.ets
    class: CarKeyRepository
    methods:
      - name: listOwnerKeys
        params: []
        return: Promise<OwnerCarKey[]>
        description: 当前账号本人钥匙
        async: true
      - name: listReceivedKeys
        params:
          - "session: AccountSession"
        return: Promise<ReceivedCarKey[]>
        description: 卡包只列pending/active/revoking
        async: true
      - name: getReceivedKey
        params:
          - "shareId: string"
        return: 'Promise<{ kind: "found"; key: ReceivedCarKey } | { kind: "absent" } | {
          kind: "unavailable" }>'
        description: 不存在与查询失败分开；接受/详情重取六态
        async: true
      - name: getOwnerKey
        params:
          - "vehicleId: string"
        return: Promise<OwnerCarKey | undefined>
        description: 当前账号本人钥匙，不存在返回空
        async: true
  - module: WalletMain
    layer: data
    file: 02-Feature/WalletMain/src/main/ets/data/repository/KeySharingRepository.ets
    class: KeySharingRepository
    methods:
      - name: queryQuota
        params:
          - "vehicleId: string"
        return: Promise<QuotaView>
        description: 每次进页一次
        async: true
        must:
          - rule: DFX-01
            decision_id: knowledge-DFX-01
            text: 每次进页一次；无轮询、不持久缓存列表。
            verify: review
      - name: queryGranteePermission
        params:
          - "vehicleId: string"
          - "granteeId: string"
        return: Promise<GrantPermissionView>
        description: 换对象作废旧档位；请求用可识别身份
        async: true
        must:
          - rule: DFX-01
            decision_id: knowledge-DFX-01
            text: 换对象作废旧档位；请求用可识别身份；无轮询、不持久缓存列表。
            verify: review
          - rule: SEC-01
            decision_id: knowledge-SEC-01
            text: granteeId只向协议车云以可识别值传递；展示另生成打码值，短账号只昵称；观察出口排除身份。
            verify: both
      - name: recoverCreation
        params:
          - "session: AccountSession"
          - "vehicleId: string"
        return: Promise<CreationRecovery>
        description: 同账号车辆串行；absent/corrupted恢复；晚到响应核会话
        async: true
        must:
          - rule: ENV-02
            decision_id: knowledge-ENV-02
            text: 同账号同车辆串行，未知沿用原请求；核accountKey与sessionId，旧回调不重建草稿或更新新页面。
            verify: both
      - name: createSharing
        params:
          - "session: AccountSession"
          - "vehicleId: string"
          - "draft: ShareDraft"
        return: 'Promise<{ kind: "established"; shareId: string; status: ShareState } |
          { kind: "rejected"; code: string } | { kind: "unknown" } | { kind:
          "in_progress" }>'
        description: 原请求先保存后发送；未知只确认同一请求；不受本地满额拦截；每调用新attempt
        async: true
        must:
          - rule: ENV-02
            decision_id: knowledge-ENV-02
            text: 同账号同车辆串行，未知沿用原请求；核accountKey与sessionId，旧回调不重建草稿或更新新页面。
            verify: both
          - rule: SEC-01
            decision_id: knowledge-SEC-01
            text: granteeId只向协议车云以可识别值传递；展示另生成打码值，短账号只昵称；观察出口排除身份。
            verify: both
          - rule: OBS-02
            decision_id: knowledge-OBS-02
            text: 失败经既有Logger定位实际失败步骤；安全说明不拼message或原始错误。
            verify: both
      - name: acceptSharing
        params:
          - "shareId: string"
        return: 'Promise<{ credentialStatus: "issued" | "failed"; status: "active" |
          "pending" } | { kind: "rejected"; code: string } | { kind: "unknown"
          }>'
        description: 结果结算一次；其他错误/未知由页面重取
        async: true
        must:
          - rule: COMPAT-01
            decision_id: knowledge-COMPAT-01
            text: failed+pending仅表示凭据下发失败；其他失败/未知重取状态，不更改协议字段含义。
            verify: review
          - rule: OBS-02
            decision_id: knowledge-OBS-02
            text: 失败经既有Logger定位实际失败步骤；安全说明不拼message或原始错误。
            verify: both
      - name: revokeSharing
        params:
          - "shareId: string"
        return: 'Promise<{ status: "revoked" | "revoking"; graceHours?: number } | {
          kind: "rejected"; code: string } | { kind: "unknown" }>'
        description: 只调用active；失败重拉而非恢复旧状态
        async: true
        must:
          - rule: OBS-02
            decision_id: knowledge-OBS-02
            text: 失败经既有Logger定位实际失败步骤；安全说明不拼message或原始错误。
            verify: both
      - name: listSharings
        params:
          - "vehicleId: string"
        return: Promise<ShareItem[]>
        description: 每次进页拉取，不落盘
        async: true
        must:
          - rule: DFX-01
            decision_id: knowledge-DFX-01
            text: 每次进页拉取，不落盘；无轮询、不持久缓存列表。
            verify: review
      - name: settleCreate
        params:
          - "attemptId: string"
          - "result: string"
          - "safeDescription: string"
          - "externalCode?: string"
        return: void
        description: 同一attempt仅一次Chart结算，旧会话不更新页面草稿
        async: false
        must:
          - rule: OBS-03
            decision_id: knowledge-OBS-03
            text: 一个attempt仅一次Chart结算，重复回调不再报；重试是新attempt，重取查询不计流程。
            verify: both
          - rule: OBS-05
            decision_id: knowledge-OBS-05
            text: 车型类别来自modelCategory缺失未知；外码只取并校验云失败码，说明来自安全映射；无账号/车牌/位置。
            verify: both
          - rule: OBS-06
            decision_id: knowledge-OBS-06
            text: 使用KeySharingChartCodes核对过冲突的三流程编码；候选号登记前不能当已定编号。
            verify: both
      - name: settleAccept
        params:
          - "attemptId: string"
          - "result: string"
          - "safeDescription: string"
          - "externalCode?: string"
        return: void
        description: 同一attempt仅一次Chart结算，旧会话不更新页面草稿
        async: false
        must:
          - rule: OBS-03
            decision_id: knowledge-OBS-03
            text: 一个attempt仅一次Chart结算，重复回调不再报；重试是新attempt，重取查询不计流程。
            verify: both
          - rule: OBS-05
            decision_id: knowledge-OBS-05
            text: 车型类别来自modelCategory缺失未知；外码只取并校验云失败码，说明来自安全映射；无账号/车牌/位置。
            verify: both
          - rule: OBS-06
            decision_id: knowledge-OBS-06
            text: 使用KeySharingChartCodes核对过冲突的三流程编码；候选号登记前不能当已定编号。
            verify: both
      - name: settleRevoke
        params:
          - "attemptId: string"
          - "result: string"
          - "safeDescription: string"
          - "externalCode?: string"
        return: void
        description: 同一attempt仅一次Chart结算，旧会话不更新页面草稿
        async: false
        must:
          - rule: OBS-03
            decision_id: knowledge-OBS-03
            text: 一个attempt仅一次Chart结算，重复回调不再报；重试是新attempt，重取查询不计流程。
            verify: both
          - rule: OBS-05
            decision_id: knowledge-OBS-05
            text: 车型类别来自modelCategory缺失未知；外码只取并校验云失败码，说明来自安全映射；无账号/车牌/位置。
            verify: both
          - rule: OBS-06
            decision_id: knowledge-OBS-06
            text: 使用KeySharingChartCodes核对过冲突的三流程编码；候选号登记前不能当已定编号。
            verify: both
  - module: WalletMain
    layer: data
    file: 02-Feature/WalletMain/src/main/ets/data/repository/ShareDraftStore.ets
    class: ShareDraftStore
    methods:
      - name: read
        params:
          - "session: AccountSession"
          - "vehicleId: string"
        return: Promise<DraftReadResult>
        description: 四种读取结果，不把损坏/不可访问当absent
        async: true
        must:
          - rule: SEC-01
            decision_id: knowledge-SEC-01
            text: 只读写当前账号车辆的单个Asset SECRET；索引只留加盐摘要/初始化/待清理标记；不落明文副本。
            verify: both
          - rule: ENV-01
            decision_id: knowledge-ENV-01
            text: 四种读取结果，不把损坏/不可访问当absent
            verify: both
      - name: saveSelection
        params:
          - "session: AccountSession"
          - "vehicleId: string"
          - "draft: ShareDraft"
        return: Promise<boolean>
        description: 选择完成写，原请求未确认拒绝修改
        async: true
        must:
          - rule: SEC-01
