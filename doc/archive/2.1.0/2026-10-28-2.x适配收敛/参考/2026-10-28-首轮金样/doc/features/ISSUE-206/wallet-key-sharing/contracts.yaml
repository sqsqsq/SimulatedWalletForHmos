state_management:
  - name: creation-and-draft
    owner: KeySharingRepository
    storage: Asset SECRET per accountKey+vehicleId; preferences
      salt/initialized/pendingCleanup digests only
    lifecycle: 选择完成保存；发出前完整原请求；成功清本车；拒绝清请求；主动退出/换号清本账号；冷启动未登录不清
    ordered_steps:
      - 读取当前会话及草稿
      - absent/corrupted向模拟云recoverCreation
      - pending安全保存原请求后只确认；established展示原分享；clear安全清理后开放；unknown受限
      - 同账号车辆串行保存完整request/idempotencyKey
      - 保存成功才创建或确认
      - 按结果结算attempt，核会话后更新页面与清理
    recovery: unavailable不当absent；创建超时冻结请求；清理失败保持待清理；旧会话回调不重建草稿
  - name: sharing-lists
    owner: CarKeyRepository
    storage: page memory only
    lifecycle: 每次进页/回卡包按当前账号重取，换号清旧页面
    recovery: 断网不展示陈旧列表；接受/撤销未知先重取，不存在与不可查询分开
