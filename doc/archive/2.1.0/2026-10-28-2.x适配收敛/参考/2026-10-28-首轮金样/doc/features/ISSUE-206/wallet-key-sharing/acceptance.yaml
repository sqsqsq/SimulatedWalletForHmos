    ut_focus: 核状态与数据边界：不提供撤销，不发撤销请求
    device_focus: 核对应入口、反馈与受限动作：只看到状态；已作废、已到期的可重新发起
  - id: BD-9a
    prd_exception: E9a
    scenario: 待接受条目撤回
    description: 条目为待接受
    handling: 能否撤回待 D8；裁定前只展示状态，不发撤销请求
    expected_behavior: 能否撤回待 D8；裁定前只展示状态，不发撤销请求；用户看到：只看到待接受
    ut_layer: both
    ut_focus: 核状态与数据边界：能否撤回待 D8；裁定前只展示状态，不发撤销请求
    device_focus: 核对应入口、反馈与受限动作：只看到待接受
  - id: BD-10
    prd_exception: E10
    scenario: 撤销失败或结果未知
    description: 车云返回失败，或撤销请求没得到回应
    handling: 重新拉分享列表，按车云返回的状态显示；仍是生效才再提供撤销；已到期、已撤销的不因这次失败恢复成生效；列表拉不到给网络失败态
    expected_behavior: 重新拉分享列表，按车云返回的状态显示；仍是生效才再提供撤销；已到期、已撤销的不因这次失败恢复成生效；列表拉不到给网络失败态；用户看到：按刷新后的状态显示
    ut_layer: both
    ut_focus: 核状态与数据边界：重新拉分享列表，按车云返回的状态显示；仍是生效才再提供撤销；已到期、已撤销的不因这次失败恢复成生效；列表拉不到给网络失败态
    device_focus: 核对应入口、反馈与受限动作：按刷新后的状态显示
  - id: BD-11
    prd_exception: E11
    scenario: 发起被打断
    description: 退出页面、断网或应用关闭
    handling: 草稿保留；没发出过或上次明确拒绝的，回来时配额已满按满额处理；上次发出结果未知的按 E11a 先确认
    expected_behavior: 草稿保留；没发出过或上次明确拒绝的，回来时配额已满按满额处理；上次发出结果未知的按 E11a 先确认；用户看到：回来接着办
    ut_layer: both
    ut_focus: 核状态与数据边界：草稿保留；没发出过或上次明确拒绝的，回来时配额已满按满额处理；上次发出结果未知的按 E11a 先确认
    device_focus: 核对应入口、反馈与受限动作：回来接着办
  - id: BD-11a
    prd_exception: E11a
    scenario: 创建结果未知
    description: 发出后超时、断网或应用被关，没得到回应
    handling: 草稿留着原请求与幂等标识，对象、权限、有效期冻结；回来或再点时用同一请求确认，不受端侧满额前置拦截
    expected_behavior: 草稿留着原请求与幂等标识，对象、权限、有效期冻结；回来或再点时用同一请求确认，不受端侧满额前置拦截；用户看到：结果待确认；确认到已建立就清草稿，车云明确拒绝就同时持久清掉原请求与幂等标识，成功后恢复可编辑并显示原因
    ut_layer: both
    ut_focus: 核状态与数据边界：草稿留着原请求与幂等标识，对象、权限、有效期冻结；回来或再点时用同一请求确认，不受端侧满额前置拦截
    device_focus: 核对应入口、反馈与受限动作：结果待确认；确认到已建立就清草稿，车云明确拒绝就同时持久清掉原请求与幂等标识，成功后恢复可编辑并显示原因
  - id: BD-12
    prd_exception: E12
    scenario: 断网进管理页或卡包
    description: 无网络
    handling: 不展示陈旧列表
    expected_behavior: 不展示陈旧列表；用户看到：网络失败态，可重试
    ut_layer: both
    ut_focus: 核状态与数据边界：不展示陈旧列表
    device_focus: 核对应入口、反馈与受限动作：网络失败态，可重试
  - id: BD-13
    prd_exception: E13
    scenario: 退出登录或切换账号
    description: 主动退出或账号变化
    handling: 先持久记下旧账号不可恢复，隔离旧页面与在途请求，再删除旧账号全部车辆的草稿；列表与收到的分享按新账号获取；同一账号再登录后，每辆车第一次进设置页先做创建恢复
    expected_behavior: 先持久记下旧账号不可恢复，隔离旧页面与在途请求，再删除旧账号全部车辆的草稿；列表与收到的分享按新账号获取；同一账号再登录后，每辆车第一次进设置页先做创建恢复；用户看到：不带出上一个账号的草稿、列表或钥匙
    ut_layer: both
    ut_focus: 核状态与数据边界：先持久记下旧账号不可恢复，隔离旧页面与在途请求，再删除旧账号全部车辆的草稿；列表与收到的分享按新账号获取；同一账号再登录后，每辆车第一次进设置页先做创建恢复
    device_focus: 核对应入口、反馈与受限动作：不带出上一个账号的草稿、列表或钥匙
  - id: BD-13a
    prd_exception: E13a
    scenario: 换一辆车进设置页
    description: 同一账号从另一辆车进入
    handling: 只读这辆车的草稿，另一辆车的草稿原样保留、不回填
    expected_behavior: 只读这辆车的草稿，另一辆车的草稿原样保留、不回填；用户看到：这辆车没有草稿先做创建恢复，clear后才从头选
    ut_layer: both
    ut_focus: 核状态与数据边界：只读这辆车的草稿，另一辆车的草稿原样保留、不回填
    device_focus: 核对应入口、反馈与受限动作：这辆车没有草稿先做创建恢复，clear后才从头选
  - id: BD-13b
    prd_exception: E13b
    scenario: 退出时清理失败
    description: 删除旧账号草稿失败，或不可恢复标记写不进去
    handling: 照样退出旧会话，禁止恢复与发起分享，保留可重试的清理错误；标记都写不进去时先重试清理，不开放下一个分享会话
    expected_behavior: 照样退出旧会话，禁止恢复与发起分享，保留可重试的清理错误；标记都写不进去时先重试清理，不开放下一个分享会话；用户看到：分享暂不可用，正在清理上一个账号的数据
    ut_layer: both
    ut_focus: 核状态与数据边界：照样退出旧会话，禁止恢复与发起分享，保留可重试的清理错误；标记都写不进去时先重试清理，不开放下一个分享会话
    device_focus: 核对应入口、反馈与受限动作：分享暂不可用，正在清理上一个账号的数据
  - id: BD-13c
    prd_exception: E13c
    scenario: 晚到的回调
    description: 退出或换账号后，旧账号的请求才返回
    handling: 回调只更新发起时的账号与会话；不写新账号的页面，不重建已清除的草稿
    expected_behavior: 回调只更新发起时的账号与会话；不写新账号的页面，不重建已清除的草稿；用户看到：无
    ut_layer: both
    ut_focus: 核状态与数据边界：回调只更新发起时的账号与会话；不写新账号的页面，不重建已清除的草稿
    device_focus: 核对应入口、反馈与受限动作：无
  - id: BD-14
    prd_exception: E14
    scenario: 清除应用数据
    description: 本地数据被清除
    handling: 初始化标记缺失时先按功能标签清理遗留草稿，成功后重建索引再开放；之后每辆车第一次进设置页先做创建恢复，不把清空当作没有旧请求；不崩溃
    expected_behavior: 初始化标记缺失时先按功能标签清理遗留草稿，成功后重建索引再开放；之后每辆车第一次进设置页先做创建恢复，不把清空当作没有旧请求；不崩溃；用户看到：回到未选状态；清理失败时提示初始化失败
    ut_layer: both
    ut_focus: 核状态与数据边界：初始化标记缺失时先按功能标签清理遗留草稿，成功后重建索引再开放；之后每辆车第一次进设置页先做创建恢复，不把清空当作没有旧请求；不崩溃
    device_focus: 核对应入口、反馈与受限动作：回到未选状态；清理失败时提示初始化失败
  - id: BD-15
    prd_exception: E15
    scenario: 打开已不可用的钥匙
    description: 从旧入口打开已撤销、已到期或已作废的钥匙详情；或换账号后打开不属于当前账号的本人钥匙
    handling: 按当前状态处理
    expected_behavior: 按当前状态处理；用户看到：提示这把钥匙已不可用，回到卡包
    ut_layer: both
    ut_focus: 核状态与数据边界：按当前状态处理
    device_focus: 核对应入口、反馈与受限动作：提示这把钥匙已不可用，回到卡包
  - id: BD-16
    prd_exception: E16
    scenario: 推送未达
    description: 推送没送到被分享人
    handling: 不改变分享关系；对方进入卡包时按当前账号补拉
    expected_behavior: 不改变分享关系；对方进入卡包时按当前账号补拉；用户看到：卡包里看到待添加的钥匙
    ut_layer: both
    ut_focus: 核状态与数据边界：不改变分享关系；对方进入卡包时按当前账号补拉
    device_focus: 核对应入口、反馈与受限动作：卡包里看到待添加的钥匙
  - id: BD-17
    prd_exception: E17
    scenario: 草稿保存失败
    description: Asset 写入失败、不可访问，或草稿序列化后超过 1024 字节（本工程设定，无上游依据：按 Asset SECRET 上限设的 Case 前提）
    handling: 不截断、不分片、不改存明文；发出前那次写入失败时不发送
    expected_behavior: 不截断、不分片、不改存明文；发出前那次写入失败时不发送；用户看到：草稿没保存成功，请重试
    ut_layer: both
    ut_focus: 核状态与数据边界：不截断、不分片、不改存明文；发出前那次写入失败时不发送
    device_focus: 核对应入口、反馈与受限动作：草稿没保存成功，请重试
  - id: BD-18
    prd_exception: E18
    scenario: 草稿读取失败
    description: Asset 不可访问或服务失败
    handling: 不当成没有草稿，不自动换标识重发
    expected_behavior: 不当成没有草稿，不自动换标识重发；用户看到：草稿暂时读不出，可重试
    ut_layer: both
    ut_focus: 核状态与数据边界：不当成没有草稿，不自动换标识重发
    device_focus: 核对应入口、反馈与受限动作：草稿暂时读不出，可重试
  - id: BD-19
    prd_exception: E19
    scenario: 草稿损坏
    description: 内容无法解析，或绑定的账号车辆与当前不一致
    handling: 原请求与幂等标识可能已丢，管理列表和人工删除都证明不了原请求没有执行或不会晚到；损坏原件隔离，先做创建恢复（§5.3）：pending
      找回原请求只确认同一请求，established 显示原分享，clear 清掉损坏草稿后开放新建，unknown
      或查询失败这辆车在当前账号下保持受限、管理页照常可看；不提供删除后重建，退出登录、换号或清数据后再登录仍按创建恢复处理
    expected_behavior: 原请求与幂等标识可能已丢，管理列表和人工删除都证明不了原请求没有执行或不会晚到；损坏原件隔离，先做创建恢复（§5.3）：pending
      找回原请求只确认同一请求，established 显示原分享，clear 清掉损坏草稿后开放新建，unknown
      或查询失败这辆车在当前账号下保持受限、管理页照常可看；不提供删除后重建，退出登录、换号或清数据后再登录仍按创建恢复处理；用户看到：这份草稿无法读取，正在确认上次发出
      / 这辆车暂时不能新发起
    ut_layer: both
    ut_focus: 核状态与数据边界：原请求与幂等标识可能已丢，管理列表和人工删除都证明不了原请求没有执行或不会晚到；损坏原件隔离，先做创建恢复（§5.3）：pending
      找回原请求只确认同一请求，established 显示原分享，clear 清掉损坏草稿后开放新建，unknown
      或查询失败这辆车在当前账号下保持受限、管理页照常可看；不提供删除后重建，退出登录、换号或清数据后再登录仍按创建恢复处理
    device_focus: 核对应入口、反馈与受限动作：这份草稿无法读取，正在确认上次发出 / 这辆车暂时不能新发起
  - id: BD-20
    prd_exception: E20
    scenario: 建立成功后清理失败
    description: 删除草稿失败
    handling: 显示分享已建立并标记待清理；不把旧草稿当新请求；下次只能确认同一请求或重试清理
    expected_behavior: 显示分享已建立并标记待清理；不把旧草稿当新请求；下次只能确认同一请求或重试清理；用户看到：分享已发出，草稿待清理
    ut_layer: both
    ut_focus: 核状态与数据边界：显示分享已建立并标记待清理；不把旧草稿当新请求；下次只能确认同一请求或重试清理
    device_focus: 核对应入口、反馈与受限动作：分享已发出，草稿待清理
  - id: BD-21
    prd_exception: E21
    scenario: 创建恢复确认不了
    description: 本地没有草稿或草稿损坏，创建恢复查询失败、数据不完整、对应不上当前账号车辆，或多条可能相关
    handling: 按 unknown：这辆车不开放新建，管理页只读、可重查；不按管理列表为空推断没有旧请求
    expected_behavior: 按 unknown：这辆车不开放新建，管理页只读、可重查；不按管理列表为空推断没有旧请求；用户看到：暂时无法确认上次的分享，请稍后重试
    ut_layer: both
    ut_focus: 核状态与数据边界：按 unknown：这辆车不开放新建，管理页只读、可重查；不按管理列表为空推断没有旧请求
    device_focus: 核对应入口、反馈与受限动作：暂时无法确认上次的分享，请稍后重试
  - id: BD-22
    prd_exception: E22
    scenario: 确认之后旧请求晚到
    description: 创建恢复已返回 clear，旧请求之后才到达车云
    handling: 车云已终结或作废这次尝试，晚到也不建立新分享；管理列表只有车主之后新建的那条
    expected_behavior: 车云已终结或作废这次尝试，晚到也不建立新分享；管理列表只有车主之后新建的那条；用户看到：无
    ut_layer: both
    ut_focus: 核状态与数据边界：车云已终结或作废这次尝试，晚到也不建立新分享；管理列表只有车主之后新建的那条
    device_focus: 核对应入口、反馈与受限动作：无
