    ut_layer: both
    ut_focus: 核状态与数据边界：不呈现档位
    device_focus: 核对应入口、反馈与受限动作：显示原因，请车主换一个人
  - id: BD-3
    prd_exception: E3
    scenario: 换对象后旧档位不可用
    description: 新对象不支持已选档位
    handling: 作废旧档位，不静默降级
    expected_behavior: 作废旧档位，不静默降级；用户看到：请车主重选
    ut_layer: both
    ut_focus: 核状态与数据边界：作废旧档位，不静默降级
    device_focus: 核对应入口、反馈与受限动作：请车主重选
  - id: BD-3a
    prd_exception: E3a
    scenario: 档位无法解释
    description: "`permissionLevels` 为空或返回的选项无法作为可读权限显示"
    handling: 不猜更大权限，不沿用上一对象的选项
    expected_behavior: 不猜更大权限，不沿用上一对象的选项；用户看到：提示重新获取可用权限
    ut_layer: both
    ut_focus: 核状态与数据边界：不猜更大权限，不沿用上一对象的选项
    device_focus: 核对应入口、反馈与受限动作：提示重新获取可用权限
  - id: BD-3b
    prd_exception: E3b
    scenario: 联系人选择不成
    description: 取消选择、模拟联系人不可用，或选中的联系人没有有效账号
    handling: 保留当前对象，不发权限查询
    expected_behavior: 保留当前对象，不发权限查询；用户看到：说明原因，可改为手输账号
    ut_layer: both
    ut_focus: 核状态与数据边界：保留当前对象，不发权限查询
    device_focus: 核对应入口、反馈与受限动作：说明原因，可改为手输账号
