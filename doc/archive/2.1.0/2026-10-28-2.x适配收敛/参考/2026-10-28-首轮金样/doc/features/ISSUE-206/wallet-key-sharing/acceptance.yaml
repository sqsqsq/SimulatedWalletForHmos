    ut_layer: both
    ut_focus: 核状态与数据边界：不发新建请求
    device_focus: 核对应入口、反馈与受限动作：发出置灰，显示配额接口给的原因
  - id: BD-2
    prd_exception: E2
    scenario: 对象不可分享
    description: 对方没开通车钥匙等
