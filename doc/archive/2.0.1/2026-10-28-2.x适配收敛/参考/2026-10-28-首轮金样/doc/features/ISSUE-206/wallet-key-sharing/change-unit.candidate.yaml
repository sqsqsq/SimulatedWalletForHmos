safe_intermediate_state:
  description: 仅候选设计交接：未接受、未编码，模拟恢复/真实外部依赖和未决保持公开；不改变工程功能或开放真实服务。
  build_validation_refs: []
  compatibility_refs:
    - plan/plan.md
  recovery_refs:
    - spec/spec.md
    - ../source-inputs.md
blockers:
  - blocker_id: native-questioning-and-acceptance
    gate: design
    owner: component-design
    reason: 本候选尚无独立质询、原生准入及CU接受；真实hash只标识当前候选字节。
    unlock_condition: 按获准范围完成当前蓝图及CU的真实原生设计审查与接受，不以维护候选代签。
    observation: machine
    source_refs:
      - ../blueprint/component-blueprint.yaml
  - blocker_id: native-single-demand-root
    gate: execution
    owner: Framework-and-Extension-adaptation
    reason: 当前候选按2.1.0单需求目录目标展示，未证明当前原生resolver已支持CU目录与统一需求根。
    unlock_condition: 当前原生入口能解析相同需求根和该CU身份，仍止于获准Plan终点。
    observation: machine
    source_refs:
      - ../blueprint/component-blueprint.yaml
