preserved_invariants:
  - invariant_id: scope-and-open-decisions
    description: 不拆需求；D2/D5/D8保持未决；真实六API无恢复能力，不把模拟来源写成真实联调。
    evidence_refs:
      - ../source-inputs.md
      - ../AR/review.md
  - invariant_id: cloud-and-device-responsibility
    description: 车云受理撤销即拒绝车辆使用，设备卡片最长48小时收回，失败/未知不当已受理。
    evidence_refs:
      - spec/spec.md#AC-5
      - ../source-inputs.md
target_predicates:
  - predicate_id: accept-AC-1
    role: behavior
    description: 卡包车钥匙卡片点分享，对象、权限、有效期三项都选齐前不能发出；选齐后发出，对方收到待接受的钥匙（承接：AC-K1）。
    provide_ids:
      - F2
      - F3
    verification_refs:
      - acceptance:AC-1
  - predicate_id: accept-AC-2
    role: behavior
    description: 对方接受后钥匙可用，权限与车主所选一致，钥匙作为车钥匙卡片出现在对方卡包（承接：AC-K2）。
    provide_ids:
      - F6
      - F7
    verification_refs:
      - acceptance:AC-2
  - predicate_id: accept-AC-4
    role: behavior
    description: 生效加待接受合计到上限后不能再发起，能看到原因（承接：AC-K4）。
    provide_ids:
      - F3
      - F5
    verification_refs:
      - acceptance:AC-4
  - predicate_id: accept-AC-5
    role: behavior
    description: 撤销时对方在线立即失效；对方离线进入撤销中，对方设备上的卡片在宽限内收回（D1）；车云受理撤销起车辆侧就不认这把钥匙（承接：AC-K5）。
    provide_ids:
      - F5
    verification_refs:
      - acceptance:AC-5
  - predicate_id: accept-AC-6
    role: recovery
    description: 发起途中退出页面、断网或关掉应用再打开，同一账号同一辆车回来接着上次的选择发出，沿用同一幂等标识，不发出第二条（承接：AC-K6，D6）。
    provide_ids:
      - F4
    verification_refs:
      - acceptance:AC-6
  - predicate_id: accept-AC-7
    role: behavior
    description: 管理列表的状态与车云返回一致：待接受、生效、已作废、已到期、撤销中、已撤销（承接：AC-K7）。
    provide_ids:
      - F5
    verification_refs:
      - acceptance:AC-7
  - predicate_id: accept-AC-9
    role: behavior
    description: 未登录或没有车钥匙的用户看不到分享入口（承接：AC-K9）。
    provide_ids:
      - F2
    verification_refs:
      - acceptance:AC-9
  - predicate_id: accept-AC-10
    role: behavior
    description: 开关关闭后不能发起新分享，已生效的分享不受影响（承接：AC-K10）。
    provide_ids:
      - F2
    verification_refs:
      - acceptance:AC-10
  - predicate_id: accept-AC-11
    role: behavior
    description: 选家庭成员时全功能可选；换成其他联系人后全功能不可选，已选的全功能请车主重选；换回家庭成员又可选（承接：AC-K11）。
    provide_ids:
      - F3
    verification_refs:
      - acceptance:AC-11
  - predicate_id: accept-AC-12
    role: behavior
    description: 卡包展示车主本人的车钥匙卡片，卡片上有分享与分享管理入口（D4）。
    provide_ids:
      - F1
    verification_refs:
      - acceptance:AC-12
  - predicate_id: accept-AC-13
    role: recovery
    description: 发出成功、主动退出或切换账号后草稿被清除，换账号后看不到上一个账号的草稿或列表；退出时清除失败，旧会话照样退出，分享在清理完成前不可用（D6）。
    provide_ids:
      - F4
      - F8
    verification_refs:
      - acceptance:AC-13
  - predicate_id: accept-AC-14
    role: behavior
    description: 两个打码后相同的合法账号，查权限与创建分享时各自拿到正确的对象；两个展示账号相同的模拟账号，草稿互不可见。
    provide_ids:
      - F8
    verification_refs:
      - acceptance:AC-14
  - predicate_id: accept-AC-15
    role: behavior
    description: 推送没送到时，对方进入卡包能看到待添加的钥匙，点它进入接受页并能添加。
    provide_ids:
      - F9
    verification_refs:
      - acceptance:AC-15
  - predicate_id: accept-AC-16
    role: behavior
    description: 接受成功后，卡包里的待添加项变为可用的钥匙卡片；凭据下发失败时仍保持待接受。
    provide_ids:
      - F9
    verification_refs:
      - acceptance:AC-16
  - predicate_id: accept-AC-17
    role: behavior
    description: 车主撤销且对方离线时，被分享人卡包里的卡片保留到收回完成后移除；车辆侧从车云受理撤销起已拒绝这把钥匙。
    provide_ids:
      - F9
    verification_refs:
      - acceptance:AC-17
  - predicate_id: accept-AC-18
    role: behavior
    description: 撤销完成、到期或作废的钥匙从卡包移除；从旧入口打开它的详情时提示已不可用并回到卡包。
    provide_ids:
      - F7
      - F9
    verification_refs:
      - acceptance:AC-18
  - predicate_id: accept-AC-19
    role: behavior
    description: 切换账号后，卡包只显示新账号收到的待添加与可用钥匙。
    provide_ids:
      - F8
      - F9
    verification_refs:
      - acceptance:AC-19
  - predicate_id: accept-AC-20
    role: behavior
