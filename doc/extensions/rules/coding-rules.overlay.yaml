# 实例扩展 coding 阶段规则 overlay（知识账本消费）
# 经 manifest provides.phase_rules_overlays.coding 注册；semantic_checks 由 AI verifier 消费（零脚本改动）。
#
# 本文件只问「契约实体上的义务，代码里落实了没有」——不复述域名、编号与维度。
# 本阶段读的是 plan 挂在实体上的 must，不是知识目录：规约内容改了，这里一个字都不用动。
phase: coding
version: "1.1"
semantic_checks:
  knowledge_landing_in_code:
    description: >
      挂在实体上的每条 must 与每个模式角色，在本次代码里是不是**真的承担了那件事**。
      机械门禁已经查过落点实体在不在（类/字段/枚举存在）；这里判的是它有没有真的起作用：
      字段被赋值了吗？方法里做的是这条义务要求的事吗？角色的职责是不是落在它身上？
      「实体存在但是个空壳」——字段声明了从不赋值、方法建了但只有一句 return——
      在机械层看是通过的，那正是本判据要抓的。
      逐条给结论，判据是代码本身，不是文档里再声明一遍。
    severity: MAJOR
    ai_prompt_hint: >
      读 contracts.yaml 各实体上的 must 与本次变更的源码。对每条义务：打开挂着它的那个实体
      所在的文件与符号，看那段代码做的事是不是这条义务说的事。对每个采用的模式：看角色是否各就各位。
      只在注释或文档里写「已按要求处理」而代码里看不出的，判 FAIL。
      **每条裁决附引文**：从你打开的那个源码文件里抄一段连续 12 字以上的原文（能检索到的），
      写清文件与符号。引文为空、或只是把 contracts 的字段值复制一遍的，该条按**未裁**处理——
      复制契约字段证明不了你读过代码。
