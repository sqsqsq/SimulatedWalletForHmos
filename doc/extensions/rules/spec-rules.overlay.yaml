# 实例扩展 spec 阶段规则 overlay（story / constraints）
# 经 manifest provides.phase_rules_overlays.spec 注册；semantic_checks 由 AI verifier 消费（零脚本改动）。
phase: spec
version: "1.1"
semantic_checks:
  knowledge_spec_exit_substance:
    description: >
      spec 要能交给 plan 去设计：业务关系走得通，规约的适用判断落在真实的设计上。先沿材料里的业务流程走一遍
      业务章与承载专项的那一章（实际会发生的正常、异常与未执行路径各到哪、结果由谁得到），再看 `spec/knowledge-use.yaml`
      （§9.2/§9.3 是它的投影）里的判断与这份设计是否一致。
      命中的条目：requirement 说清落在哪个接口、存储键、字段或业务步骤上，并且承载章里真有对应的设计；
      只把规约要求换句话说一遍、或只列名目看不出方案的，FAIL。原文（含落法附注）要求讲清的专项写在承载它的那一章，
      按 applies_when 找回答这一专项的知识，上下篇的按读者含 spec 的那一篇核；
      沿流程列出的步骤与实际业务结果算得出这一章的结论（算不出就是漏了步骤或结果）；结果写的是业务结果，实现层的取值留给 plan；
      统计点表的列与每行写法按那一篇核；每个结果本端何时、凭什么得知可以指认，远端拿不到的写明了由谁统计或待决。
      关键结论有源材料或已定决定支持：`AR/story-src/decisions.json` 里仍 open 的选择，没有被写成无条件的行为或验收——
      按选项的实际后果对照功能、流程、异常与验收判，不按正文里有没有「待定」二字判。
      项目知识里的参考例子只示范方法，不以例子的名称、数值、点数或行数当答案。
      项目明确的范围与限制被遵守。
      不命中的条目给得出回查到命中条件的事实——「不涉及」不是依据，项目事实说「仓里没有现成实现」只说明复用结果；
      豁免写清理由、影响与补偿。通用措辞也可以准确，专门措辞也可能错，按内容判。
      登记齐不齐、编号在不在册、投影跟不跟得上，机械层已经核过。有一条走不通、只是转述或依据站不住，即 FAIL。
      必须设计项缺值、未决写成已定、验收不可判定，让下游必须重新决定，按阻断判。
    severity: BLOCKER
    ai_prompt_hint: >
      先按业务流程读 spec 的业务章与承载章，记下走不通的地方；再打开 `spec/knowledge-use.yaml`：
      命中的那几条，requirement 落在哪个具体名字上、承载章里有没有对应的设计；不命中的那几条，reason 说的事实是不是
      属于命中条件——拿处置结果（「调用频次低」「影响小」）否定命中的，点名。
      **不要逐条对账、不要出裁决表、不要为每条结论找一段够长的引文**——那样抄的量随条数涨，判断不增加。
      details 写判出问题的那几条：哪一条、问题是什么、依据是产物或材料里的什么事实；判不出问题就写清看了哪几条。
  knowledge_candidates_registered:
    description: >
      设计模式候选只登记不选型：逐个适用单元给出候选与命中信号或反证。
      候选须是在册标识；零候选是正常结论，但须显式登记单元与「为什么都不需要」。
      判断的真源是 `spec/knowledge-use.yaml` 的 `patterns` 段。
      判据是**单元切分是否合理、信号是否指向真实的业务特征**——
      单元切得太粗（整个需求算一个单元）或信号是空话（「交互较多」），即 FAIL。
      **反证与材料是否对得上**同样在判：反证里每个可核对的业务断言，逐条拿材料核；
      材料明写存在的东西而反证说没有，即点名。复述模式索引判定措辞的反证，
      按未举证处理——那种句子换个需求照样成立，证明不了判断发生过。
      本阶段**不判**该不该采用——那是 plan 的事，此处判的是候选识别做没做。
    severity: MAJOR
    ai_prompt_hint: >
      读 `spec/knowledge-use.yaml` 的 `patterns` 段：适用单元的粒度是否符合激活清单里
      那份模式索引给的定义？signal 有没有指向本需求里真实存在的分支、步骤或交互？
      写「无候选」的那几条有没有给出理由？
      **反证逐条拿材料核**：某一条说这段流程没有多分支、说这个页面的交互互不依赖——
      去材料里看它说的是不是这么回事。材料里明写着的东西而反证说没有，点名它。
      复述模式索引判定措辞的反证，按未举证处理——那种句子换个需求照样成立。
      details 写你判出问题的那几条与依据；不出裁决表、不为每条找引文。
  spec_ext_conclusion_validity:
    description: >
      spec §9.1 技术契约与 story 附录「技术约定」的结论须真实、具体、可按名回查：结论中写全了它谈论的东西的名字
      （接口名/存储键/事件名/配置项名/模块名/错误码），且该名字在 spec、SR 或代码中确实存在、
      语义一致；「不涉及」条目附有判断依据（现状扫描或 Scope 声明）；无凭空推断。
      **spec 不写文档坐标**（见 evidence-rules「不写的东西」）——核对靠按名回查，不靠产物给出处。
      **未走 /story 的 feature（无 AR/story-src/story-flow.json）本检查 SKIP**——§9.1 技术契约与 story
      附录都是扩展新增的落点，那种场景下两者都不存在。
      spec 写的工程现状结论与仓里对不上，下游会照错的现状设计，按阻断判。
    severity: BLOCKER
    ai_prompt_hint: >
      抽查 spec §9.1 技术契约与 story 附录「技术约定」中至少 3 条事实（优先抽「新增/修改」类结论）：取出结论里的具体名字
      （接口名、存储键、配置项名这类），到
      doc/features/{module}/spec/spec.md、SR/design.md、RR/prd.md 与 in_scope 模块源码中检索该名字，
      判断结论是否被支撑。**特别核查数值，且两个产物判据不同**（形态真源见
      skills/story/reference/evidence-rules.md 的证据表）：
      spec 侧——阈值/时长类数字须在正文三选一标来源（机械门只核标没标）；
      标「上游约束」的，回查 SR/RR 原文所指业务量是不是这一个：数字加单位在原文
      字面命中不证明是同一个量，未字面命中也不等于没有真实来源——单位换算
      有真实依据才成立，同数字不同含义即 FAIL；
      标「本工程设定」的检查是否确实上游无据、取舍有无依据。
      story 侧——正文数值不带来源括注，来源由 spec 承担；可议的值登记决策件后由正文引用。
      所以 story 正文出现「（本工程设定，无上游依据）」这类括注反而是错的，别按 spec 的写法要求 story。
      结论只写「新增了一个开关」这类无名字的空话，同样 FAIL——无从核对。
      证据为「检索式零命中」类时，判断该检索式是否合理覆盖了该维度。
      对象是**抽查的那几条事实**（每条写清抽的是哪一行），不是整章一句总评。
      **每条裁决给得出回查位置**：指到被回查的那个文件与位置（spec / SR / RR / 源码），
      或抄一段能检索到的原文——够支撑这条判断就行，不按长度计。
      既给不出可回查位置、也没有能支撑判断的原文，或只是把 spec 自己的结论复制一遍的，
      该条按**未裁**处理。
  upstream_inputs_coverage:
    description: >
      上游输入覆盖（信息守恒）：doc/features/{module}/ 下存在 SR/design.md 或 RR/prd.md 时，
      spec/context-exploration.md 的 key_inputs_read 须包含它们；spec 业务流程图与 §9.1.1 端云接口
      的端云结论不得与 SR/design.md 的端云声明矛盾。
    severity: MAJOR
    ai_prompt_hint: >
      检查 doc/features/{module}/SR/design.md 与 RR/prd.md 是否存在；存在则核对
      context-exploration.md key_inputs_read 是否覆盖；再比对 SR 中与本部件相关的端云接口
      声明与 spec 流程图/§9.1.1 端云接口：SR 声明了本部件要调用的接口而 spec 完全未体现，
      或两者接口清单矛盾，即 FAIL。SR/RR 均不存在时本检查 SKIP。
      对象是 **SR 声明的每个与本部件相关的接口**，逐个核。
      **每条裁决给得出回查位置**：指到 SR/design.md 的哪一节，或抄一段能检索到的原文——
      够支撑这条判断就行，不按长度计。
      既给不出可回查位置、也没有能支撑判断的原文，或只是把 spec 自己的 §9.1.1 表格复制一遍的，
      该条按**未裁**处理。
  split_boundary_consistency:
    description: >
      拆分边界一致性：AR/story-src/story-flow.json 的 split.decided = "split" 时，spec 的功能清单、
      Scope 与验收标准须与 AR/design.md「本 AR 范围与拆分说明」的拆分表一致——
      表里归兄弟 AR 或「待立项」的份额不属于本次，其功能不得进入本 AR 的功能清单与验收；
      这些内容涉及的模块若登记 out_of_scope_modules，rationale 须写明归属（「归属 <兄弟 AR 单号>」
      或「待立项」），而不是笼统的「本需求不做」。**split.decided != "split" 时本检查 SKIP。**
    severity: MAJOR
    ai_prompt_hint: >
      先读 doc/features/{module}/AR/story-src/story-flow.json 的 split 字段：decided 不是 "split" 即 SKIP。
      是 "split" 时取 parts（或 AR/design.md §1.2 的拆分表），列出 carrier 不是本 feature 的
      那几份及其 scope。再逐条核对 doc/features/{module}/spec/spec.md 的功能清单与验收标准：
      是否有功能实质属于那几份的 scope——有即 FAIL（把兄弟 AR 的活揽进了本次范围）。
      再看 Scope 的 out_of_scope_modules：涉及那些份额的模块，rationale 是否写明了归属；
      只写「本需求不做」而不说归谁，同样记为 FAIL——评审者分不清「有人接」与「没人接」。
      对象是**拆分表里 carrier 不是本 feature 的每一份**，逐份核。
      **每条裁决给得出回查位置**：指到 AR/design.md 的拆分表与 spec 功能清单里的哪一行，
      或抄一段能检索到的原文——够支撑这条判断就行，不按长度计。
      既给不出可回查位置、也没有能支撑判断的原文，或只是把 story-flow.json 的 scope 字段
      复制一遍的，该条按**未裁**处理。

  judgement_change_basis:
    description: >
      审查之后改过的判断有新依据：`spec/notes.md` 声明的每一处判断改动（`spec/knowledge-use.yaml` 或
      `AR/story-src/decisions.json` 里命中改不命中、适用改不适用、置信度降级、settled 改 open 或反过来），
      都写了这次改动的新事实或新决定；请求给了上一份审查报告时，与它对照找出这些改动。只为消掉审查意见而改判断、
      说不出新依据的，或改完之后与承载章的设计自相矛盾的，FAIL。没有这类改动时写 PASS 并说明核过哪几处。
    severity: MAJOR
    ai_prompt_hint: >
      对照 `spec/notes.md` 与 knowledge-use.yaml、decisions.json：找出审查之后改过的判断，逐条看 notes 里有没有新依据、
      改后的判断与 spec 承载章是否一致。details 写有问题的那几条：哪一条、原判断与新判断、缺的依据是什么。

  story_reader_review:
    description: >
      归档叙事件的独立审查：读者拿这一份能不能读懂这个需求。审查对象是最终的
      `doc/features/{module}/AR/story.md`，输入是它据以成文的东西——材料清单
      `AR/story-src/materials.json` 指向的每一份材料、`AR/story-src/story-flow.json` 里已确认的本 AR 范围、
      `AR/story-src/decisions.json` 里已登记的判断、spec 已经成立的产品约束、验收条目
      `acceptance.yaml`，以及作者的写作设计 `AR/story-src/story-template.md`（待核的作者判断，不是标准）。
      按**读者会问什么**审查十个方面：背景、范围、方案、流程、功能、异常、验收、交付、
      图与文的配合（每张图问三件：图前是不是把这段过程讲了一遍，谁在什么条件下做什么、结果怎样，不看图也懂；
      图后是不是说明了各分支成立的条件、由谁处理及处理结果，写的是图上没有的；图种合不合读者要判断的那件事）、判断与事实是否分开。每章要回答的读者问题与章级质量维度写在
      `doc/extensions/skills/story/contracts/story-chapters.json`（`chapters[].questions`
      与 `verdicts.chapter_dimensions`），按那份合同审，不另立标准。
      **不做逐条对账、不出裁决表**：把材料一条条比回 story、给每条打一个勾，
      抄的量随材料条数涨，读者得到的判断却不增加。
      你要判的是机器判不了的那一类：这件事讲了没有、讲清没有、是不是编的。
      结论只有两类，见 ai_prompt_hint。`AR/story.md` 不存在时本检查 SKIP。
    severity: BLOCKER
    ai_prompt_hint: >
      **先独立想清楚，再看作者怎么安排**：先按原材料、已确认范围、spec 与已登记的判断，
      想清楚这个需求要让读者读懂哪些事实、关系与决定；再读写作设计，用它定位作者打算在哪讲、
      为什么这样组织——设计漏掉的不因此算不在范围，写了理由不等于理由成立，
      任务书列了写作设计的调整记录时，核那几处改动之后原来要解释的关系还在不在——
      作者写了理由不等于调整成立，按正文与原材料判；没有这份文件不算缺件。
      章节骨架是否服务当前需求、有没有把原材料里的关系丢在设计这一层，按内容判：
      骨架把答案复述成设计、或正文因为骨架没列就漏掉了有效关系，都算问题；
      写作设计多长、待核几条，都不是合格条件。
      最后读 story，按章过合同里的读者问题与维度——**附录的投影区也是读者看到的内容**，
      与正文同样要核，不因为它由脚本生成就豁免。
      **任务书按话题并列了会议判断、原话、人的裁决与当前结果，按「话题 → 原话 → 人选的那一项 → 最终结论」逐条核**：
      回 `raw.md` 与 `corrections.json` 自己看原文，不只看模型纠偏之后的样子——
      话题有没有漏、finding 与当前结果有没有写出会上没说的、没收敛的有没有被替人定成结论、
      纠偏有没有改了意思、引用的行范围指的是不是那句话、当前结果里的结论与人真选的那一项是不是同一件事、
      仍未决的有没有传到产物里。**会议不因为更新就压过文档**：没有人的裁决而改了已定口径的，算问题。
      漏了的写进 blocking_findings，去向是 reopen 再裁。
      报告里只写两类结论，别的都不要写：
      **blocking_findings** —— 严重性按读者要完成的判断定，不按章数、图数、参与方个数：
      关键业务事实缺失或把已确认的事实写反、核心章只剩空泛短句、材料与已登记判断都不支持的
      确定结论（编造）、还开着的决定被写成已定的方案、
      **登记成 `settled` 的条目拿不出人的表态**——任务书「登记成已定的那几条」一节逐条给了
      该谁定、评审时要人做什么与作者写的澄清正文，回材料、会议原话与评审记录核这个结论谁给的：
      要人表态才成立的事（业务口径、对外承诺、处置标「（评审动作）」的规约条目），
      依据指不出那个人在哪说过就是伪定案，它本该是 `open`。`decider` 有名字只说明该谁定；
      依据要指得到那个人表态的位置，转述、计划与作者自己的推荐都不是表态。
      **判的是来源不是形态**：`settled + confirm`（已有结论请人复核）是正常形态，
      评审记录里人工区空着也不证明无人表态——结论有没有来源要回原文看，
      核心动作缺少必要的契约或数据又没写明限制、
      前后矛盾、超出或漏掉已确认范围、验收条件无法判定、spec 正文与 `acceptance.yaml` 里
      同一验收编号关联的功能或含义不一致（在本阶段就阻断，不留给后续阶段）、
      图前声称覆盖的关键关系在图里缺去向而正文也没让整个过程真正成立（「正文提到过」不算闭合），
      上游的图被合并或改画后丢了原图讲的调用方、被调方、返回结果或失败后的责任与状态
      （节点同名、带着图源标记不等于关系还在；任务书把每张上游图与承接它的 story 图并排给出，逐张对照，
      图种可以换，声称承接却丢了关系才算）、
      实现选型（存储介质、内部结构这类换个实现方案结论就变、又不改对外承诺的事）出现在待确认区，
      或 spec §9.1 里没定的实现项没写明「由 plan 定」、
      材料之间的冲突由作者自行选定一边，改变了明确的验收或范围口径却拿不出人的裁决依据
      （术语确认不等于批准业务改动，能解释一种方案也不等于获得授权），
      以及**规约或知识判定的依据只回显条目名称、复述规约原文**——那样的依据说不出它落在
      本需求的哪个具体事实上，读者无从复核，与没判过等价。
      逐项写清三件事：在哪一章哪一句、缺的或错的是什么、对读者的影响是什么。
      **advisories** —— 不影响正确、完整与可执行的表达建议（标题、措辞偏好、一段是不是讲了几件独立的事；正文里指着文档说话的句子——本章 / 本节 / 这张图 / 下表 / 如下——与章开场白，是读者要跳过的一段），不阻止 PASS。
      判据是**内容**不是形态：同一件事写成表还是写成段、标题怎么起、几个小节，
      都不构成 finding；反过来，十章齐全、字数不少而某一章只有空泛短句，是 blocking。
      **这些也不算 finding**：真实待决写清了边界、相关行为没被说成已实现，可以交人审；
      只有把端侧不存在的服务器侧动作说成本特性行为才要指出。原件或看图能力缺席使某项判断做不了时，写明未验证与影响，
      不要写成已读、已验。
      引用材料或 story 时抄原文定位，不要复述。零 blocking 时说明你逐章都过了什么，
      不要只写一句「未发现问题」——那与没审同形。
      **跨章对着读这几问**（逐章问答看不到横跨两章的矛盾：同一个条件在流程里说一套、
      在验收里说另一套时，两章各自都说得通，只有对着读才看得出来）：
      ① 同一个条件各章说法一致吗——挑决定用户能否继续的关键条件，
      把流程、功能说明、异常与恢复、验收四处对着读，同一种情况下用户看到什么、
      系统怎么处理，四处说的是不是同一件事；
      ② 图里每条路径有后续吗——分支画出去之后要么走到终态、要么接回某个节点，不能断在那里；
      ③ 材料自己打架的地方怎么处理的——决策件里写成 `settled` 的，核它称的依据真能支持这个决定：
      改变明确验收或范围口径的，要有人的裁决；没有裁决的应是 `open`，正文只写受影响的待决边界。
      既没登记、又在正文里选了一边，就是替需求方做了决定而他不知道；
      ④ 附录那些非实体落点写的是实际影响对象吗——「页面」「资源」这种泛称等于没写落点；
      ⑤ 上游画出来的每条路径 story 讲到了吗、讲在合适的章吗——主路径之外的那几条最容易
      整条没人讲；图搬过来了不等于那件事讲过了；
      ⑥ 业务流程章把端到端过程、关键状态与全部分支去向讲清了吗——评审者顺它
      就能看懂这条业务走到哪、岔在哪、各自到哪个终态。**判的是总览与局部加起来**：
      总览给主线与主要分流入口，复杂分支在对应小节展开并接回主线，都算讲到；
      一条分支去向在总览与局部两处都没有，才是 finding。全部节点挤进一张图不是问题、
      总览里少画一条在局部完整展开的分支也不是问题，问题是它整个没人讲。
      只复制上游契约图而不回答上面这些事同样是 finding；与上游那张长得一样本身不是问题。**协作次序按实际关系判，不按参与方个数**：只要存在「谁先调谁、
      结果回到谁」这种往返或先后依赖，图就要讲清它——两方之间也可能有复杂往返，
      多方单向直通反而不需要；一张只画了「有哪些方」的图答不了次序与回程。
      ⑦ 任务书里的回看清单逐条核去向——初筛疑点被讲清、登记 open，或有依据地判不适用；
      未决没有被写成已定；骨架待核在正文或决策登记里有着落；
      ⑧ 每条议题的「依据」指得出撞点吗——story 哪一章或 spec 哪一节的哪个主张，与哪份材料的
      哪一节、哪条工程事实或规约相撞；只有「根据材料」一类没有指向的话，算没写依据。
      **材料里的图逐张三问**（哪几张、各是什么、作者说用不用，由任务包给）：
      story 用了没有；用了的，这张图属不属于本需求、有没有必要进正文——按 story-write「材料里的每张图都要有去处」
      判为不属于本需求的图进了正文，就是 finding；
      没用的，它给的理由成不成立——没有理由又没在 story 里露面的图是缺口。
      **结果按输出契约写，本项不设例外**：汇总表里 `story_reader_review` 一行，
      证据格写你逐章过了什么——**不许空**，空证据与没审同形。
      任务书里有「会议材料：逐话题并列」一节时，证据里要能看出**每个话题的去向**：
      人选了什么、当前结果里的确定行为有没有依据、仍未决的有没有传下去。
      **不规定写成几行**：一话题一行、按去向归并、随章叙述都行，只要逐个话题追得到。
      话题有漏、或某个话题的去向说不出来，与没审同形。
      判 PASS 时到此为止，不写明细；判 FAIL 或 WARN 时另在 YAML 明细里出这一条，
      `details` 下两个键 `blocking_findings` 与 `advisories`，都是列表，
      没有阻断问题的那个写成空列表——空列表是结论，缺席分不清是没发现还是没审。

# 作者起手内容的读没读过：唯一的机械留痕。
# 本阶段的作者要求由作者动笔前自己取（入口见 SKILL 与 CLAUDE.md 扩展段），
# 取到之后没有任何东西能证明它被读了——
# 除非作者把来源坐标写进 `context-exploration.md` 的 `key_inputs_read`。
# 这里把那条路径声明为本阶段的必需片段，既有门禁 `context_exploration_inputs_coverage`
# 就会在没写时 FAIL。**不新增门禁、状态或字段**，只是给既有门禁多一个必需项。
# 字符串就是那份原则页的仓内相对路径，逐字一致。
exploration_thresholds:
  phase_input_snippets_extra:
    - doc/extensions/hooks/spec/author.md
