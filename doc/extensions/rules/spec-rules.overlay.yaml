# 实例扩展 spec 阶段规则 overlay（story / constraints）
# 经 manifest provides.phase_rules_overlays.spec 注册；semantic_checks 由 AI verifier 消费（零脚本改动）。
phase: spec
version: "1.1"
semantic_checks:
  knowledge_spec_exit_substance:
    description: >
      知识判定的结论必须是**本需求的设计**，不是规约原文的复述。判断的真源是
      `spec/knowledge-use.yaml`（§10/§11 是它的投影，两者按构造一致）。
      判据：把编号遮住，这句话还能指导编码吗？它说清了落在哪个接口、存储键、字段或业务步骤上吗？
      换一个需求这句话是否照样成立（成立即复述）？
      判「不适用」的条目须给具体依据——「不涉及」三个字不构成依据。
      登记齐不齐、编号在不在册、投影跟不跟得上，机械层已经核过；这里判的是**判断本身**。
      有一条是复述或依据站不住即 FAIL。
    severity: MAJOR
    ai_prompt_hint: >
      打开 `spec/knowledge-use.yaml`，对着材料与 spec 的技术契约看：命中的那几条，
      requirement 落在哪个具体名字上？不命中的那几条，reason 能不能回查到本需求的事实？
      **不要逐条对账、不要出裁决表、不要为每条结论找一段够长的引文**——
      那些做法的产物是把真源里的字抄一遍，抄的量随材料条数涨，读者得到的判断不增加。
      details 里写你判出问题的那几条：是哪一条、问题是什么、依据是产物或材料里的什么事实；
      判不出问题就写清你按什么看过、看了哪几条。
  knowledge_candidates_registered:
    description: >
      设计模式候选只登记不选型：逐个适用单元给出候选与命中信号或反证。
      候选须是在册标识；零候选是正常结论，但须显式登记单元与「为什么都不需要」。
      判断的真源是 `spec/knowledge-use.yaml` 的 `patterns` 段。
      判据是**单元切分是否合理、信号是否指向真实的业务特征**——
      单元切得太粗（整个需求算一个单元）或信号是空话（「交互较多」），即 FAIL。
      **反证与材料是否对得上**同样在判：反证里每个可核对的业务断言，逐条拿材料核；
      材料明写存在的东西而反证说没有，即点名。复述模式索引判定措辞的反证，
      按未举证处理——那种句子换个需求照样成立，证明不了判断发生过。
      本阶段**不判**该不该采用——那是 plan 的事，此处判的是候选识别做没做。
    severity: MAJOR
    ai_prompt_hint: >
      读 `spec/knowledge-use.yaml` 的 `patterns` 段：适用单元的粒度是否符合激活清单里
      那份模式索引给的定义？signal 有没有指向本需求里真实存在的分支、步骤或交互？
      写「无候选」的那几条有没有给出理由？
      **反证逐条拿材料核**：某一条说这段流程没有多分支、说这个页面的交互互不依赖——
      去材料里看它说的是不是这么回事。材料里明写着的东西而反证说没有，点名它。
      复述模式索引判定措辞的反证，按未举证处理——那种句子换个需求照样成立。
      details 写你判出问题的那几条与依据；不出裁决表、不为每条找引文。
  spec_ext_conclusion_validity:
    description: >
      spec §9 技术契约与 story 影响面回显两表的结论须真实、具体、可按名回查：结论中写全了它谈论的东西的名字
      （接口名/存储键/事件名/配置项名/模块名/错误码），且该名字在 spec、SR 或代码中确实存在、
      语义一致；「不涉及」条目附有判断依据（现状扫描或 Scope 声明）；无凭空推断。
      **spec 不写文档坐标**（见 evidence-rules §0 独立审计原则）——核对靠按名回查，不靠产物给出处。
      **未走 /story 的 feature（无 AR/story-src/story-flow.json）本检查 SKIP**——§9 技术契约与 story
      回显表都是扩展新增的落点，那种场景下两者都不存在。
    severity: MAJOR
    ai_prompt_hint: >
      抽查 spec §9 技术契约与 story 影响面回显两表中至少 3 条事实（优先抽「新增/修改」类结论）：取出结论里的具体名字
      （如 createBusinessOrder、last_business_context、feature_entry_enabled），到
      doc/features/{module}/spec/spec.md、SR/design.md、RR/prd.md 与 in_scope 模块源码中检索该名字，
      判断结论是否被支撑。**特别核查数值，且两个产物判据不同**（形态真源见
      skills/story/reference/evidence-rules.md 的证据表）：
      spec 侧——阈值/时长类数字须在正文三选一标来源（机械门只核标没标）；
      标「上游约束」的，回查 SR/RR 原文所指业务量是不是这一个：数字加单位在原文
      字面命中不证明是同一个量，未字面命中也不等于没有真实来源——单位换算
      有真实依据才成立，同数字不同含义即 FAIL；
      标「本工程设定」的检查是否确实上游无据、取舍有无依据。
      story 侧——上游约束/平台基线的数值写正文+出处；**本工程设定的值不在正文标来源，
      而是登记决策件后由正文引用**。所以 story 正文出现「（本工程设定，无上游依据）」这类
      括注反而是错的，别按 spec 的写法要求 story。
      结论只写「新增了一个开关」这类无名字的空话，同样 FAIL——无从核对。
      证据为「检索式零命中」类时，判断该检索式是否合理覆盖了该维度。
      对象是**抽查的那几条事实**（每条写清抽的是哪一行），不是整章一句总评。
      **每条裁决附引文**：从被回查的那个文件（spec / SR / RR / 源码）抄一段连续 12 字以上的原文（能检索到的）。
      引文为空、或只是把spec 自己的结论复制一遍的，该条按**未裁**处理。
  upstream_inputs_coverage:
    description: >
      上游输入覆盖（信息守恒）：doc/features/{module}/ 下存在 SR/design.md 或 RR/prd.md 时，
      spec/context-exploration.md 的 key_inputs_read 须包含它们；spec 业务流程图与 §9.1 端云接口
      的端云结论不得与 SR/design.md 的端云声明矛盾。
    severity: MAJOR
    ai_prompt_hint: >
      检查 doc/features/{module}/SR/design.md 与 RR/prd.md 是否存在；存在则核对
      context-exploration.md key_inputs_read 是否覆盖；再比对 SR 中与本部件相关的端云接口
      声明与 spec 流程图/§9.1 端云接口：SR 声明了本部件要调用的接口而 spec 完全未体现，
      或两者接口清单矛盾，即 FAIL。SR/RR 均不存在时本检查 SKIP。
      对象是 **SR 声明的每个与本部件相关的接口**，逐个核。
      **每条裁决附引文**：从SR/design.md抄一段连续 12 字以上的原文（能检索到的）。
      引文为空、或只是把spec 自己的 §9.1 表格复制一遍的，该条按**未裁**处理。
  split_boundary_consistency:
    description: >
      拆分边界一致性：AR/story-src/story-flow.json 的 split.decided = "split" 时，spec 的功能清单、
      Scope 与验收标准须与 AR/design.md「本 AR 范围与拆分说明」的拆分表一致——
      表里归兄弟 AR 或「待立项」的份额不属于本次，其功能不得进入本 AR 的功能清单与验收；
      这些内容涉及的模块若登记 out_of_scope_modules，rationale 须写明归属（「归属 ARxxxx」
      或「待立项」），而不是笼统的「本需求不做」。**split.decided != "split" 时本检查 SKIP。**
    severity: MAJOR
    ai_prompt_hint: >
      先读 doc/features/{module}/AR/story-src/story-flow.json 的 split 字段：decided 不是 "split" 即 SKIP。
      是 "split" 时取 parts（或 AR/design.md §1.2 的拆分表），列出 carrier 不是本 feature 的
      那几份及其 scope。再逐条核对 doc/features/{module}/spec/spec.md 的功能清单与验收标准：
      是否有功能实质属于那几份的 scope——有即 FAIL（把兄弟 AR 的活揽进了本次范围）。
      再看 Scope 的 out_of_scope_modules：涉及那些份额的模块，rationale 是否写明了归属；
      只写「本需求不做」而不说归谁，同样记为 FAIL——评审者分不清「有人接」与「没人接」。
      对象是**拆分表里 carrier 不是本 feature 的每一份**，逐份核。
      **每条裁决附引文**：从AR/design.md 的拆分表与 spec 的功能清单抄一段连续 12 字以上的原文（能检索到的）。
      引文为空、或只是把story-flow.json 的 scope 字段复制一遍的，该条按**未裁**处理。

  story_reader_review:
    description: >
      归档叙事件的独立审查：读者拿这一份能不能读懂这个需求。审查对象是最终的
      `doc/features/{module}/AR/story.md`，输入是它据以成文的东西——材料清单
      `AR/story-src/materials.json` 指向的每一份材料、`AR/story-src/story-flow.json` 里已确认的本 AR 范围、
      `AR/story-src/decisions.json` 里已登记的判断、spec 已经成立的产品约束、验收条目
      `acceptance.yaml`，以及作者的写作设计 `AR/story-src/story-template.md`（待核的作者判断，不是标准）。
      按**读者会问什么**审查十个方面：背景、范围、方案、流程、功能、异常、验收、交付、
      图与文的配合、判断与事实是否分开。每章要回答的读者问题与章级质量维度写在
      `doc/extensions/skills/story/contracts/story-chapters.json`（`chapters[].questions`
      与 `verdicts.chapter_dimensions`），按那份合同审，不另立标准。
      **不做逐条对账、不出裁决表**：把材料一条条比回 story、给每条打一个勾，
      抄的量随材料条数涨，读者得到的判断却不增加。
      你要判的是机器判不了的那一类：这件事讲了没有、讲清没有、是不是编的。
      结论只有两类，见 ai_prompt_hint。`AR/story.md` 不存在时本检查 SKIP。
    severity: BLOCKER
    ai_prompt_hint: >
      **先独立想清楚，再看作者怎么安排**：先按原材料、已确认范围、spec 与已登记的判断，
      想清楚这个需求要让读者读懂哪些事实、关系与决定；再读写作设计，用它定位作者打算在哪讲、
      为什么这样组织——设计漏掉的不因此算不在范围，写了理由不等于理由成立，
      与设计建议或以往写法不同但讲清了的组织不扣；最后读 story，按章过合同里的读者问题与维度。
      报告里只写两类结论，别的都不要写：
      **blocking_findings** —— 严重性按读者要完成的判断定，不按章数、图数、参与方个数：
      关键业务事实缺失或把已确认的事实写反、核心章只剩空泛短句、材料与已登记判断都不支持的
      确定结论（编造）、还开着的决定被写成已定的方案、核心动作缺少必要的契约或数据又没写明限制、
      前后矛盾、超出或漏掉已确认范围、验收条件无法判定、spec 正文与 `acceptance.yaml` 里
      同一验收编号关联的功能或含义不一致（在本阶段就阻断，不留给后续阶段）、
      图前声称覆盖的关键关系在图里缺去向而正文也没让整个过程真正成立（「正文提到过」不算闭合），
      以及**规约或知识判定的依据只回显条目名称、复述规约原文**——那样的依据说不出它落在
      本需求的哪个具体事实上，读者无从复核，与没判过等价。
      逐项写清三件事：在哪一章哪一句、缺的或错的是什么、对读者的影响是什么。
      **advisories** —— 不影响正确、完整与可执行的表达建议（标题、措辞偏好），不阻止 PASS。
      判据是**内容**不是形态：同一件事写成表还是写成段、标题怎么起、几个小节，
      都不构成 finding；反过来，十章齐全、字数不少而某一章只有空泛短句，是 blocking。
      **这些也不算 finding**：真实待决写清了边界、相关行为没被说成已实现，可以交人审；
      订单、数据、状态的撤销与恢复是正常业务语言，只有把端侧不存在的服务器侧动作说成
      本特性行为才要指出。原件或看图能力缺席使某项判断做不了时，写明未验证与影响，
      不要写成已读、已验。
      引用材料或 story 时抄原文定位，不要复述。零 blocking 时说明你逐章都过了什么，
      不要只写一句「未发现问题」——那与没审同形。
      **跨章对着读这几问**（逐章问答看不到横跨两章的矛盾：同一个条件在流程里说一套、
      在验收里说另一套时，两章各自都说得通，只有对着读才看得出来）：
      ① 同一个条件各章说法一致吗——挑关键条件（未登录、未实名、开关关闭、配额用尽这类），
      把流程、功能说明、异常与恢复、验收四处对着读，同一种情况下用户看到什么、
      系统怎么处理，四处说的是不是同一件事；
      ② 图里每条路径有后续吗——分支画出去之后要么走到终态、要么接回某个节点，不能断在那里；
      ③ 材料自己打架的地方作者定了口径吗——定了的在决策件里是 `settled`，定不了的是 `open`；
      两样都没有就是替需求方做了决定而他不知道；
      ④ 附录那些非实体落点写的是实际影响对象吗——「页面」「资源」这种泛称等于没写落点；
      ⑤ 上游画出来的每条路径 story 讲到了吗、讲在合适的章吗——主路径之外的那几条最容易
      整条没人讲；图搬过来了不等于那件事讲过了；
      ⑥ 业务流程章章首那张图讲清了端到端过程、关键状态与全部分支去向吗——评审者顺它
      就能看懂这条业务走到哪、岔在哪、各自到哪个终态；只复制上游契约图、只画主路径、
      分支去向缺一条，都是 finding。与上游那张长得一样本身不是问题，问题是它没回答
      评审者要问的事。**协作次序按实际关系判，不按参与方个数**：只要存在「谁先调谁、
      结果回到谁」这种往返或先后依赖，图就要讲清它——两方之间也可能有复杂往返，
      多方单向直通反而不需要；一张只画了「有哪些方」的图答不了次序与回程。
      **材料里的图逐张三问**（哪几张、各是什么、作者说用不用，由任务包给）：
      story 用了没有；用了的，这张图属不属于本需求、有没有必要进正文——旧版页面、
      同页面的另一张截图、同类产品的参考稿、别的部件或别的单的页面，进了正文就是 finding；
      没用的，它给的理由成不成立——没有理由又没在 story 里露面的图是缺口。
      **结果按输出契约写，本项不设例外**：汇总表里 `story_reader_review` 一行，
      证据格写你逐章过了什么——**不许空**，空证据与没审同形。
      判 PASS 时到此为止，不写明细；判 FAIL 或 WARN 时另在 YAML 明细里出这一条，
      `details` 下两个键 `blocking_findings` 与 `advisories`，都是列表，
      没有阻断问题的那个写成空列表——空列表是结论，缺席分不清是没发现还是没审。

# 作者起手内容的读没读过：唯一的机械留痕。
# 本阶段的作者要求由作者动笔前自己取（入口见 SKILL 与 CLAUDE.md 扩展段），
# 取到之后没有任何东西能证明它被读了——
# 除非作者把来源坐标写进 `context-exploration.md` 的 `key_inputs_read`。
# 这里把那条路径声明为本阶段的必需片段，既有门禁 `context_exploration_inputs_coverage`
# 就会在没写时 FAIL。**不新增门禁、状态或字段**，只是给既有门禁多一个必需项。
# 字符串就是那份原则页的仓内相对路径，逐字一致。
exploration_thresholds:
  phase_input_snippets_extra:
    - doc/extensions/hooks/spec/author.md
