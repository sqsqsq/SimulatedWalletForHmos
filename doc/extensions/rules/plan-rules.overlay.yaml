# 实例扩展 plan 阶段规则 overlay（义务挂到契约实体）
# 经 manifest provides.phase_rules_overlays.plan 注册；semantic_checks 由 AI verifier 消费（零脚本改动）。
#
# 本文件只问「冻结的义务是不是本需求的设计」——不复述域名、编号与维度。
# 规约内容改了（增删域、改条目），这里一个字都不用动。
phase: plan
version: "1.1"
semantic_checks:
  knowledge_obligation_substance:
    description: >
      冻结的每条义务与每个采用的模式都必须是**本需求的设计**，不是规约原文的转述。
      判断的真源是 `plan/contracts.yaml`：`must` 挂在哪个实体上、`files[].pattern` 选了哪几个。
      判据三问：① obligation 说清了这条规约在本需求里落成什么了吗（哪个实体、哪个步骤）？
      ② 把编号遮住，它还能指导编码吗？③ 换一个需求这句话是否照样成立（成立即复述）？
      模式部分判：角色投影是不是真的改变了方案的结构——每个角色都指向一个承载它的实体，
      还是只把模式名和几个类名摆在一起？不采用的模式，理由是不是针对本需求的适用单元说的？
      结构层（落点可解析、角色齐全、anchor 非自指）已由机械门禁判过，这里只判内容。
      任一行判「复述」即 FAIL。
    severity: MAJOR
    ai_prompt_hint: >
      读 `contracts.yaml` 里的每条 `must` 与每个 `files[].pattern`，再读 plan.md 对应的
      设计章（义务的 anchor 指向它）：那一章里是否真的因为这条义务多出了字段、方法、状态或校验？
      只在「知识决策」章声明、设计章里看不出任何痕迹的，就是复述。
      **知识决策章排在设计章之前**是结构要求（已由机械门禁判）；这里判的是排在前面之后，
      后面的设计有没有真的按它展开。
      details 写你判出问题的那几条与依据（指到 plan.md 或 contracts.yaml 的具体位置）；
      **不逐行对账、不出裁决表、不为每条找引文**——那种表的量随义务条数涨，判断不增加。

  knowledge_facts_reuse:
    description: >
      方案新增的每一类能力，是否先复用了项目知识里登记的入口？未复用的有没有理由？
      与登记不符的有没有把矛盾登记下来？「一类能力」按项目知识登记的面对齐，不另立分类。
      **不按项目知识的面逐面裁**——只裁本方案实际新增的能力：项目知识回答「这个工程已经有什么」，
      它的价值在于新增能力时先去看有没有现成的，而不是对着每一面写一遍「本需求不涉及」。
      任一类新增能力既没复用登记的入口、也没写为什么不复用，即 FAIL。
    severity: MAJOR
    ai_prompt_hint: >
      先从 plan.md 与 contracts.yaml 里列出本需求新增的能力，再逐类写
      「复用了哪个登记入口（写出名字）/ 未复用的理由 / 与登记不符之处」，证据给 plan.md 或
      contracts.yaml 的行号。项目知识文件在本阶段的激活清单里，自己打开对照，别凭印象。
      写清依据在 plan.md 或 contracts.yaml 的哪一处；把项目知识文件的原文复制一遍不算依据。

  review_gate_acknowledged:
    description: >
      决策件（归档件的评审记录）里每条议题的「审核结果：」后面须有非空内容；
      还空着就进入 plan 时判 WARN，并列出哪些议题仍没人表态。
      评审人在线上表态、事后回填是常态路径，所以本项不阻断——它要的是「谁还没表态」被看见。
    severity: MINOR
    ai_prompt_hint: >
      读归档件的评审记录：各议题的「审核结果：」后面填了没有。
      **逐个议题**给结论，对象是议题编号。列出仍空着的议题编号；全部有表态就写「已表态」。
      每条附引文：从评审记录里抄该议题那一行的原文。
      有任一议题没有表态即判 **WARN**（本项 MINOR，不阻断——它要的是「谁还没表态」被看见）；
      连开放议题都列不出来的，该条按**未裁**处理。

# 作者起手内容的读没读过：唯一的机械留痕。
# 本阶段的 author 钩子由 manifest 的 `on_context_load` 送达（执行者跑
# `scripts/author-context.ts --phase plan`），送达之后没有任何东西能证明它被读了——
# 除非作者把来源坐标写进 `context-exploration.md` 的 `key_inputs_read`。
# 这里把那条路径声明为本阶段的必需片段，既有门禁 `context_exploration_inputs_coverage`
# 就会在没写时 FAIL。**不新增门禁、状态或字段**，只是给既有门禁多一个必需项。
# 字符串必须与入口输出的来源标识逐字一致（钩子的仓内相对路径）。
exploration_thresholds:
  phase_input_snippets_extra:
    - doc/extensions/hooks/plan/author.md
