# 实例扩展 plan 阶段规则 overlay（知识冻结）
# 经 manifest provides.phase_rules_overlays.plan 注册；semantic_checks 由 AI verifier 消费（零脚本改动）。
#
# 本文件只问「冻结的义务是不是本需求的设计」——不复述域名、编号与维度。
# 规约内容改了（增删域、改条目），这里一个字都不用动。
phase: plan
version: "1.1"
semantic_checks:
  knowledge_freeze_substance:
    description: >
      冻结的每条义务与每个采用的模式都必须是**本需求的设计**，不是规约原文的转述。
      本阶段注入的必答清单逐行列出了全部冻结义务与模式角色投影，**每一行都要裁决**。
      判据三问：① obligation 说清了这条规约在本需求里落成什么了吗（哪个实体、哪个步骤）？
      ② 把编号遮住，它还能指导编码吗？③ 换一个需求这句话是否照样成立（成立即复述）？
      模式部分判：角色投影是不是真的改变了方案的结构——每个角色都指向一个承载它的实体，
      还是只把模式名和几个类名摆在一起？不采用的模式，理由是不是针对本需求的适用单元说的？
      结构层（落点可解析、角色齐全、anchor 非自指）已由机械门禁判过，这里只判内容。
      任一行判「复述」即 FAIL。
    severity: MAJOR
    ai_prompt_hint: >
      按注入的「实例扩展必答清单」逐行裁决，details 里给「行号 → 裁决 → 证据」，行数与清单一致。
      读 plan.md 对应的设计章（义务的 anchor 指向它）：那一章里是否真的因为这条义务
      多出了字段、方法、状态或校验？只在「知识决策」章声明、设计章里看不出任何痕迹的，判「复述」。
      **知识决策章排在设计章之前**是结构要求（已由机械门禁判）；这里判的是排在前面之后，
      后面的设计有没有真的按它展开。
