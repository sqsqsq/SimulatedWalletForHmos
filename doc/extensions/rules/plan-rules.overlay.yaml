# 实例扩展 plan 阶段规则 overlay（应用域规约消费）
# 经 manifest provides.phase_rules_overlays.plan 注册；semantic_checks 由 AI verifier 消费（零脚本改动）。
#
# 本文件只问「本阶段激活的规约条目，产物有没有回答」——不复述域名、编号与维度。
# 规约内容改了（增删域、改条目），这里一个字都不用动：条目清单由本阶段注入件从激活清单派生。
phase: plan
version: "1.1"
semantic_checks:
  plan_constraint_coverage:
    description: >
      本阶段注入件给出了激活的规约条目清单（编号、约束、命中条件、处置、验证执行体）。
      逐条核对：命中本需求的条目，其处置是否已在本阶段产物中体现为设计结论；
      不命中的是否给了依据。命中判据与条目内容以注入的条目为准，本文件不复述。
      **不要求另建台账**：结论写在它自然该在的位置即可，产物即证据。
      处置标「（评审动作）」的条目不产生代码要求，本阶段不为其找代码落点。
    severity: MAJOR
    ai_prompt_hint: >
      从本阶段注入的激活知识清单取全部在册规约条目。再读 doc/features/{module}/plan/plan.md 与同目录 contracts.yaml / use-cases.yaml：
      逐条回答「这条的落实设计在哪一段、落在哪个契约实体上」。
      找不到落点且该条按其命中条件与本需求相关的，即 FAIL——约束在设计阶段就已丢失，后面编码不可能补回来。
      条目里 `<待补充>` 的部分按规约目录 README「读条目时须知」处理：定性评估，不臆造数值。
