# 实例扩展 plan 阶段规则 overlay（义务挂到契约实体）
# 经 manifest provides.phase_rules_overlays.plan 注册；semantic_checks 由 AI verifier 消费（零脚本改动）。
#
# 本文件只问「冻结的义务是不是本需求的设计」——不复述域名、编号与维度。
# 规约内容改了（增删域、改条目），这里一个字都不用动。
phase: plan
version: "1.1"
semantic_checks:
  knowledge_obligation_substance:
    description: >
      plan 要能交给编码去实现与验证：按业务流程走一遍设计章、`contracts.yaml` 与 `use-cases.yaml`，
      实际会发生的正常、异常与未执行路径各由哪个实体处理、数据从哪来、结果交给谁、失败后怎么回到可用状态。
      再看冻结的义务（`must`）与采用的模式是不是这份设计的一部分：挂着义务的实体在本需求里真的做这件事吗
      （借挂、夹带普通业务规则都点名），同样适用它的其它步骤有没有漏挂；义务挂在决定结果的业务实体上，
      不全压在公共封装上。原文（含落法附注）要求讲清的专项，在承载它的设计章里有调用责任、数据来源、边界与验证——
      按每个业务结果走通接口的输入、返回、状态与调用：返回类型在本次契约里定义或指得到现有类型，
      选中交互模式要的用户动作与业务状态在 use-cases 里实际存在。
      埋点小节对着 spec §9.4 逐统计点看（审查任务里 spec 行与 plan 的全部结果行已按统计点名并列）：
      spec 的每种适用结果都有结果行，每行指到决定它的分支或回调、结果取得依据、参数来源、同次边界与验证；
      项目知识要求的字段与取值规则，每项给出实际值或按规则得出的值及来源；以引用规则代替给值、或规则本可算出值却没给的，
      按没落地判；确缺依据的写明缺哪一项、影响哪几行，交裁决；
      决定结果的方法都要扛统计义务，只挂一处而同样决定结果的别的方法没挂，按漏挂判。
      业务语义沿用 spec 已定的结果，实现核「结果 → 责任方法与分支 → 字段取值与来源 → 调用 → 预期事件」接得上；
      项目知识里的参考例子只示范方法，不以例子的名称、编号或行数当答案。spec §9.4 不涉及时本项不适用并写依据。
      use-cases 的调用接收者或协调者、方法、参数与返回、引用的验收编号，要能追到 contracts 的声明、已核的外部接口
      与 acceptance 的实际 id；找不到合法绑定按实现断链判，不按措辞问题降级。
      缺口按对编码的影响定级：编码要重新决定接口结构、核心业务行为或必要取值的，FAIL；措辞与局部优化才是 advisory。
      模式部分：每个角色指向一个承载它的实体，不采用的理由针对本需求的适用单元。
      结构层（落点可解析、角色齐全、验收编号在册）已由机械门禁判过。走不通、借挂、漏挂、夹带或断链，即 FAIL；
      与规约本身冲突的，指回知识或设计的责任方，不自造豁免、不删功能。
    severity: MAJOR
    ai_prompt_hint: >
      先按业务流程读设计章与 use-cases，记下走不通或绑定不上的地方；再看每个出现过的 `rule`：从激活清单里那份规约文件
      读一次条目原文，对着挂着它的每条 `must` 与所在实体判，并看设计章里是否真的因它多出了字段、方法、状态或校验——
      只在「知识决策」章声明、设计章里看不出痕迹的，是没落地。
      details 写判出问题的那几条与依据（指到 plan.md、contracts.yaml 或 use-cases.yaml 的具体位置）；
      **不逐行对账、不出裁决表、不为每条找引文**。

  knowledge_facts_reuse:
    description: >
      方案新增的每一类能力，是否先复用了项目知识里登记的入口？未复用的有没有理由？
      与登记不符的有没有把矛盾登记下来？「一类能力」按项目知识登记的面对齐，不另立分类。
      **不按项目知识的面逐面裁**——只裁本方案实际新增的能力：项目知识回答「这个工程已经有什么」，
      它的价值在于新增能力时先去看有没有现成的，而不是对着每一面写一遍「本需求不涉及」。
      任一类新增能力既没复用登记的入口、也没写为什么不复用，即 FAIL。
    severity: MAJOR
    ai_prompt_hint: >
      先从 plan.md 与 contracts.yaml 里列出本需求新增的能力，再逐类写
      「复用了哪个登记入口（写出名字）/ 未复用的理由 / 与登记不符之处」，证据给 plan.md 或
      contracts.yaml 的行号。项目知识文件在本阶段的激活清单里，自己打开对照，别凭印象。
      写清依据在 plan.md 或 contracts.yaml 的哪一处；把项目知识文件的原文复制一遍不算依据。

  review_gate_acknowledged:
    description: >
      决策件（归档件的评审记录）里每条议题的填写位须有人的表态：「方案选择：」填了选项编号或
      具体方案；「审核结果：」勾了确认，或勾了不同意并写了原因与调整结论，或（没有勾选框的议题）
      后面写了意见。只有提示文字、空框，或只勾不同意而没有原因与结论的，都算还没表态。
      还空着就进入 plan 时判 WARN，并列出哪些议题仍没人表态。
      已经表过态的，看它的影响有没有到本阶段：人定了的结论，plan 的设计按它做了吗；
      送审快照之后才形成的新决定，最近一次 `AR/story-src/updates/<id>/update-notes.md` 或 Spec/Plan 的变更位置
      有没有写清原结论、当前决定、依据、影响位置与待办——**归档件与当前产物不一致本身不是缺陷**，
      记录下来并送到了下游就是合法状态；同一版产物内部自相矛盾才是。
      评审人在线上表态、事后回填是常态路径，所以本项不阻断——它要的是「谁还没表态」被看见。
    severity: MINOR
    ai_prompt_hint: >
      读归档件的评审记录：各议题的填写位（「方案选择：」或「审核结果：」之后）有没有人的表态。
      **逐个议题**给结论，对象是议题编号。列出仍空着的议题编号；全部有表态就写「已表态」。
      每条附引文：从评审记录里抄该议题那一行的原文。
      有任一议题没有表态即判 **WARN**（本项 MINOR，不阻断——它要的是「谁还没表态」被看见）；
      连开放议题都列不出来的，该条按**未裁**处理。

# 作者起手内容的读没读过：唯一的机械留痕。
# 本阶段的作者要求由作者动笔前自己取（入口见 SKILL 与 CLAUDE.md 扩展段），
# 取到之后没有任何东西能证明它被读了——
# 除非作者把来源坐标写进 `context-exploration.md` 的 `key_inputs_read`。
# 这里把那条路径声明为本阶段的必需片段，既有门禁 `context_exploration_inputs_coverage`
# 就会在没写时 FAIL。**不新增门禁、状态或字段**，只是给既有门禁多一个必需项。
# 字符串就是那份原则页的仓内相对路径，逐字一致。
exploration_thresholds:
  phase_input_snippets_extra:
    - doc/extensions/hooks/plan/author.md
