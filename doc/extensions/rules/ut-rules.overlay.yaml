# 实例扩展 ut 阶段规则 overlay（应用域规约消费）
# 经 manifest provides.phase_rules_overlays.ut 注册；semantic_checks 由 AI verifier 消费（零脚本改动）。
#
# 本文件只问「本阶段激活的规约条目，用例有没有覆盖」——不复述域名、编号与维度。
# 规约内容改了（增删域、改条目），这里一个字都不用动：条目清单由本阶段注入件从激活清单派生。
phase: ut
version: "1.1"
semantic_checks:
  ut_constraint_cases:
    description: >
      本阶段注入件给出了激活的规约条目清单（编号、约束、命中条件、处置、验证执行体）。
      逐条核对：命中本需求的条目，其处置是否已在本阶段产物中体现为用例；
      不命中的是否给了依据。命中判据与条目内容以注入的条目为准，本文件不复述。
      **不要求另建台账**：结论写在它自然该在的位置即可，产物即证据。
      处置标「（评审动作）」的条目不产生代码要求，本阶段不为其找代码落点。
    severity: MAJOR
    ai_prompt_hint: >
      从本阶段注入的激活知识清单取全部在册规约条目。再读 本 feature 的 UT 用例清单与 doc/features/{module}/ut/ 下的产物：
      逐条回答「哪条用例覆盖了它」或「为什么该由实机验」。
      判据是用例是否真的覆盖了那个场景，不是用例名里有没有出现该域的词。上游声明会覆盖而用例清单找不到对应场景的即 FAIL。
      条目里 `<待补充>` 的部分按规约目录 README「读条目时须知」处理：定性评估，不臆造数值。
