# 实例扩展 ut 阶段规则 overlay（知识账本消费）
# 经 manifest provides.phase_rules_overlays.ut 注册；semantic_checks 由 AI verifier 消费（零脚本改动）。
#
# 本文件只问「冻结账本里的义务，用例覆盖了没有」——不复述域名、编号与维度。
# 本阶段读的是 plan 的冻结结果，不是知识目录：规约内容改了，这里一个字都不用动。
phase: ut
version: "1.1"
semantic_checks:
  knowledge_obligation_verified:
    description: >
      知识义务派生的验收条目，其用例是不是**真的覆盖了那个场景**。
      机械门禁已经查过覆盖证据在不在；这里判用例内容：断言测的是这条义务要求的行为吗？
      还是只是名字里带了该条目的编号？
      按 ut_layer 分派：标 device 的条目本阶段不适用（那是显式分派不是遗漏），
      标 unit/both 的必须有实质断言。
    severity: MAJOR
    ai_prompt_hint: >
      读 knowledge_freeze 的 obligations 与对应验收条目的 ut_focus，再读 UT 用例。
      判据是用例是否真的覆盖了那个场景，不是用例名里有没有出现该域的词。
      **逐条**给结论（含标 device 判不适用的那些，那是显式分派、也要有一行）。
      名字对得上但断言不相干的，判 FAIL。
      **每条裁决附引文**：从用例文件里抄那句断言的原文（连续 12 字以上）。
      引文为空、或只是把验收条目的 ut_focus 复制一遍的，该条按**未裁**处理。
