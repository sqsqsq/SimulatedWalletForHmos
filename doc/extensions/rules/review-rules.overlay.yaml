# 实例扩展 review 阶段规则 overlay（constraints 消费）
# 经 manifest provides.phase_rules_overlays.review 注册；semantic_checks 由 AI verifier 消费。
#
# 本文件只问「适用矩阵里本阶段该消费的域，审查有没有过」——不复述域名、编号与维度。
phase: review
version: "1.0"
semantic_checks:
  review_constraint_audit:
    description: >
      应用域约束在本阶段的审查须真的过一遍：读
      doc/extensions/knowledge/constraints/README.md 的适用矩阵，取 review 那一列，
      逐个非「—」的格子核对——该域是否已按格子写明的维度对本次变更做了检查并给出结论
      （命中项处置是否落实、有无遗漏）。命中判据与条目内容以该域文件为准。
      审查视角是**已成型的变更**，不是设计意图：结论须指向 diff 中的具体位置。
      矩阵中标「—」的域本阶段不消费。
    severity: MAJOR
    ai_prompt_hint: >
      打开 doc/extensions/knowledge/constraints/README.md 找到适用矩阵，记下 review 列
      所有非「—」的域及其消费维度（有的域在本阶段是「逐项过表」这类明确动作，按其字面执行）。
      对照本次变更逐域给结论：检查了什么、结论是什么、依据在 diff 的哪一处。
      **上游阶段声明过但本次变更里找不到落点的，正是本阶段该抓的**——
      声明与落实之间的缺口只有到这里才看得见。
