schema_version: "1.0"
name: wallet-sdk-demo
# 1.3.0：机制面有判据行为变化——形态判据从「这一章有没有图」换成「分了几张画了几张」、
# 归档件禁用词在 review 上按结构分区收窄作用域、术语核主名不核括注、报错按判据类分组。
# 目标工程升上来会看到不同的报错集合，所以是 minor 不是 patch。
version: "1.3.0"
description: 实例扩展包（story 需求流程 + 三类知识 + 生命周期钩子）
provides:
  skills:
    - story
    - story-adaptation

  # 知识激活清单（确定性）：**阶段只读这里列出的文件**，不扫描 knowledge/ 目录——
  # 目录里躺着的未登记文件，任何阶段都读不到。
  #
  # **一份清单，不设第二份**：「这个文件属于哪类知识」写在文件自己的 frontmatter
  # （`kind: facts | constraints | patterns | index`），不在这里再分一次组。
  # 两份清单意味着两处要同步，改一处忘另一处就是静默漂移——而它们本来就该是同一件事。
  #
  # `kind: index` 是索引件（目录的字段模型、模式的路由与粒度定义）：随清单交付、
  # 可被引用，但不承载条目，因此不参与条目与模式的派生。它**不是第四类知识**——
  # 说明性文档不形成新的知识类型。
  #
  # 域前缀、条目清单、模式标识与角色由 hooks/shared/knowledge.mjs 从各文件的
  # frontmatter 与正文派生，机制层不维护第二份清单；派生为空会响亮报错，不会静默退化成空集。
  knowledge:
    - knowledge/README.md
    - knowledge/facts/README.md
    - knowledge/facts/component-profile.md
    - knowledge/facts/codebase-facts.md
    - knowledge/constraints/README.md
    - knowledge/constraints/ux-consistency.md
    - knowledge/constraints/security-privacy.md
    - knowledge/constraints/dfx-baseline.md
    - knowledge/constraints/observability.md
    - knowledge/constraints/resource-usage.md
    - knowledge/constraints/compatibility-checklist.md
    - knowledge/constraints/env-exceptions.md
    - knowledge/constraints/deliverables.md
    - knowledge/design-patterns/README.md
    - knowledge/design-patterns/decision-tree.md
    - knowledge/design-patterns/page-interaction.md

  # 挂载分步进行：manifest 里任何一条路径不存在，加载器会**清空全部 provides**
  # （全有全无，不降级），所以只登记已交付的钩子。
  #
  # 三个事件各有各的消费者，别混：
  #   on_context_load → **作者**，动笔之前（执行者跑 scripts/author-context.ts 取）；
  #   post_check      → 门禁，产物落盘之后；
  #   pre_verifier    → verifier 的上下文。
  # 不登记在这里的作者要求，只能靠执行者自己去翻，通常在产物落盘之后才读到。
  hooks:
    spec:
      on_context_load:
        # author.md 是原则页，也是 context-exploration 里 key_inputs_read 能逐字引用的坐标；
        # author.mjs 从合同、激活清单与流程契约渲染**这一次**的任务包。两个一起送到作者手上。
        - hooks/spec/author.md
        - hooks/spec/author.mjs
      post_check:
        - hooks/spec/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs
    plan:
      on_context_load:
        - hooks/plan/author.md
      post_check:
        - hooks/plan/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs
    coding:
      on_context_load:
        - hooks/coding/author.md
      post_check:
        - hooks/coding/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs
    review:
      on_context_load:
        - hooks/review/author.md
      post_check:
        - hooks/review/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs
    ut:
      on_context_load:
        - hooks/ut/author.md
      post_check:
        - hooks/ut/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs
    testing:
      on_context_load:
        - hooks/testing/author.md
      post_check:
        - hooks/testing/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs

  phase_rules_overlays:
    spec: rules/spec-rules.overlay.yaml
    plan: rules/plan-rules.overlay.yaml
    coding: rules/coding-rules.overlay.yaml
    review: rules/review-rules.overlay.yaml
    ut: rules/ut-rules.overlay.yaml
    testing: rules/testing-rules.overlay.yaml
