schema_version: "1.0"
name: wallet-sdk-demo
# 版本随机制行为走：目标工程升上来会看到不同的产物形态与报错集合，就是 minor。
# 2.0.0：送去独立审查的是当前 Story 的完整正文一次给全，审查方法与输出要求只在规则
#        覆盖里维护一份；交付按审查的实际结论放行，本宿主没登记审查员时如实记一笔
#        「未经读者语义审查即交付」，不再静默通过。材料里每张图各自成为作者的一件事，
#        清单形状不对报缺口而不是报「没有图」；S4 覆盖前的上游原件成为一份独立材料，
#        进材料清单与来源检查。附录与评审记录的机器区逐行与真源比对，被手改时报出差在
#        哪一行并给出重新生成的出口；必需来源缺失不再当合法空投影。章提交先核后写，
#        正文之外的字节原样保留，写成功的一章不再被报成失败。公共脚本按功能分子目录
#        （flow / materials / story / knowledge-use），对外命令、参数与产物路径不变。
# 1.8.0：公共机制不再往 `AR/` 根下写辅助文件——流程契约、需求分析件、导入落点搬进
#        `AR/story-src/`，根下只剩三份交付文档与对接层写的单据身份，check 加一条守它。
#        脚本按所有权分两个目录：公共的在 `scripts/core/`，目标仓自己实现的三个在
#        `scripts/adapters/`；升级换 core、碰都不碰 adapters，确认靠一次 git diff。
#        知识按注册校验：清单为空就是这个仓还没配置知识，链条照走；登记了读不到仍然报错。
# 1.7.0：上游（系统设计与 spec）画过的图都要搬进 story，身份是它在上游的位置、
#        来源写在围栏第一行，缺了报的是那张图讲的那件事；图只引正文讲到的，
#        图连图与图前没有承接句都报；§9 的表外段落与落点验真在真实产物上不再误报；
#        5.x 与 9.3 的标签换成人话并一律照核；不属于本需求的图不进正文，
#        它为什么不用登记在材料清单里（`--caption-image … --unused`，按图的内容存，
#        改名或换落点都还在），附录的材料清单只列上游正文与收件箱原件；
#        登记收成一个动作（project / number / build / check）；
#        交付门通过后停下问归档还是进 plan；附录·改动边界是一张
#        「模块 | 本单怎么动 | 依据」表（Scope 的说明原文引在表下，机器区不留作者占位），
#        9.4 交付物成表「交付物 | 给谁 | 做什么用 | 什么时候要」，
#        5.x 三段各带一句「这一段该答什么」；图的路径参数只认相对工程根；
#        任务包给一条最小的 acceptance 条目；人回「补充材料」后下一步按料的现状给出，
#        第 2 轮起提补料请求要写清还缺什么、为什么现有材料不够。
# 1.6.0：作者要求由作者动笔前自己取（原则页 hooks/<phase>/author.md，spec 另有一条命令出
#        本次任务包），不再登记宿主的作者事件——那个事件只进 verifier 上下文；
#        读者审查的报告改读调用方写出的 MD（落点在 summary.verifier_report），
#        核对时点从 post_check 挪到 check --deliver 交付门；不再依赖任何 framework 补丁。
# 1.5.0：作者在章草稿上写（skeleton 生成 AR/story-src/drafts/，chapter 消费草稿）；附录 A–D 是
#        spec §9 与 knowledge-use.yaml 的机器投影（story-build project，落盘与登记各投一次）；
#        材料关卡按轮次与本级侧车判停，侧车带 gate 字段；导入加 IMAGES 档（只抽图不动正文）；
#        章节合同带 form（主形态 + 机器核的槽位），check 加 ⑪ 形态守恒与 ⑫b 集合核；
#        story-template.md 退场；verifier PASS 之后直接 check-receipt → archive，不再跑 harness。
# 1.4.0：adapt 带上扩展依赖的 framework 补丁（framework-patch.yaml）。
# 1.3.0：形态判据从「这一章有没有图」换成「分了几张画了几张」、归档件禁用词按结构分区收窄、
#        术语核主名不核括注、报错按判据类分组。
version: "2.0.0"
description: 实例扩展包（story 需求流程 + 三类知识 + 生命周期钩子）
provides:
  skills:
    - story
    - story-adaptation

  # 扩展自有的宿主入口文件。升级直接覆盖、首次安装写入——它们是本扩展的产物，
  # 不是目标工程的。宿主目录里的**其它**东西一概不在覆盖范围。
  #
  # 登记在这里而不是写进 adapt 脚本的常量里：多一个宿主就多一行数据，机制不动。
  bridges:
    - .cac/commands/story.md
    - .claude/commands/story.md
    - .codex/skills/story/SKILL.md
    - .opencode/skill/story/SKILL.md

  # 知识激活清单（确定性）：**阶段只读这里列出的文件**，不扫描 knowledge/ 目录——
  # 目录里躺着的未登记文件，任何阶段都读不到。
  #
  # **一份清单，不设第二份**：「这个文件属于哪类知识」写在文件自己的 frontmatter
  # （`kind: facts | constraints | patterns | index`），不在这里再分一次组。
  # 两份清单意味着两处要同步，改一处忘另一处就是静默漂移——而它们本来就该是同一件事。
  #
  # `kind: index` 是索引件（目录的字段模型、模式的路由与粒度定义）：随清单交付、
  # 可被引用，但不承载条目，因此不参与条目与模式的派生。它**不是第四类知识**——
  # 说明性文档不形成新的知识类型。
  #
  # 域前缀、条目清单、模式标识与角色由 hooks/shared/knowledge.mjs 从各文件的
  # frontmatter 与正文派生，机制层不维护第二份清单；派生为空会响亮报错，不会静默退化成空集。
  knowledge:
    - knowledge/README.md
    - knowledge/facts/README.md
    - knowledge/facts/component-profile.md
    - knowledge/facts/codebase-facts.md
    - knowledge/constraints/README.md
    - knowledge/constraints/ux-consistency.md
    - knowledge/constraints/security-privacy.md
    - knowledge/constraints/dfx-baseline.md
    - knowledge/constraints/observability.md
    - knowledge/constraints/resource-usage.md
    - knowledge/constraints/compatibility-checklist.md
    - knowledge/constraints/env-exceptions.md
    - knowledge/constraints/deliverables.md
    - knowledge/design-patterns/README.md
    - knowledge/design-patterns/decision-tree.md
    - knowledge/design-patterns/page-interaction.md

  # 挂载分步进行：manifest 里任何一条路径不存在，加载器会**清空全部 provides**
  # （全有全无，不降级），所以只登记已交付的钩子。
  #
  # 这里登记的两个事件各有各的消费者，别混：
  #   post_check   → 门禁，产物落盘之后；
  #   pre_verifier → verifier 的上下文。
  #
  # **作者要求不在这里登记**：宿主把这份清单里的作者事件只用在装配 verifier 上下文上，
  # 它从不进入作者动笔前的上下文，登记在那里等于没送到。本扩展的作者要求由
  # `hooks/<phase>/author.md`（原则页）与 `hooks/spec/author.mjs`（本次任务包）承载，
  # 作者动笔前自己跑命令取；入口写在 SKILL、CLAUDE.md 扩展段与 `story_flow.py status`
  # 的下一步文本里。
  hooks:
    spec:
      post_check:
        - hooks/spec/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs
    plan:
      post_check:
        - hooks/plan/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs
    coding:
      post_check:
        - hooks/coding/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs
    review:
      post_check:
        - hooks/review/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs
    ut:
      post_check:
        - hooks/ut/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs
    testing:
      post_check:
        - hooks/testing/post_check.mjs
      pre_verifier:
        - hooks/shared/pre_verifier.mjs

  phase_rules_overlays:
    spec: rules/spec-rules.overlay.yaml
    plan: rules/plan-rules.overlay.yaml
    coding: rules/coding-rules.overlay.yaml
    review: rules/review-rules.overlay.yaml
    ut: rules/ut-rules.overlay.yaml
    testing: rules/testing-rules.overlay.yaml
