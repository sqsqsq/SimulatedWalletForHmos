# SSOT: 模块画像目录 (Module Catalog)
# 由 Skill 0 · Phase A (`/catalog-bootstrap <ModuleName>`) 逐模块追加
schema_version: "1.0"
modules:
  - name: "CommFunc"
    layer: "05-SystemBase"
    sub_layer: "CommFunc"
    format: "HAR"
    one_liner: "系统侧通用能力封装：轻量日志（hilog）、字符串/账号脱敏工具，以及宿主 `Navigation` 用 `NavPathStack` 的全局挂载点（`NavPathContext`），供上层 HAR 引用。"
    responsibilities:
      - "通过 `Logger` 向各模块提供统一的 `hilog` 封装，统一 DOMAIN，降低重复样板代码。"
      - "通过 `FormatUtil` 提供手机号/通用账号的脱敏与展示用格式化，供业务侧展示层复用。"
      - "通过 `NavPathContext` 为使用 `Navigation` + `NavPathStack` 的工程提供**宿主挂载的栈引用**（`attach` / `stack`），供 `NavDestination` 等无法 `@Link` 的子树安全调用 `pushPath` / `pop`；**不**承载路由表、页面名常量或业务跳转策略（由 Product/Feature 定义）。"
      - "作为 05-SystemBase 中 **CommFunc 子层** 成员，在子层规则下不依赖 `CommUI`，可被 `CommUI` 与其它外层模块依赖（按架构 DSL 允许的层间边）。"
    NOT_responsible_for:
      - "不负责具体业务页面、`main_pages` / `route_map` 等路由表或「跳转到哪一屏」的产品决策；`NavPathContext` 仅持有宿主已绑定的 `NavPathStack` 引用，不替代 Feature 内的页面与导航命名。"
      - "不负责可交互 UI 与视觉资源；若 PRD 描述「页面/组件/动效」等，应落在 Feature/Product 或同层 `CommUI` 模块，而非在 `CommFunc` 新造 UI。"
      - "不负责卡、账户、交易、设备指纹等业务域逻辑与数据持有；`CommFunc` 只提供与业务无关的通用技术能力。"
      - "不负责为单一 Feature 定制业务 DTO/Repository/领域服务；此类能力应落在对应 `02-Feature` 或 `04-BusinessBase` 模块的 domain 层。"
    typical_business_terms:
      - "系统功能封装"
      - "通用日志"
      - "脱敏"
      - "工具类"
    easily_confused_with:
      - module: "CommUI"
        disambiguation: |
          若 PRD/设计描述的是**无界面的**日志、脱敏、纯工具类 API → 选 **CommFunc**（本模块）。
          若描述的是**可复用 UI 组件/布局/动效/资源**、或与用户可见界面强相关 → 选 **CommUI**。
          子层硬规则：CommUI 可依赖 CommFunc；**CommFunc 不依赖 CommUI**；若 import 方向违反，应先怀疑分层边界而非合并两模块职责。
      - module: "AccountManager"
        disambiguation: |
          若只涉及 `Logger` / `FormatUtil` 等**与登录会话、Profile 无关**的纯工具能力 → 选 **CommFunc**（本模块）。
          若涉及**登录/登出、`UserProfile` / `LoginState` / `AppStorage` 中账号键、`AccountService` 单例** → 选 **AccountManager**。`AccountManager` 可依赖本模块；**禁止**在 `CommFunc` 内持账号业务状态。
      - module: "WalletMain"
        disambiguation: |
          **脱敏/日志/与 Tab·卡包无关的纯技术工具** → **CommFunc**（本模块）。
          **钱包首页/我的/卡包/添卡、服务宫格、卡引导与 feature 内仓库** → **WalletMain**；`WalletMain` 可依赖本模块，**禁止**在 `CommFunc` 中实现主功能业务页或卡种流程。宿主全局 `NavPathStack` 挂载可经本模块 `NavPathContext`，具体 `pushPath` 的页面名仍属各 Feature。
    key_exports:
      - "Logger"
      - "FormatUtil"
      - "NavPathContext"
    entry_file: "05-SystemBase/CommFunc/src/main/ets/index.ets"

  - name: "CommUI"
    layer: "05-SystemBase"
    sub_layer: "CommUI"
    format: "HAR"
    one_liner: "公共可复用 ArkUI 组件与轻量主题/Toast（`presentation/components` + `shared/theme`），为 Feature/Product 提供**无业务专名**的基础 UI 积木；通过 `oh-package` **单向依赖**同层 `CommFunc`，满足 **CommUI → CommFunc** 子层边。"
    responsibilities:
      - "导出通用 ArkUI 组件（当前：`ActionListItem`、`SectionCard`），以 `@Component` / `@BuilderParam` 等形式供上层拼装业务页面。"
      - "导出 `CommColors`，与 `app.color.*` 等资源 token 对齐，供引用侧保持公共主题语义。"
      - "导出 `showToast`（`ToastUtil`：`promptAction.showToast`，duration 固定示例值）；`try/catch` 空处理表示**非 UI 上下文时静默**，属于 Toast 封装预期，**不是**业务日志替代方案。"
      - "通过 `oh-package` 声明 `file:../CommFunc`，在工程上与「CommUI 子层可依赖 CommFunc；CommFunc 不依赖 CommUI」一致。"
    NOT_responsible_for:
      - "不负责完整业务页、**多 Tab 主框架、根 `Navigation`/`NavPathStack` 壳、`NavPathContext.attach`**；若 PRD 描述主导航壳或栈宿主，应落在 **`Phone` / `WalletMain`**，而非在本模块堆业务路由。"
      - "不负责卡列表、卡详情、金融字段校验等**带钱包/账号领域语义**的业务 UI；公共组件可被引用，但**业务态组件与领域数据绑定**落在 **`WalletMain`** 等 feature presentation。"
      - "不复制 **`CommFunc`** 的 `Logger`、脱敏与纯工具 API；无界面能力继续走 **`CommFunc`** 导出入口。"
    typical_business_terms:
      - "公共 UI 组件"
      - "主题色"
      - "通用列表项"
      - "区段卡片"
      - "Toast"
    easily_confused_with:
      - module: "CommFunc"
        disambiguation: |
          **ArkUI 组件 / `CommColors` / `showToast` 界面反馈** → **CommUI**（本模块）。
          **hilog、`FormatUtil`、与界面无关的工具** → **CommFunc**。
          依赖：`CommUI` → `CommFunc` ✅；反向 ❌。
      - module: "AccountManager"
        disambiguation: |
          **无账号语义的 UI 积木 / 主题 / Toast** → **CommUI**。
          **`AccountService`、`UserProfile`、`LoginState`、AppStorage 账号键** → **AccountManager**。禁止在本模块 `@Component` 内写账号单例或改账号存储。
      - module: "WalletMain"
        disambiguation: |
          **无业务名状的**通用 ListItem、Section、主题 token、Toast → **CommUI**（本模块）。
          **卡包/添卡/首页/我的**等钱包主路径、页面编排与 `HomeTabPage` / `buildCardPackPage` 等 → **WalletMain**；可 import 本模块拼层，**带「钱包主 feature」语义的专页**归属 `02-Feature/WalletMain`。
      - module: "Phone"
        disambiguation: |
          **`ActionListItem` / `SectionCard` / `showToast` / `CommColors` 等可复用积木** → **CommUI**（本模块）。
          **`PhoneAbility`、`loadContent`、根 `Navigation`/`Tabs`、`NavPathContext`、`navDestination`、HAP 装配** → **Phone**；壳页 import 本模块组合 UI，**不等价**本模块承担入口壳职责。
    key_exports:
      - "CommColors"
      - "showToast"
      - "ActionListItem"
      - "SectionCard"
    entry_file: "05-SystemBase/CommUI/src/main/ets/index.ets"

  - name: "AccountManager"
    layer: "04-BusinessBase"
    sub_layer: null
    format: "HAR"
    one_liner: "跨 Feature 的账号域能力：基于 **AppStorage** 的登录态、展示账号、`UserProfile` 与可订阅的 **`LoginState` 流水线**（含登录中过渡态）；`AccountService` 为单例入口；登录流现阶段为可替换的**模拟实现**（注释指向华为账号 Kit）。"
    responsibilities:
      - "以 `AccountService` 单例（`getInstance`）管理登录/登出、`getUserProfile`、`onLoginStateChanged` / `offLoginStateChanged`；首次实例化执行 **`initStorage()`**，为 `AccountConstants` 声明的键补齐缺省值。"
      - "`login()` 先 **`notify(LoginState.LOGGING_IN)`**，经异步占位后再写入 `STORAGE_IS_LOGGED_IN` / `STORAGE_DISPLAY_ACCOUNT`（展示串经 **`CommFunc.FormatUtil.maskPhone`**），最后 **`notify(LoginState.LOGGED_IN)`**；`logout()` 清理存储并 **`notify(LoginState.NOT_LOGGED_IN)`**；`notify` 同步更新 **`STORAGE_LOGIN_STATE`** 并广播监听。"
      - "维护 `UserProfile`、`LoginState` 与 `AccountConstants` 存储键语义，保证「是否登录、展示用账号串、枚举态」在应用内可查询、可恢复。"
      - "在登录路径中调用 `CommFunc` 的 `FormatUtil` 生成**展示用脱敏串**，仅负责**何时写入**；脱敏算法演进归 **`CommFunc`**。"
    NOT_responsible_for:
      - "不负责钱包首页/卡包/添卡等行业 Feature 的**页面编排、二级路由 `pushPath`、宿主 `Navigation`/`Tabs` 壳或 `NavPathContext.attach`**；这些归 **`WalletMain` / `Phone`**，本模块只提供账号领域 **API + AppStorage 真理** 供 UI 引用。"
      - "不负责华为账号 Kit 的完整接入、OAuth 页面与合规弹窗 UX；当前为**模拟登录**（源码注释已声明可替换），**禁止**在 PRD 中默认等同生产级 Huawei ID。"
      - "不负责通用 ArkUI 组件、主题、纯 Toast；无账号语义的视觉与动效归 **`CommUI` / `CommFunc`**。"
      - "不承担生产环境「卡发行、支付清算、NFC/SE 实卡管理」等线下业务；当前账号流亦为演示向模拟，与真实支付/合规落地之间的 gap 须由产品拆需求后再落到 **`WalletMain`** 或其它业务模块，**不可默认本模块单独等于生产钱包账号中台**。"
    typical_business_terms:
      - "账号管理"
      - "登录"
      - "登出"
      - "我的账号"
      - "未登录"
    easily_confused_with:
      - module: "CommFunc"
        disambiguation: |
          若只讨论 **`FormatUtil.maskPhone` 等纯工具**、与「是否已登录、`LoginState`、监听回调」无关 → **CommFunc**。
          若讨论 **AppStorage 账号键、`AccountService`、登录/登出生命周期与 `UserProfile`** → **AccountManager**（本模块）。本模块可依赖 `CommFunc`，不要反过来。
      - module: "CommUI"
        disambiguation: |
          **列表项/主题色/Toast 等可复用 UI 积木** → **CommUI**。
          **登录态写入、展示账号串、`LoginState` 订阅** → **AccountManager**（本模块）。不要在 `CommUI` 组件实现里藏 `AccountService` 单例逻辑。
      - module: "WalletMain"
        disambiguation: |
          **`AccountService` / `UserProfile` / AppStorage 账号键 / 登录订阅** → **AccountManager**（权威域）。
          **「我的」页布局、Tab 跳转、`MineTabPage` 编排** → **WalletMain**；页面调用本模块 API，**真理仍在** `AccountManager`。
      - module: "Phone"
        disambiguation: |
          **账号模型、存储键、`login`/`logout`、`LoginState` 枚举与监听** → **AccountManager**（本模块）。
          **`PhoneAbility`、`loadContent`、根 `Navigation`/`Tabs`、`NavPathContext.attach`、`navDestination`** → **Phone**；入口 HAP **不**复制账号域实现，仅装载壳与子页。
    key_exports:
      - "AccountConstants"
      - "LoginState"
      - "UserProfile"
      - "AccountService"
    entry_file: "04-BusinessBase/AccountManager/src/main/ets/index.ets"

  - name: "WalletMain"
    layer: "02-Feature"
    sub_layer: null
    format: "HAR"
    one_liner: "钱包**主 feature**：导出首页/我的 Tab 子页与卡包/添卡等 `@Builder` 二级页；`HomeTabPage` 通过 **`@Link navPathStack`** 使用与宿主根 `Navigation` 同源的栈调用 `pushPath`（路由名与 **`Phone`** 根页 `navDestination` 一致）；presentation 编排卡引导、服务宫格、活动轮播等，并组合 `AccountManager` / `CommUI` / `CommFunc`（数据当前多为本地 Repository 样例）。"
    responsibilities:
      - "对外导出 `HomeTabPage`、`MineTabPage` 及 `buildCardPackPage` / `buildAddCardEntryPage`，供 **`Phone`** 等宿主通过 `index.ets` 装配；其中首页 Tab **必须**以 **`@Link navPathStack`** 绑定与宿主 `Navigation` **同源**的 `NavPathStack`（代码注释约束：禁止 `@Prop`，避免 `pushPath` 丢句柄）。"
      - "在首页等路径使用 `navPathStack.pushPath({ name: 'CardPackPage' | 'AddCardEntryPage' })` 与宿主壳 `navDestination` 映射对齐；二级页由本模块 `@Builder` 导出，由宿主注册而非在本模块内自建平行 `Navigation` 根。"
      - "在 `MineTabPage` 等场景集成 `AccountService` / `UserProfile` / `LoginState`（来自 `AccountManager`），在「我的」里呈现登录/展示账号，但**不替代** `AccountManager` 内的会话与存储实现。"
      - "维护 `HomeRepository` / `MineRepository` / `CardRepository` 等同 feature 的读模型与 Mock/本地数据，支撑首页、我的、卡包、添卡等 UX；业务模型如 `ServiceEntry` / `CardCategory` / `PromoInfo` 等以本 feature 为归属。"
      - "在页面与业务组件中组合 `CommUI` 的 `ActionListItem` / `SectionCard` / `showToast` 等，与 feature 内 `AccountCard` / `CardGuideSection` / `ServiceGridSwiper` 等区分**通用积木 vs 带钱包语义的 feature 组件**。"
    NOT_responsible_for:
      - "不负责应用级入口（EntryAbility、窗口态、HAP 级配置与签名）及根壳层的 **`Navigation` / `Tabs` / `NavPathContext.attach`**；宿主壳与多模块装配归 **`01-Product` / `Phone`**，本模块 Tab 页仅消费传入的 **`@Link navPathStack`** 并调用 `pushPath`。"
      - "不负责**跨 Feature 的账号域 API 与 AppStorage 键语义**的单独权威定义；登录/登出与 `UserProfile` 真理来源是 **`AccountManager`**，本模块只在其 UI 中调用与展示。"
      - "不复制 **`CommUI`** 的通用无业务组件为「第二套设计系统」；可扩展布局但不应把**纯通用**的列表项/色板实现再实现一遍。"
      - "不承担生产环境「卡发行、支付清算、NFC/SE 实卡管理」等线下业务；当前代码偏演示/模拟，与真实支付落地之间的 gap 须由产品拆需求后再落到本模块或独立业务模块，**不可默认本模块已等于生产卡系统**。"
    typical_business_terms:
      - "钱包主功能"
      - "卡包"
      - "添卡"
      - "首页"
      - "我的"
    easily_confused_with:
      - module: "AccountManager"
        disambiguation: |
          若讨论 **`AccountService` / 登录与登出 / `UserProfile` / `LoginState` / AppStorage 中账号态** 的**领域服务与数据模型** → **AccountManager**（权威域）。
          若讨论**「我的」页怎么摆、和首页如何跳转、卡包/添卡流程 UI** 等**feature 内页面与路由编排** → **WalletMain**（本模块），即使代码里在「我的」调用了 `AccountService`。
      - module: "CommUI"
        disambiguation: |
          可复用、无钱包业务名状的 **ListItem/卡片容器/主题色/Toast** → **CommUI**。
          **卡引导、卡分类列表、与「卡包」强绑定的 feature 专页/区块** → **WalletMain**；可 import `CommUI`，但**业务组件与数据绑定**的归属在仓库路径 `02-Feature/WalletMain`。
      - module: "CommFunc"
        disambiguation: |
          **纯工具与日志/脱敏**、与卡包/首页/我的的**产品语义**无关 → **CommFunc**。
          与**钱包 Tab、卡种入口、服务宫格/活动与导航 `pushPath` 的业务语义**强相关 → **WalletMain**；**`NavPathContext.attach` 与全局栈挂载**仍属宿主 **`Phone` + `CommFunc`**，勿把栈宿主误判为本模块。
      - module: "Phone"
        disambiguation: |
          **卡种/服务宫格/卡包/添卡、`pushPath` 触发点、feature 内 Repository 与用例** → **WalletMain**（本模块）。
          **Entry HAP、`PhoneAbility`、`loadContent`、根 `Navigation`+双 Tab 壳、`NavPathContext.attach`、`navDestination` 注册二级 `@Builder`** → **Phone**；`Phone` 的 `pages/index` 从本模块 import 子页并传入 **`@Link`** 栈，**本模块不实现** Ability 与 HAP 壳。
    key_exports:
      - "HomeTabPage"
      - "MineTabPage"
      - "buildCardPackPage"
      - "buildAddCardEntryPage"
    entry_file: "02-Feature/WalletMain/src/main/ets/index.ets"

  - name: "Phone"
    layer: "01-Product"
    sub_layer: null
    format: "HAP"
    one_liner: "应用**入口 HAP**：`PhoneAbility` 作为 UI 宿主加载 `pages/index`，在独立模块内完成 `Navigation` + 双 Tab 壳，并从 `WalletMain` 拉取 `HomeTabPage` / `MineTabPage` 与二级页 builder；根页在 `aboutToAppear` 中通过 `CommFunc` 的 `NavPathContext.attach` 绑定全局 `NavPathStack`，供子页栈式导航；**不实现**卡种/服务数据与账号域，仅做壳与多 HAR 依赖聚合。"
    responsibilities:
      - "维护 `PhoneAbility`（`UIAbility`）：`onWindowStageCreate` 中 `loadContent('pages/index', …)`，并处理颜色模式、窗口与生命周期中的通用日志点。"
      - "在 `pages/index.ets` 中声明 `@Entry` 根 `Navigation(this.navPathStack)` + 底部 `Tabs`（首页/我的）；`aboutToAppear` 调用 `NavPathContext.attach(this.navPathStack)`（来自 `@aspect/CommFunc`），向 feature 子树暴露与宿主一致的栈引用；`navDestination` 映射 `CardPackPage` / `AddCardEntryPage` 至 `WalletMain` 的 `buildCardPackPage` / `buildAddCardEntryPage`。"
      - "通过 HAP 级 `oh-package` 声明对 `WalletMain`、`AccountManager`、`CommUI`、`CommFunc` 的依赖，在工程上固定「产品壳拉 feature + 基座」的装配图。"
      - "声明 `PhoneBackupAbility` 扩展能力（`type: backup`）及 `backup_config` 元数据，满足备份扩展的技术挂载点；**备份策略细节**以配置与系统契约为准。"
    NOT_responsible_for:
      - "**不负责**首页服务宫格、活动轮播、卡包列表、我的页金融入口等**业务数据与用例**；此类归属 **`WalletMain` 的 Repository 与 feature 子页**。"
      - "**不负责** `AccountService` / 登录态 / `UserProfile` 的域模型与存储；`Index` 仅消费 `WalletMain` 中已接好的「我的」页，**不**在 HAP 内复制账号领域逻辑。"
      - "**不定义**可跨应用复用的通用 `ActionListItem` / 主题等；继续由 **`CommUI` / `CommFunc`** 提供，本壳只做页面级装配。"
      - "不承担发布渠道、分账、真机 SE 等**渠道与合规**决策；HAP 仅持工程级配置与能力声明。"
    typical_business_terms:
      - "主应用"
      - "应用入口"
      - "启屏"
      - "底 Tab"
    easily_confused_with:
      - module: "WalletMain"
        disambiguation: |
          若讲 **应用 Ability、窗口与 `loadContent`、HAP 依赖声明、多 Tab 的壳层 `Navigation`、入口 `@Entry`、`NavPathContext` 挂载栈** → **Phone**（本模块）。
          若讲 **首页/我的内具体卡引导、服务宫格数据、`buildCardPackPage` 业务 UI、`HomeRepository` 等** → **WalletMain**；`Phone` 的 `Index` 只 **import 并放置** 这些 export，不承载 feature 内仓库与用例实现。
      - module: "AccountManager"
        disambiguation: |
          **入口壳、`PhoneAbility`、`Navigation`/`Tabs`、`NavPathContext.attach`、`navDestination`、HAP 级依赖聚合** → **Phone**（本模块）。
          **`AccountService`、AppStorage 账号键、`login`/`logout`、`LoginState`、`UserProfile` 真理** → **AccountManager**；本模块仅 **依赖并装载**含账号 UI 的子页，**不**在 HAP 内复制账号领域实现。
