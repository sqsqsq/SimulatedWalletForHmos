# SSOT: 模块画像目录 (Module Catalog)
# 用途：业务自然语言 ↔ 技术模块的权威映射源之一
# 维护方式：由 Skill 0 · Phase A (`/catalog-bootstrap <ModuleName>`) 逐模块追加
#           AI 绝不直接写入本文件，除非拿到用户在对话里的 `y` 确认
# 骨架由 Skill 0 Step 0 创建；模块卡片陆续通过 catalog-staging → 合并 进来

schema_version: "1.0"
modules:
  - name: "CommFunc"
    layer: "05-SystemBase"
    sub_layer: null
    format: "HAR"
    one_liner: "系统功能封装：log 能力、LiveData 基础能力、状态机、决策树、通用 util 类等"
    responsibilities:
      - "封装 hilog 提供 Logger 静态方法（info / error 等），供全工程统一打日志"
      - "提供通用格式化工具类（FormatUtil 当前包含 maskPhone / maskAccount 等脱敏能力）"
      - "（架构规划）提供 LiveData 基础能力、状态机、决策树等与业务无关的系统工具（当前代码尚未落地，仅作为未来扩展位）"
    NOT_responsible_for:
      - "任何与业务相关的数据结构或服务（账号、卡、消息等一概不归它管）"
      - "UI 组件（弹框 / 列表 / 卡片等属 CommUI；注意 CommUI 可以反向依赖 CommFunc，但 CommFunc 自身不提供任何 UI）"
      - "网络 / 持久化 / NFC 等中间层能力（属 03-CommonBusiness 的 NetworkManager / DataPersistenceMng / NFCManager，与本模块无关）"
    typical_business_terms:
      - "通用工具"
      - "日志"
      - "log"
      - "脱敏工具"
      - "格式化"
      - "系统基础能力"
    easily_confused_with:
      - module: "CommUI"
        disambiguation: |
          判定规则（以"产物能否被 ArkUI 渲染出来"为锚）：
          - 产物是**可渲染的 UI**（Toast / 弹框 / 颜色资源 / ArkUI 组件 / 主题色常量） → 属 CommUI
          - 产物是**纯数据或方法**（Logger / 脱敏工具 / 格式化 / 状态机 / LiveData / 决策树 / 普通 util 类） → 属 CommFunc
          典型反例：
          - "日志级别的文字颜色常量" → 问自己：它是为了让 UI 渲染？若是 → CommUI（因为只有 UI 会消费）。若纯为了日志输出控制 → CommFunc。
          - "Toast 文案格式化工具"（如"保留 N 位数字 + 加千分符"）→ 工具本身是纯函数 → CommFunc；但若封装成 `showFormattedToast()` 这样的 UI 调用 → CommUI。
          依赖方向佐证：CommUI → CommFunc 单向，若你准备写的东西需要 import CommUI 的符号才能实现 → 绝不能放 CommFunc。
    key_exports:
      - "Logger"
      - "FormatUtil"
    entry_file: "05-SystemBase/CommFunc/src/main/ets/Index.ets"

  - name: "CommUI"
    layer: "05-SystemBase"
    sub_layer: null
    format: "HAR"
    one_liner: "公共 UI 组件：NavDestination 基础页面组件、弹框、Toast、卡片组件、滑动组件等与业务无关的基础组件"
    responsibilities:
      - "提供无业务语义的通用 UI 组件（当前含 ActionListItem 列表项、SectionCard 卡片容器、showToast 等），供上层模块复用"
      - "维护统一的主题色与视觉常量（CommColors / app.color.*），让整个钱包 UI 风格一致"
      - "封装 ArkUI promptAction 等系统 UI API，屏蔽 UIContext 缺失等边界情况，向上提供稳定调用形态"
    NOT_responsible_for:
      - "任何业务数据或服务（卡 / 账号 / 消息等一概不归，这些属 02-Feature 或 03-CommonBusiness）"
      - "日志 / 工具方法（归 CommFunc；注意 CommUI 可调用 CommFunc，但反之不行）"
      - "承载业务逻辑的页面（如首页 / 卡包 / 设置页等完整页面属 02-Feature 的 WalletMain，CommUI 只提供构成页面的原子组件）"
    typical_business_terms:
      - "通用组件"
      - "公共组件"
      - "Toast"
      - "弹框"
      - "列表项"
      - "卡片容器"
      - "UI 组件库"
      - "主题色"
    easily_confused_with:
      - module: "CommFunc"
        disambiguation: |
          判定规则（以"产物能否被 ArkUI 渲染出来"为锚）：
          - 产物是**可渲染的 UI**（Toast / 弹框 / 颜色资源 / ArkUI 组件 / 主题色常量） → 属 CommUI
          - 产物是**纯数据或方法**（Logger / 脱敏工具 / 格式化 / 状态机 / LiveData / 决策树 / 普通 util 类） → 属 CommFunc
          典型反例（与 CommFunc 侧完全对称）：
          - "日志级别的文字颜色常量" → 若是为了让 UI 渲染 → CommUI；若纯为日志输出控制 → CommFunc
          - "Toast 文案格式化工具" → 纯函数 → CommFunc；封装成 `showFormattedToast()` → CommUI
          依赖方向佐证：CommUI → CommFunc 单向。若你在 CommFunc 里想 import CommUI 的符号 → 说明你放错了模块。
    key_exports:
      - "CommColors"
      - "showToast"
      - "ActionListItem"
      - "SectionCard"
    entry_file: "05-SystemBase/CommUI/src/main/ets/Index.ets"

  - name: "AccountManager"
    layer: "04-BusinessBase"
    sub_layer: null
    format: "HAR"
    one_liner: "华为账号管理：登录/登出行为管理、订阅登录状态变化、登录数据发布。封装华为账号登录 Kit API"
    responsibilities:
      - "封装登录 / 登出行为（AccountService 单例），目前沙盒版为模拟登录；未来对接华为账号 Kit"
      - "维护并对外发布登录状态（LoginState 枚举 + AppStorage），通过 listener 机制广播登录状态变化"
      - "提供当前用户资料查询（UserProfile），上层可据此渲染'我的'页面的账号区域"
      - "向外暴露 AccountConstants（如 STORAGE_IS_LOGGED_IN 等 key）作为订阅/读取的约定常量"
    NOT_responsible_for:
      - "UI 渲染（'我的'页面的具体布局归 02-Feature 的 WalletMain，AccountManager 只提供数据与状态流）"
      - "其它身份/证件相关业务（身份证 / 驾驶证属 02-Feature 的 IDCards，与华为账号登录无任何关系）"
      - "通用持久化框架（当前沙盒用 AppStorage；真实工程中的 KVStore / RelationalStore / Preference 管理属 03-CommonBusiness 的 DataPersistenceMng，本模块仅作为消费者）"
      - "'账户'一词有二义：指华为账号登录身份时归本模块；指钱包业务账户（余额 / 流水 / 账户中心等）时不归本模块——真实工程应另建 WalletAccount / 余额账户类模块承载，沙盒暂缺"
    typical_business_terms:
      - "账号"
      - "华为账号"
      - "登录"
      - "登出"
      - "登录态"
      - "登录状态"
      - "用户信息"
      - "账户"
    easily_confused_with: []
    key_exports:
      - "AccountConstants"
      - "LoginState"
      - "UserProfile"
      - "AccountService"
    entry_file: "04-BusinessBase/AccountManager/src/main/ets/Index.ets"

  - name: "WalletMain"
    layer: "02-Feature"
    sub_layer: "顶层"
    format: "HAR"
    one_liner: "钱包公共页面与入口聚合：首页 / 我的 / 卡包 / 添卡入口等非特定卡种业务页面"
    responsibilities:
      - "承载'首页'页面（HomeTabPage）：服务入口宫格、营销位、卡管引导等聚合视图"
      - "承载'我的'页面（MineTabPage）：账号区（依赖 AccountManager 订阅登录态）、金融服务、设置入口"
      - "承载'卡包'页面（CardPackPage）：卡片总览入口（卡片明细由各 02-Feature 底层卡种模块自己实现）"
      - "承载'添卡入口'页面（AddCardEntryPage）：导向不同卡种的添加流程，本模块只做分流、不实现具体添加逻辑"
      - "持有首页 / 我的相关的 Repository（HomeRepository / MineRepository）与模型（ServiceEntry / PromoInfo / FinanceEntry / SettingEntry）"
    NOT_responsible_for:
      - "任何具体卡种的业务逻辑（银行卡 / 交通卡 / 门禁卡等属 02-Feature 底层各卡种模块；WalletMain 只能调用它们或提供入口，不能代写其卡片增删改查）"
      - "登录 / 登出 / 登录态订阅等账号能力（属 04-BusinessBase 的 AccountManager；WalletMain 只作为消费方）"
      - "通用原子 UI 组件（ActionListItem / Toast / SectionCard 等归 CommUI；WalletMain 的 components/ 只放与钱包业务耦合的组合组件，如 AccountCard / CardCategoryList / PromoSwiper）"
      - "跨卡种的统一管理能力（如卡元数据聚合 / 统一订阅 / 功能代理——在真实工程里属 03-CommonBusiness 的 CardManager；沙盒目前无此模块）"
      - "应用级路由 / Tabs / Ability 注册（属 01-Product 的 Phone；WalletMain 只导出页面组件，由 Phone 负责挂载）"
      - "刷卡 / 二维码支付等跨卡种交互（属 02-Feature 中间层 SwipeCard；注意依赖方向是 WalletMain → SwipeCard，反向不允许）"
    typical_business_terms:
      - "首页"
      - "钱包首页"
      - "我的"
      - "我的页"
      - "个人中心"
      - "卡包"
      - "卡包页"
      - "添卡"
      - "添卡入口"
      - "添加卡片"
      - "设置"
      - "设置入口"
      - "金融服务"
      - "营销位"
    easily_confused_with: []
    key_exports:
      - "HomeTabPage"
      - "MineTabPage"
      - "buildCardPackPage"
      - "buildAddCardEntryPage"
    entry_file: "02-Feature/WalletMain/src/main/ets/Index.ets"

  - name: "Phone"
    layer: "01-Product"
    sub_layer: null
    format: "HAP"
    one_liner: "应用主入口：唯一的 HAP 模块，装壳所有 HAR 并对外发布一个可安装的应用"
    responsibilities:
      - "注册 PhoneAbility（UIAbility）作为应用 home entity 入口，挂载主窗口并加载 Index 页面"
      - "注册 PhoneBackupAbility 等 ExtensionAbility（备份能力）"
      - "在 Index 页面装配 Tabs（首页 / 我的）+ Navigation 路由，把 WalletMain 导出的 HomeTabPage / MineTabPage / buildCardPackPage / buildAddCardEntryPage 挂载成一个完整 App"
      - "作为最终打包产物承接所有 HAR 依赖（WalletMain / AccountManager / CommUI / CommFunc 等）"
    NOT_responsible_for:
      - "任何业务逻辑或具体页面内容（首页 / 我的 / 卡包 / 添卡等页面归 WalletMain；Phone 只负责'挂在哪个 Tab'、'Navigation 路由表'这种壳级事务）"
      - "登录 / 账号 / 卡 / 工具类等任何能力（下沉到各 HAR 模块；HAP 层不放任何可复用能力）"
      - "原子 UI 组件与主题（归 CommUI；HAP 层不声明组件）"
      - "跨卡种业务（刷卡 / 卡包明细 / 银行卡 / 交通卡等都在 02-Feature）"
    typical_business_terms:
      - "应用入口"
      - "App 入口"
      - "HAP"
      - "主 entry"
      - "主 Ability"
      - "Tabs"
      - "Navigation 路由表"
      - "应用启动"
      - "主窗口"
    easily_confused_with: []
    key_exports: []
    entry_file: "01-Product/Phone/src/main/ets/phoneability/PhoneAbility.ets"
