<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 420" width="1320" height="420" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>依赖与联调顺序</title>
