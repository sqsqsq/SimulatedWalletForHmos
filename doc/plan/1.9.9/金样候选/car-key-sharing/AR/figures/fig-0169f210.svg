<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 980" width="1040" height="980" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>发起主路径：从卡片入口到对方收到待接受钥匙</title>
<metadata><![CDATA[%% 图源 spec §5.1 #1
flowchart TD
    A[卡包车钥匙卡片点分享] --> G0{已登录、有车钥匙、开关开启}
    G0 -->|否| X[看不到入口或不能发起]
    G0 -->|是| B[分享设置：给谁]
    B --> C[查该对象可用的权限档位]
    C -->|对象不可分享| E[给原因，不呈现档位，换一个人]
    E --> B
    C -->|对象可分享| D[选权限与有效期]
    D --> Q{三项齐且配额未满}
    Q -->|配额已满| QF[发出置灰并给原因]
    Q -->|是| SV[保存原请求与幂等标识]
    SV -->|保存失败| SF[停在本页提示，不发送]
    SV -->|保存成功| F[带幂等标识创建分享]
    F --> H{车云返回}
    H -->|已建立| I[待接受：以车云返回为准]
    H -->|签发失败或其他明确拒绝| J[不留关系，清掉幂等标识，可再发]
    H -->|没得到回应| UK[结果未知：留着原请求，回来先确认]
]]></metadata>
