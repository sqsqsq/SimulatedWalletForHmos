<text x="400" y="759.0" font-size="14" fill="#4a3b00" text-anchor="middle">管待接受的分享多久没人添加就作废，</text>
<text x="400" y="778.0" font-size="14" fill="#4a3b00" text-anchor="middle">不是撤销前要等的时间</text>
