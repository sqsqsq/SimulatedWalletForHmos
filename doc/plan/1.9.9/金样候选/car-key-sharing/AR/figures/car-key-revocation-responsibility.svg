<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 850" width="1720" height="850" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>撤销时的分享、车辆与卡片：受理那一刻车辆就拒绝，卡片稍后收回</title>
<metadata><![CDATA[综合阅读图 car-key-revocation-responsibility（数字车钥匙分享：撤销时的分享、车辆与卡片）
依据（业务事实以这些位置为准，本图只把它们放到同一视图）：
- AR/story.md 2.1 术语「宽限」与易混项「卡片还在不等于还能用车」「72 小时与 48 小时是两种计时」
- AR/story.md 4.2 规则表「撤销」行（D1）；6.3 分享状态与双方可用动作（生命周期图、状态表与撤销规则）；5.4 车主管理、撤销与重新发起
- AR/story.md 1.4 还没定的三件事（D5、D8）
- 系统设计 SR §3 分享状态机后的说明：撤销中期间车辆侧已按车厂云下发的失效指令拒绝该钥匙，宽限只影响对方卡片的消失时间
- spec/spec.md 撤销相关规则、`revokeKeySharing` 的 revoked / revoking 与 graceHours
横向只表示先后，不按时间比例。不是任何一张 Mermaid 的等值副本；改动依据后重画并重做独立审查。
]]></metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55607a"/></marker></defs>
