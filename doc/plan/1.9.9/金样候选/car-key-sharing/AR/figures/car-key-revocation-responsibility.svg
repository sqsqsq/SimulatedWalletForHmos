<text x="360" y="200.5" font-size="14" fill="#3a1f60" text-anchor="middle">这里只画生效分享的撤销</text>
<rect x="391.5" y="284.5" width="57.0" height="35" rx="18" fill="#e6f6ea" stroke="#3f9a5a" stroke-width="1.5"/>
