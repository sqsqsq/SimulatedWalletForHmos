<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" width="1180" height="460" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>分享状态机：六个状态与迁移条件</title>
<metadata><![CDATA[%% 图源 SR §3 #1
%% 图源 spec §5.2 #1
flowchart LR
    P[待接受] -->|对方接受| A[生效]
    P -->|72 小时未接受| E[已作废]
    A -->|有效期满| X[已到期]
    A -->|撤销·对方在线| R[已撤销]
    A -->|撤销·对方离线| RP[撤销中]
    RP -->|对方回网或 48 小时到| R
]]></metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55607a"/></marker></defs>
