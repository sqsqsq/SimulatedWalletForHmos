<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="1160" height="760" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>发起分享的时序：查权限、创建与签发</title>
<metadata><![CDATA[%% 图源 SR §2 #1
sequenceDiagram
    actor O as 车主
    participant W as 钱包端
    participant C as 车云
    participant M as 车厂云
    participant G as 接受方钱包
    O->>W: 选定要分享给谁
    W->>C: 查这个对象能给哪几档权限
    C-->>W: 该对象可用的权限档位
    Note over W: 权限区按返回的档位呈现；换对象则重新查
    O->>W: 选好权限、有效期，确认发出
    W->>C: 创建分享（带幂等标识）
    C->>M: 请求签发凭据
    alt 车厂云签发成功
      M-->>C: 凭据就绪
      C-->>W: 分享已建立（待接受）
      C->>G: 经推送送达待接受钥匙
      Note over C,G: 推送没送到不改变创建结果；本期推送不接入，对方从卡包补拉
    else 车厂云签发失败
      M-->>C: 失败
      C->>C: 回滚分享关系
      C-->>W: 建立失败，提示可重试
    end
]]></metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55607a"/></marker></defs>
