<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>被分享人接受：卡包显示与添加后的状态重取</title>
<metadata><![CDATA[%% 图源 spec §5.3 #2
flowchart TD
    A[进入卡包] --> B[按当前账号取收到的分享]
    B -->|待接受| P[显示待添加]
    B -->|生效| L[可用的钥匙卡片]
    B -->|撤销中| R[卡片保留到收回完成]
    B -->|撤销完成、到期或作废| D[从卡包移除]
    P --> G[点它进入接受页]
    G --> H[添加到钱包]
    H -->|凭据下发成功| L
    H -->|凭据下发失败，仍为待接受| P
    H -->|其他失败或没得到回应| RQ[重取这条分享的状态]
    RQ -->|待接受| P
    RQ -->|生效| L
    RQ -->|撤销中| R
    RQ -->|已作废、已撤销或已到期| D
    RQ -->|当前账号下取不到这条| D
    RQ -->|查询失败| UK[结果待确认，不让再点添加]
]]></metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55607a"/></marker></defs>
