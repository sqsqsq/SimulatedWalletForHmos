<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 790" width="1320" height="790" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>管理与撤销：按状态给出可做的事</title>
<metadata><![CDATA[%% 图源 spec §5.3 #3
flowchart TD
    A[分享管理页] --> B{这条分享的状态}
    B -->|待接受| PD[能否撤回待 D8，裁定前只展示]
    B -->|撤销中或已撤销| N[只展示，不提供撤销]
    B -->|已作废或已到期| RS[重新发起：进分享设置页新建一条]
    B -->|生效| C[车主撤销]
    C -->|车云受理| V[车辆侧即刻拒绝这把钥匙]
    C -->|失败或没得到回应| RL[重新拉列表，按车云状态显示]
    RL --> B
    V --> D{对方是否在线}
    D -->|在线| R[已撤销：对方卡片立即移除]
    D -->|离线| RP[撤销中：对方卡片最长 48 小时内收回]
    RP -->|对方回网或 48 小时到| R
]]></metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55607a"/></marker></defs>
