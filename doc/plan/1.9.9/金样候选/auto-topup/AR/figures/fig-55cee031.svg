<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>签约之后：交通卡云的触发、扣款与停用</title>
<metadata><![CDATA[%% 图源 spec §5.4 #1
flowchart TD
  A[卡片余额上报] --> B{低于门限？}
  B -->|否| Z[不触发]
  B -->|是| L{当日已达单日上限？}
  L -->|是| Z2[当日不再触发，次日零点恢复]
  L -->|否| O[卡云创建充值订单]
  O --> P{免密扣款}
  P -->|成功| W{写卡}
  W -->|完成| OK[充值成功，记录可见]
  W -->|未完成| ING[订单保持充值中，下次读卡补写]
  P -->|失败| F{连续失败满 3 次？}
  F -->|否| FR[本笔失败，记录带原因]
  F -->|是| DS[卡云停用签约]
]]></metadata>
