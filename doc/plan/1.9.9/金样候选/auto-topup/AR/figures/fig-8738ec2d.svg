<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>管理路径：写操作前的恢复确认、改档关闭与停用重签</title>
<metadata><![CDATA[%% 图源 SR §1 #2
%% 图源 spec §5.2 #1
flowchart TD
  M[管理页，云侧状态已确认] --> P[停用：查看停用原因与记录]
  M --> W{提交改档、关闭或重新签约前：恢复确认}
  W -->|有未结束的改档或关闭| PD
  W -->|授权后未建成| AF[未建成：再次开启方式待 D4，不拉起验证]
  W -->|取不到恢复信息| RQ[写操作暂不可用，提示重查]
  W -->|没有未结束操作与待处理授权| CH{用户提交的操作}
  CH --> N1[只改门限：不需验证]
  CH --> N2[改面额：更新前是否重新验证待定 D3]
  CH --> O[关闭自动充值]
  CH --> RE{重新签约：重查开通条件}
  N1 --> UP[卡云更新签约，原关系不断]
  N2 --> UP
  O --> CC[卡云解约]
  UP --> RS{本次结果}
  CC --> RS
  RS -->|明确成功| OK[按新状态展示]
  RS -->|明确拒绝| NO[保持原状态，说明这次没有生效]
  RS -->|结果未知| PD[操作确认中：再次查询状态与恢复确认]
  PD -->|原操作已终结| CUR[解除确认中，按云侧当前状态展示]
  PD -->|仍未结束或查询失败| WT[保持确认中，不能发起冲突操作]
  WT -->|用户再次查询| PD
  RE -->|满足| SG[走签约路径]
  RE -->|不满足，如开关关闭| NA[说明暂不能重新签约]
]]></metadata>
