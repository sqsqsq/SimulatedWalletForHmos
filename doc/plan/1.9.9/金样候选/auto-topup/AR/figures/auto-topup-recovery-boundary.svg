<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 860" width="1840" height="860" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>交通卡自动充值：谁持有哪些事实，清除改了什么，什么时候才能再写</title>
<metadata><![CDATA[综合阅读图 auto-topup-recovery-boundary（交通卡自动充值：事实持有与写入许可）
依据（业务事实以这些位置为准，本图只把它们放到同一视图）：
- AR/story.md 第 3 章参与方表（钱包端、交通卡云、支付部件各自持有什么）
- AR/story.md 7.2 写操作前的共同恢复规则（四种恢复结果、钱包端动作、解除条件）
- AR/story.md 2 术语「授权 与 签约」「签约关系的状态 与 操作是否已结束」「本地没有记录 与 没有未结束的操作」
- AR/story.md 8 验收「关闭未结束时再点入口」「停用后重签仍在处理」
- spec/spec.md §5.3 写操作前的恢复确认、§4.3 页面状态、§9.1.2 数据存储（wallet_auto_topup_contract、wallet_auto_topup_draft）
- spec/spec.md AC-6e、AC-8d
不是任何一张 Mermaid 的等值副本；改动依据后重画并重做独立审查。
]]></metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55607a"/></marker></defs>
<rect x="0" y="0" width="1840" height="860" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#1d2b4f">交通卡自动充值：谁持有哪些事实，清除改了什么，什么时候才能再写</text>
<text x="20" y="54" font-size="13" fill="#5a6684" text-anchor="start">清除只改钱包本地；能不能再写，先看对端的恢复确认：本地有没有记录不作依据，当前签约关系也解除不了未结束操作的限制。</text>
<rect x="20" y="72" width="440" height="262" rx="10" fill="#f7f9fc" stroke="#d5dceb"/>
<text x="32" y="94" font-size="13" font-weight="bold" fill="#5a6684">钱包本地（会被清除）</text>
<text x="240" y="322" font-size="12" fill="#5a6684" text-anchor="middle">只作先行与离线展示，不作能否写入的依据</text>
<rect x="480" y="72" width="770" height="262" rx="10" fill="#f4f8f2" stroke="#d5dceb"/>
<text x="492" y="94" font-size="13" font-weight="bold" fill="#5a6684">交通卡云（对端事实，清除不动它）</text>
<text x="610" y="300" font-size="12" fill="#5a6684" text-anchor="middle">关系决定能做哪类操作，</text>
<text x="610" y="318" font-size="12" fill="#5a6684" text-anchor="middle">解除不了恢复确认的限制</text>
<text x="742" y="196" font-size="12" fill="#5a6684" text-anchor="middle">两件事分开：关系已是目标值，</text>
<text x="742" y="214" font-size="12" fill="#5a6684" text-anchor="middle">原请求也可能还没结束</text>
<rect x="1270" y="72" width="300" height="262" rx="10" fill="#fbf6ee" stroke="#d5dceb"/>
<text x="1282" y="94" font-size="13" font-weight="bold" fill="#5a6684">支付部件（对端事实）</text>
<text x="1460" y="214" font-size="12" fill="#5a6684" text-anchor="end">授权形成了</text>
<text x="1460" y="232" font-size="12" fill="#5a6684" text-anchor="end">不等于签约建成</text>
<text x="240" y="444" font-size="12" fill="#5a6684" text-anchor="middle">不撤销对端已受理的操作，也不撤销已形成的授权</text>
<text x="765" y="402" font-size="12" fill="#5a6684" text-anchor="end">签约、重新签约、改档、</text>
<text x="765" y="420" font-size="12" fill="#5a6684" text-anchor="end">关闭之前各取一次</text>
<text x="30" y="540" font-size="13" fill="#5a6684" text-anchor="start" font-weight="bold">恢复结果</text>
<text x="30" y="642" font-size="13" fill="#5a6684" text-anchor="start" font-weight="bold">钱包端怎么做</text>
<text x="30" y="740" font-size="13" fill="#5a6684" text-anchor="start" font-weight="bold">什么时候解除</text>
<text x="680" y="745" font-size="12" fill="#5a6684" text-anchor="middle">直接写入，没有要解除的限制</text>
<text x="1700" y="486" font-size="13" fill="#5a6684" text-anchor="middle" font-weight="bold">关系看起来能写，仍被挡住</text>
