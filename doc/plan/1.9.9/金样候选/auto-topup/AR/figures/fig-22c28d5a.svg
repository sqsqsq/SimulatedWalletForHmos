<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>签约关系的状态</title>
<metadata><![CDATA[stateDiagram-v2
  [*] --> 未签约
  未签约 --> 生效: 签约成功
  生效 --> 未签约: 用户关闭
  生效 --> 停用: 扣款连续失败 3 次
  停用 --> 生效: 重新签约成功
  note right of 生效: 改门限或面额在生效态内完成，签约关系不断
]]></metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55607a"/></marker></defs>
<rect x="0" y="0" width="980" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#1d2b4f">签约关系的状态</text>
<line x1="530" y1="225" x2="530" y2="330" stroke="#d6b84a" stroke-dasharray="4 3"/>
<path d="M 830.0,225.0 L 830.0,270.0 L 550.0,270.0 L 550.0,225.0" fill="none" stroke="#55607a" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 550.0,175.0 L 550.0,130.0 L 830.0,130.0 L 830.0,175.0" fill="none" stroke="#55607a" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 510.0,225.0 L 510.0,270.0 L 230.0,270.0 L 230.0,225.0" fill="none" stroke="#55607a" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 230.0,175.0 L 230.0,130.0 L 530.0,130.0 L 530.0,175.0" fill="none" stroke="#55607a" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 80.0,200.0 L 165.0,200.0" fill="none" stroke="#55607a" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="70" cy="200" r="10" fill="#1d2b4f"/>
<rect x="165.0" y="175.0" width="130" height="50" rx="6" fill="#eef4ff" stroke="#5b7fc7" stroke-width="1.5"/>
<text x="230" y="205.0" font-size="14" fill="#1d2b4f" text-anchor="middle">未签约</text>
<rect x="465.0" y="175.0" width="130" height="50" rx="18" fill="#e6f6ea" stroke="#3f9a5a" stroke-width="1.5"/>
<text x="530" y="205.0" font-size="14" fill="#123d20" text-anchor="middle">生效</text>
<rect x="765.0" y="175.0" width="130" height="50" rx="18" fill="#fdecea" stroke="#c8554b" stroke-width="1.5"/>
<text x="830" y="205.0" font-size="14" fill="#561712" text-anchor="middle">停用</text>
<rect x="330" y="331.0" width="400" height="28" rx="4" fill="#fffbe6" stroke="#d6b84a"/>
<text x="530.0" y="349.5" font-size="13" fill="#4a3b00" text-anchor="middle">改门限或面额在生效态内完成，签约关系不断</text>
<rect x="349.1" y="119.0" width="61.8" height="22" rx="4" fill="#ffffff" stroke="#e1e5ee"/>
<text x="380" y="134.5" font-size="12.5" fill="#34405c" text-anchor="middle">签约成功</text>
<rect x="349.1" y="259.0" width="61.8" height="22" rx="4" fill="#ffffff" stroke="#e1e5ee"/>
<text x="380" y="274.5" font-size="12.5" fill="#34405c" text-anchor="middle">用户关闭</text>
<rect x="629.0" y="119.0" width="122.0" height="22" rx="4" fill="#ffffff" stroke="#e1e5ee"/>
<text x="690" y="134.5" font-size="12.5" fill="#34405c" text-anchor="middle">扣款连续失败 3 次</text>
<rect x="646.2" y="259.0" width="87.7" height="22" rx="4" fill="#ffffff" stroke="#e1e5ee"/>
<text x="690" y="274.5" font-size="12.5" fill="#34405c" text-anchor="middle">重新签约成功</text>
</svg>
