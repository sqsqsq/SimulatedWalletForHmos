<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1090" width="1300" height="1090" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<title>签约路径：从详情页入口到签约建成</title>
<metadata><![CDATA[%% 图源 SR §1 #1
%% 图源 spec §5.1 #1
flowchart TD
  A[打开交通卡详情页] --> S{本账号这张卡的云侧签约状态}
  S -->|生效或停用| MG[入口进管理页]
  S -->|状态未知| UN[显示未知或副本旧值，点入重新查询]
  S -->|未签约| G{开关开且支付能力可用}
  G -->|否| H[不显示入口]
  G -->|是| RC{点入：恢复确认}
  RC -->|授权后未建成| F
  RC -->|有未结束的创建| U
  RC -->|取不到恢复信息| RF[留在详情页，提示重查]
  RC -->|没有未结束操作与待处理授权| R{实名结果}
  R -->|未实名或读不到| RN[引导实名]
  RN -->|实名完成| P
  R -->|已实名| P{取策略}
  P -->|signable=false| NS[留在详情页，说明不可签约]
  P -->|策略查询失败| PF[留在详情页，提示稍后重试]
  P -->|signable=true| B[签约页选门限与面额]
  B --> C[免密验证]
  C -->|取消或未通过| B
  C -->|通过，返回协议号| D[卡云建签约关系]
  D -->|成功| E[详情页显示已开启]
  D -->|卡片已有生效签约| MG
  D -->|明确失败| F[未建成：保留选择与已知结果，再次尝试方式待 D4]
  D -->|超时，结果未知| Q{查询云侧签约状态}
  Q -->|已生效| E
  Q -->|云侧无签约或仍为原停用关系| F
  Q -->|查询也失败| U[结果待确认，可稍后再查]
]]></metadata>
