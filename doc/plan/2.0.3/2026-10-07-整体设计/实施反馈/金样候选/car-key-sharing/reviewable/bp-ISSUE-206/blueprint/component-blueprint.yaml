review_summary:
  title: 数字车钥匙分享（钱包端）— 部件演进蓝图
  summary: 钱包端（WalletMain）承载数字车钥匙分享的端侧链路：车主发起分享（对象/权限/有效期三要素、配额、草稿续办）、被分享人接受、双方状态管理与撤销。分享关系真源在车云、钥匙可用性裁决在车厂云，钱包端只做端侧
    UI、端云调用、草稿与状态展示，不裁决钥匙可用性。本演进新增四个页面与一个数据服务，全部落在 WalletMain（02-Feature）。
