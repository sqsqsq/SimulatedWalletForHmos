story_details:
  - id: detail-share-draft-policy
    kind: data_policy
    title: 发起草稿 key_sharing_draft
    body: 发起草稿存联系人、权限档位、有效期与幂等标识。发起途中退出或断网回合回来凭它接着办，同一幂等标识不发出第二条；发出成功即清除。按账号隔离，退出登录清除。
    evidence_refs:
      - view:runtime/node:share-draft-store
  - id: detail-share-flag
    kind: configuration
    title: 分享功能开关
    body: 默认关闭，随版本放开；关闭后不能发起新分享，已生效分享不受影响。权限档位文案由云侧配置下发，端侧不写死。
    evidence_refs:
      - view:logical/node:feature-flag
  - id: detail-share-events
    kind: event
    title: 分享事件统计
    body: >-
      上报分享发起、接受、撤销、失效四类事件，只带车型类别、阶段与结果分类，不带车牌、账号、位置；上报失败不改变分享关系。统计点按
      WalletHAManager Chart 登记（现仓仅 Wallet_COMMON 模板，事件 ID 待登记）。


      | 统计点 | 业务动作 | 实际适用结果 | 本端获知时机 | 已有覆盖或新增 | 代码现状 |

      |---|---|---|---|---|---|

      | 分享流程 / 发起 | 提交创建分享 | 成功 / 签发失败 / 请求失败 | 创建响应或通信失败 | 新增 | 检索零命中 |

      | 分享流程 / 接受 | 提交接受 | 凭据下发成功 / 失败 | 接受响应 | 新增 | 检索零命中 |

      | 分享流程 / 撤销 | 提交撤销 | 立即失效 / 撤销中 / 撤销请求失败 | 撤销响应 | 新增 | 检索零命中 |

      | 分享流程 / 失效 | 已生效分享到期、作废、撤销完成等失效 | 自然到期 / 作废 / 已撤销 | 列表拉取或状态刷新 | 新增 |
      检索零命中 |
    evidence_refs:
      - view:runtime/flow:share-mutate-flow
