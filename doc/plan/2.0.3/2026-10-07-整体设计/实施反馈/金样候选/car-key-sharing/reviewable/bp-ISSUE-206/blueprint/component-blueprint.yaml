app_lens:
  module_boundaries:
    disposition: answered_with_evidence
    answer: 分享实现全部落在 WalletMain（02-Feature），跨模块只经 index.ets；账号域复用
      AccountManager，脱敏/日志/导航复用 CommFunc
    evidence_refs: *a12
  capability_seams:
    disposition: answered_with_evidence
    answer: 端云接口经 KeySharingRepository 单一入口封装；对外不暴露除钱包 UI 之外的 seam
    evidence_refs: *a13
  feature_flags:
    disposition: answered_with_evidence
    answer: 分享功能开关（默认关闭随版本放开），关闭后不能发起新分享、已生效分享不受影响；配置落 WalletMain 常量
    evidence_refs: *a14
  data_producers_consumers:
    disposition: answered_with_evidence
    answer: 车云 produce 分享状态；KeySharingRepository consume 并投影到管理页/接受页；草稿
      key_sharing_draft 仅端侧使用
    evidence_refs: *a15
  lifecycle_triggers:
    disposition: answered_with_evidence
    answer: 六类触发条件逐条评估：列表拉取/page_enter、写操作/on-submit、账号切换、进程重建均已在 flow 中闭合
    evidence_refs: *a16
  state_owners:
    disposition: answered_with_evidence
    answer: 分享状态真源在车云，端侧 share-repository 为投影 owner；草稿状态 owner 为
      share-draft-store；状态 owner 无歧义
    evidence_refs: *a17
  initialization:
    disposition: answered_with_evidence
    answer: 冷启动按进页路径拉取列表；设置页读草稿续办；初始化不落堆本地列表缓存
    evidence_refs: *a18
  publication_subscription:
    disposition: answered_with_evidence
    answer: share-mutate-flow 内 publication:share-status 经 subscription
      通知管理/接受侧刷新；订阅在页挂载/卸载时 attach/detach/cleanup
    evidence_refs: *a19
  ui_refresh:
    disposition: answered_with_evidence
    answer: 管理页列表每次进页拉取、不缓存；断网给网络失败态；刷新确定性由进页路径与失败态保证
    evidence_refs: *a20
  process_recovery:
    disposition: answered_with_evidence
    answer: 进程重建后：分享列表按进页路径重拉；发起草稿从 key_sharing_draft 恢复续办
    evidence_refs: *a21
  runtime_flow_trigger_assessment:
    persistent_or_remote_ui:
      applies: true
      evidence_refs:
        - doc/features/ISSUE-206/SR/design.md
        - view:runtime/flow:share-status-flow
    multiple_consumers:
      applies: true
      evidence_refs:
        - view:runtime/node:share-manage-view
    background_system_external_scheduled_write:
      applies: false
      evidence_refs:
        - doc/features/ISSUE-206/SR/design.md
    cold_start_resume_mount_account_switch:
      applies: true
      evidence_refs:
        - doc/features/ISSUE-206/SR/design.md
    user_mutation_refreshes_other_consumers:
      applies: true
      evidence_refs:
        - doc/features/ISSUE-206/SR/design.md
        - view:runtime/flow:share-mutate-flow
    cache_sync_freshness_consistency_process_recreation:
      applies: true
      evidence_refs:
        - doc/features/ISSUE-206/SR/design.md
        - view:runtime/flow:share-status-flow
