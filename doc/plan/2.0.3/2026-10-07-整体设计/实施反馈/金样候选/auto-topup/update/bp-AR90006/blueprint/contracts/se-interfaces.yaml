# SE 端云接口转写（AR90006 交通卡自动充值）
# 由设计作者按冻结 SR 原文与会议记录转写；蓝图 `contracts` 各段以 `source_ref` 指向本文件对应段。
# 来源：doc/features/AR90006/AR/story-src/inputs/0ac5c65d6bbdec3bcf0d1a3d744e7e481e5c147e13a02c97a901cb32be792fea/files/SR/design.md
#       + 会议 T1（updateAutoTopupContract 新增）doc-refresh.md / raw.md
operations:
  getAutoTopupPolicy:
    operation_id: getAutoTopupPolicy
    direction: outbound
    version: "1.0"
  createAutoTopupContract:
    operation_id: createAutoTopupContract
    direction: outbound
    version: "1.0"
  getAutoTopupStatus:
    operation_id: getAutoTopupStatus
    direction: outbound
    version: "1.0"
  cancelAutoTopupContract:
    operation_id: cancelAutoTopupContract
    direction: outbound
    version: "1.0"
  updateAutoTopupContract:
    operation_id: updateAutoTopupContract
    direction: outbound
    version: "1.0"

dtos:
  AutoTopupPolicyRequest:
    dto_id: AutoTopupPolicyRequest
    fields:
      - field_id: accountId
        type: string
        required: true
        nullable: false
        semantics: 去标识账号
      - field_id: cardId
        type: string
        required: true
        nullable: false
        semantics: 卡片标识
  AutoTopupPolicyResponse:
    dto_id: AutoTopupPolicyResponse
    fields:
      - field_id: signable
        type: boolean
        required: true
        nullable: false
        semantics: 是否可签约
      - field_id: unsignableReason
        type: string
        required: true
        nullable: true
        semantics: 不可签约的原因（如未实名），可签约时为空
      - field_id: thresholdOptions
        type: "int[]"
        required: true
        nullable: false
        semantics: 门限档位
      - field_id: amountOptions
        type: "int[]"
        required: true
        nullable: false
        semantics: 面额档位
      - field_id: dailyLimit
        type: int
        required: true
        nullable: false
        semantics: 单日限额
      - field_id: agreementText
        type: string
        required: true
        nullable: false
        semantics: 协议文案
  CreateAutoTopupContractRequest:
    dto_id: CreateAutoTopupContractRequest
    fields:
      - field_id: accountId
        type: string
        required: true
        nullable: false
        semantics: 去标识账号
      - field_id: cardId
        type: string
        required: true
        nullable: false
        semantics: 卡片标识
      - field_id: agreementNo
        type: string
        required: true
        nullable: false
        semantics: 支付部件返回的协议号
      - field_id: threshold
        type: int
        required: true
        nullable: false
        semantics: 触发门限
      - field_id: amount
        type: int
        required: true
        nullable: false
        semantics: 单笔充值面额
  CreateAutoTopupContractResponse:
    dto_id: CreateAutoTopupContractResponse
    fields:
      - field_id: contractNo
        type: string
        required: true
        nullable: false
        semantics: 签约号
      - field_id: existed
        type: boolean
        required: true
        nullable: false
        semantics: 是否为既有生效签约（true 时没有新建）
  GetAutoTopupStatusRequest:
    dto_id: GetAutoTopupStatusRequest
    fields:
      - field_id: accountId
        type: string
        required: true
        nullable: false
        semantics: 去标识账号
      - field_id: cardId
        type: string
        required: true
        nullable: false
        semantics: 卡片标识
  GetAutoTopupStatusResponse:
    dto_id: GetAutoTopupStatusResponse
    fields:
      - field_id: contractStatus
        type: string
        required: true
        nullable: false
        semantics: none / active / disabled
      - field_id: contractNo
        type: string
        required: true
        nullable: true
        semantics: 未签约时为空
      - field_id: threshold
        type: int
        required: true
        nullable: true
        semantics: 当前门限，未签约时为空
      - field_id: amount
        type: int
        required: true
        nullable: true
        semantics: 当前面额，未签约时为空
      - field_id: recentRecords
        type: "object[]"
        required: true
        nullable: false
        semantics: 最近记录，可为空列表；每项含 time、amount、result
      - field_id: consecutiveFailures
        type: int
        required: true
        nullable: false
        semantics: 连续扣款失败次数
      - field_id: disabledReason
        type: string
        required: true
        nullable: true
        semantics: 停用原因，未停用时为空
  CancelAutoTopupContractRequest:
    dto_id: CancelAutoTopupContractRequest
    fields:
      - field_id: contractNo
        type: string
        required: true
        nullable: false
        semantics: 签约号
  CancelAutoTopupContractResponse:
    dto_id: CancelAutoTopupContractResponse
    fields:
      - field_id: cancelled
        type: boolean
        required: true
        nullable: false
        semantics: 是否已解约
  UpdateAutoTopupContractRequest:
    dto_id: UpdateAutoTopupContractRequest
    fields:
      - field_id: contractNo
        type: string
        required: true
        nullable: false
        semantics: 签约号（会议 T1：原签约关系不断）
      - field_id: threshold
        type: int
        required: true
        nullable: false
        semantics: 触发门限（改动值）
      - field_id: amount
        type: int
        required: true
        nullable: false
        semantics: 单笔充值面额（改动值）
  UpdateAutoTopupContractResponse:
    dto_id: UpdateAutoTopupContractResponse
    fields:
      - field_id: updated
        type: boolean
        required: true
        nullable: false
        semantics: 是否已更新（字段为待定占位，细节由卡云定稿；见蓝图 gap update-response）

errors:
  items: 卡云统一错误结构（错误码 + 可读信息），本需求不新增错误码

idempotency:
  getAutoTopupPolicy:
    rule: 只读查询，天然幂等
  createAutoTopupContract:
    rule: 创建签约以「卡片 + 生效状态」判重，已有生效签约返回既有 contractNo
  getAutoTopupStatus:
    rule: 只读查询，天然幂等
  updateAutoTopupContract:
    rule: 按 contractNo 更新门限面额，原签约关系不断；重复提交按目标值收敛
  cancelAutoTopupContract:
    rule: 解约不回滚进行中的订单；重复解约幂等返回已解约结果

nfr:
  requirements:
    - 金额一律以「分」为单位的整数
    - createAutoTopupContract 失败或超时的协议号复用时限待卡云与支付对齐（会议 T6，见蓝图 gap agreement-retry）