story_details:
- id: detail-auto-topup-config
  kind: configuration
  title: 自动充值配置项
  body: '| 配置项 | 取值与来源 | 影响 |\n|---|---|---|\n| 自动充值功能开关 | 运营管理台下发；配置不可用按关闭处理 | 只管新签约：关闭后未签约用户看不到入口，已签约用户入口不隐藏、自动充值照常 |\n| 门限档位、面额档位 | getAutoTopupPolicy 返回，运营下发；现行值 5 / 10 / 20 / 30 元与 20 / 50 / 100 元
    | 签约页的单选项 |\n| 单日充值上限 | getAutoTopupPolicy 返回 dailyLimit，本期 200 元（产品需求 v1.1 的 300 元经决策记录 D11 不采纳） | 协议文案写明单日上限 200 元；达到上限当日不再触发、不计入连续失败 |\n'
  evidence_refs:
  - contract:getAutoTopupPolicy
  - view:development/node:auto-topup-entry-builder
- id: detail-auto-topup-events
  kind: event
  title: 签约与管理运维统计点
  body: '| 统计点 | 触发时机 | 携带字段 | 结果分类 |\n|---|---|---|---|\n| 策略加载 | 进入签约时 getAutoTopupPolicy 返回后 | 去标识账号、卡片类型、阶段 | 成功 / 失败 |\n| 创建签约 | createAutoTopupContract 返回或超时后 | 去标识账号、卡片类型、阶段、失败原因分类 | 成功 / 明确失败 /
    结果未知 |\n| 状态查询 | getAutoTopupStatus 返回后 | 去标识账号、卡片类型、阶段 | 成功 / 失败 |\n| 改档 | updateAutoTopupContract 返回后 | 去标识账号、卡片类型、阶段 | 成功 / 失败 |\n| 解约 | cancelAutoTopupContract 返回后 | 去标识账号、卡片类型、阶段 | 成功 / 失败 |\n\n事件不带卡号、金额明细与支付参数，上报失败不改变业务结果；事件号、内码与分类由施工单位的
    Plan 按项目埋点协议登记。\n'
  evidence_refs:
  - view:runtime/flow:flow:auto-topup-signup-bind
  - view:runtime/flow:flow:auto-topup-status-manage
