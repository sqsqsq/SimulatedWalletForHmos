review_summary:
  title: 交通卡自动充值（钱包端）— 部件演进蓝图
  summary: 钱包端交通卡自动充值：签约入口与签约交互、状态展示与管理、未实名引导与端侧暂存。判定与扣款都在服务端；端侧通过交通卡云五个接口实现签约/状态/改档/解约，并经支付部件完成免密验证。人已确认整体承载（无拆分），会议 T1–T4/T6 已裁决，T5 已采纳。入口可见性按矩阵细分（可签约/未实名/开关/已签约）；改档/关闭走 update/cancel 原关系不断。
