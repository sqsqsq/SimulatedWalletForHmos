    sample_usage: "PRD: 钱包强绑定华为账号，账号切换后清空本地缓存"
    confidence_hint: |
      catalog AccountManager.typical_business_terms 精确命中；one_liner 即定义为'华为账号管理'。
      **alias '账户' 的消歧**（来自 catalog NOT_responsible_for[3]）：
      - 指华为登录身份 → 本 term（AccountManager）
      - 指钱包业务账户（余额/流水/账户中心等）→ 不归本模块，属未来 WalletAccount 类模块
    easily_confused_with: []
