    confidence_hint: "catalog WalletMain.typical_business_terms 精确命中 (添卡入口 / 添卡 / 添加卡片 三个别名都在)；responsibilities 第 4 条只做分流、不实现具体添加逻辑"
    easily_confused_with: []

